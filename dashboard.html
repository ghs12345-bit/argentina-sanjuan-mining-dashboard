entrate on the north, central, and south zones of the property, whic were estimated to host 6 million oz of gold.  (Inlet PR 2/2/99) _x000D_\n\tIn November 1998, Inlet Resources reported that it reached a preliminary agreement to obtain an option to acquire up to 100% of a package of gold exploration properties in Argentina, including Cerro Toro, from Biometric Security.  (GCNL 11/30/98)_x000D_\n\tAs of February 1998, Sonoma was continuing its search for a joint venture partner for the Cerro Toro property.  The company had shifted its focus and was interested in acquiring a new property.  (PC 2/98)  In September 1997, Sonoma reported that it was reviewing several projects in North America.  (Sonoma PR 9/24/97)T","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"Consultant Barry Price delivered a compilation report on previous work performed on the property.  (Inlet PR 2/2/99)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"The property covers 9,354 ha.  (GCNL 11/30/98)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Cerro Toro","DISTANCE_FROM":"60 km W of El Puesto","LOCATION_COMMENTS":null,"ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"North-trending alteration zones cover an area 3,500 m long by 200 to 800 m wide and are located in an area underlain by Tertiary volcanic, volcaniclastic, and clastic rocks into which a dacite dome has intruded.  The sequence is cut by major NE and NW-trending regional faults.  Strong argillic alteration is accompanied by silicification, alunite, pyrophyllite, and a series of stockworks and veins containing gold, silver, copper, lead, and zinc mineralization.  The North zone is covered by gypcrete alteration.  (Inlet PR 2/2/99)_x000D_\n\tAn L-shaped N-S and NW-SE fault-controlled strongly fractured mineralized alteration zone is intruded by an elongated highly fractured and altered dacitic porphyry._x000D_\n\tArgillization, sericitization, and silicification are the most abundant and widespread hydrothermal alterations on the property.  (GCNL 11/30/98)","EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":null,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":null,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":null,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":null,"CONTAINED_RESV_Ag_oz":null,"GRD_MEAS_IND_Au_gpt":null,"GRD_MEAS_IND_Ag_gpt":null,"CONTAINED_MEAS_IND_Au_oz":null,"CONTAINED_MEAS_IND_Ag_oz":null,"GRD_INF_Au_gpt":null,"GRD_INF_Ag_gpt":null,"CONTAINED_INF_Au_oz":null,"CONTAINED_INF_Ag_oz":null,"GRD_TOTAL_RESRC_Au_gpt":null,"GRD_TOTAL_RESRC_Ag_gpt":null,"CONTAINED_TOTAL_RESRC_Au_oz":null,"CONTAINED_TOTAL_RESRC_Ag_oz":null,"GRD_R_AND_R_Au_gpt":null,"GRD_R_AND_R_Ag_gpt":null,"CONTAINED_R_AND_R_Au_oz":null,"CONTAINED_R_AND_R_Ag_oz":null},{"PROP_NAME":"Chita Valley","PROP_ID":39443,"PRIMARY_COMMODITY":"Copper","ALSO_KNOWN_AS":"Arqueros, Brechas Vacas, Brechas Vacas Oeste, Cateos, Chinchillones, Chita, Chita Este, Chita Norte, Chita North, Chita South, Chita Sur, Condor, Dacites North, Don Marcos, Estrellita, Fortuna I, Link Zone, Lucrecia, Mabel, Manifestaciones de Descubrimiento, Mina Gabriela, Minas de Pinto, North Chita Porphyry, Paulita, Paulita II, Pierina II, Pierina III, Placetas, Placetas North, Proyecto Brechas Vacas, PSU, Romina, Rosita II, San Marcos, San Pablo, San Urbano, South Chita Porphyry","DEV_STAGE":"Reserves Development","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"02/2025","MINE_TYPE1":"Open Pit","MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Copper,Molybdenum,Silver,Gold,Lead,Zinc,Rhenium","OPERATOR_NAME":"South32 Limited","OPERATOR_COMMON_NAME":"South32 Ltd.","OPERATOR_COUNTRY":"Australia","OPERATOR_MKT_CAP":22207.05077584,"OWNER_LIST":"Minsud Resources Corp. (Optionor) 20%; Compañía De Tierras Sud Argentino S.A. (Optionor) %; South32 Limited (Optionee) 80%","ROYALTY_HOLDER_LIST":"Unnamed Owner (NSR) 0%Troy Resources Limited (NSR) 0%","OWNER_NAME":"South32 Limited","CURRENT_OWNER_COMMON_NAME":"South32 Ltd.","OWNER_TYPE":"Optionee","OWNER_PCT":80,"CURRENT_CONTROLLING_OWN_PCT":80,"OWNER_COUNTRY":"Australia","OWNER_MKT_CAP":22207.05077584,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-30.55137,"LONGITUDE":-69.52132,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In July 2025, Minsud reported that it will complete its planned 5,400-m expansion drill program and planned exploration activities at Chita Valley. (Minsud PR July 29, 2025)_x000D_\n   In February 2025, a NI 43-101 technical report was released in support of the maiden a maiden Mineral Resource estimate for the Chinchillones. (Minsud TR Feb 14, 2025)_x000D_\n   Also in January 2025, Minsud completed the maiden, pit-constrained mineral resource estimate for Chinchillones at Chita. (Minsud PR Jan 27, 2025)_x000D_\n   In January 2025, Minsud reported completion of diamond drill program for 134 diamond drill holes of 82,104 m. (Minsud PR Jan 17, 2025)_x000D_\n   In October 2024, Minsud completed phase-four infill drill program at Chinchillones and also started a 19-hole, totaling 11,850-m scouting drill program at Link Zone, Dacites North, and Placetas North. (Minsud PR Oct 28, 2024)_x000D_\n   In September 2024, Minsud reported that it has completed 25 holes totaling 15,796-m of the ongoing phase four infill drill program with 3 holes totaling 1,450-m are pending at Chita Valley with maiden mineral resource estimate for the Chinchillones by the end of December 2024 quarter.  (Minsud PR Sept 4, 2024)_x000D_\n   In June 2024, Minsud reported that drilling program has been resumed at Chita Valley. (Minsud PR June 27, 2024)_x000D_\n   In April 2024, South32 targeted to announce maiden mineral resource in 2025, with infill drilling and resource estimation underway at Chita Valley. (South32 PR May 14, 2024)_x000D_\n   In February 2024, Minsud completed a 98-hole, 63,168-m phase four drill program at Chita Valley. (Minsud PR Feb 14, 2024)_x000D_\n   In November 2023, Minsud completed 52-holes totaling 38,991-m in phase IV scout drill program at Chita Valley. An initial drill program of 25,000-m in 30-DD holes are planned and expected to be completed by mid-2024. (Minsud PR Nov 20, 2023)_x000D_\n   In August 2023, Minsud completed 40-holes totaling 28,674-m in phase IV scout drill program at Chita Valley. (Minsud PR Aug 1, 2023)_x000D_\n   During the March 2023 quarter, Minsud reported that as of the date 36 drill holes has been completed for a total of 24,619.5-m at Chita Valley. (Minsud MD&A May 30, 2023)_x000D_\n   In February 2022, Minsud reported South32's intention to fund the year four exploration budget and program at Chita Valley which would include two drill rigs to deliver a DD program of up to 21,700-m, Geophysical magnetotellurics (MT) survey and Metallurgical studies.(Minsud PR Feb 3, 2023)_x000D_\n   In October 2022, Minsud planned to complete a 26,000-m drill program by the March 2023 quarter at Chita Valley. (Minsud PR Oct 13, 2022)_x000D_\n   In May 2022, Minsud started phase-four drill program with 10-hole 6,500-m drill program at Chinchillones and two-hole 1,300-m drill program at Link Zone. (Minsud PR May 6, 2022)_x000D_\n   In February 2022, Minsud completed 24 holes 11,970-m drill program at Chita. (Minsud PR Feb 24, 2022)_x000D_\n  In December 2021, Minsud reported 8 drill holes completed with assay results in the ongoing phase 3 drill program. The annual drilling program consisting of 12,000-m will be completed by the end of December 2021. (Minsud PR Dec 13, 2021)_x000D_\nIn November 2021, Minsud announced that South32 intended to fund the third tranche exploration activities in 2022 as per the earn-in agreement executed on November 1, 2019. The 2022 program will include in-fill and scouting drilling at Chinchillones. (Minsud PR Nov 9, 2021)_x000D_\n   In October 2021, Minsud planned to extend drill program and were expecting to complete a total of 12,000-m by the end of the year 2021 at Chita. (Minsud PR Oct 7, 2021) _x000D_\n   In May 2021, Minsud start Phase 3 6,100 m drill program at Chita. (Minsud PR May 12, 2021)_x000D_\n   In February 2021, Minsud completed Pahse 2 12 holes 5,818-m DD program at Chita Valley. (Minsud PR Feb 5, 2021)_x000D_\n   In September 2020, Minsud started a nine-hole, 4,100-m phase two DD program at Chita Valley. (Minsud PR Sept 30, 2020)_x000D_\n   In June 2020, Minsud completed scout drill program in six holes for 3,559-m at Chita Valley. (Minsud PR June 23, 2020)_x000D_\n   In Feb 2020, Minsud started a four hole, 2000-m DD program at Chita Valley. (Minsud Feb 7, 2020)_x000D_\n   In March 2018, Minsud released an NI43-101 compliant Technical Report in support of an updated mineral resource estimate at Chita Valley. Recommended work included completion of outline diamond drilling at Chita Porphyry South and exploration drilling at Chita Porphyry. (Minsud Mar 26, 2018)_x000D_\n   In early February 2018, Minsud reported an updated NI 43-101 compliant resources estimate for Chita Valley. Indicated and inferred resources totaled 41.6 million mt grading 0.42% Cu, 0.07 g/mt Au, 2.17 g/mt Ag, and 0.017% Mo. (Minsud PR Feb 7, 2018)_x000D_\nAs of December 2017, Minsud completed 1,455-m HQ diamond drill program at its Chita Valley project. The program included 8 new holes together with deepening of 7 existing holes. (Minsud PR Dec 29, 2017) _x000D_\n   In October 2017, Minsud has re-commenced the 1,500-m diamond drilling program in the Chita project to find the extend of mineralization for increase in mineral resource estimates. (Minsud PR Oct 13, 2017)_x000D_\n   In early January 2017, Minsud reported an updated NI 43-101-compliant resources estimate for Chita Valley. Inferred resources totaled 37 million mt grading 0.44% Cu, 0.07 g/mt Au, 2.2 g/mt Ag, and 0.018% Mo. (Minsud PR Jan 4, 2017)_x000D_\n   In early November 2016, Minsud completed a 1,700-m, 12-hole DD program at Chita. The company planned a bench scale process test work to investigate the commercial possibilities for processing and recovering the key metals. (Minsud PR Nov 01, 2016) _x000D_\n   In September 2016, Minsud announced the closing of the previously announced private placement of C$1.5 million. (Minsud PR Sept 2, 2016)_x000D_\n   Early August, Minsud announced a non-brokered private placement for C$1.5 million. Part of the net proceeds will be used to continue exploration of the Chita porphyry, including 1,700 meters DDH drilling  and metallurgical tests. (Minsud PR Aug 9, 2016)_x000D_\n   In July 2016, Minsud completed a restructuring and second addendum to the Brechas Vacas Option Agreement. The semiannual staggered cash payment was now $480,000 which was $450,000 previously. The period of payment was extended for two years and payments in Minsud’s common shares were eliminated. Final payment was reduced from $535,000 to $200,000. Also, the NSR was reduced from 1.5% to 0.6% having MSA the option of acquiring 50% of the NSR for $400,000. (Minsud PR July 4, 2016)_x000D_\n   In April 2016, Minsud completed the previously announced non-brokered private placement through raisings of C$1 million. (Minsud PR Apr 20, 2016)_x000D_\n   In March 2016, Minsud announced its intention to complete a non-brokered private placement of units of the Company through raisings of C$1,000,000. A portion of proceeds will be used to continue exploring the Cu-Mo-Ag-Au deposit at the Chita porphyry and payments related to option agreements and financing of mining rights acquisitions. (Minsud PR Mar 31, 2016)_x000D_\n   In February 2016, Minsud released a Technical Report with an updated mineral resources estimate for the Chita Valley project. Recommended work included geological and topographical mapping. (Minsud TR Feb 1, 2016)_x000D_\n   Also in December 2015, Minsud issued units of the company in exchange for certain drilling services performed at Chita Valley. The payment in units constitutes about 30% of the total fee owed to the service provider amounting to C$259,772. (Minsud PR Dec 21, 2015)_x000D_\n   In mid-December 2015, Minsud reported an updated mineral resource estimate at Chita Valley. Inferred resources totaled 31.5 million mt grading 0.45% Cu, 0.067 g/mt Au, 2.22 g/mt Ag and 0.017% Mo, using a cutoff grade of 0.30% Cu. (Minsud PR Dec 18, 2015)_x000D_\n   In December 2015, Minsud reported the results of its recently completed 22-hole, 4,088-m DD program at Chita Valley. An updated resource estimate was expected before the end of 2015. (Minsud PR Dec 10, 2015)_x000D_\n   In mid-September  2015, Minsud closed the second tranche of the previously announced C$2 million private placement for gross proceeds of C$578,000. A portion of the proceeds would be used for the 5,300-m drill program at Chita Valley. (Minsud PR Sept 15, 2015)_x000D_\n   In early September 2015, Minsud announced that it would commence a 22 hole 5,300-m DD program in the Chita Porphyry sector at Chita Valley.  (Minsud PR Sept 8, 2015)    _x000D_\n   In August 2015, Minsud announced the first closing of its previously announced C$2 million private placement raising C$1.3 million. (Minsud PR Aug 20, 2015)_x000D_\n   In mid-August 2015, Minsud announced a C$2 million private placement. A portion of the proceeds would be used for a drill program at Chita Valley. (Minsud PR Aug 13, 2015)_x000D_\n   In late May 2015, Minsud reported an initial NI 43-101-compliant resources estimate at Chita Valley. Inferred resources totaled 18.3 million mt grading 0.44% Cu, 0.07 g/mt Au, 2.4 g/mt Ag, and 0.019% Mo. In addition, the company commissioned a petrographic and scanning electron microscopy analysis of mineralized material and scoping level metallurgical testwork focusing on leachable copper during the December 2014 quarter. (Minsud PR May 29, 2015)_x000D_\n   In April 2015, Minsud closed the previously announced C$900,000 private placement. A portion of the proceeds would be used to continue exploration program at Chita Valley. (Minsud April 9, 2015)_x000D_\n   In early March 2015, Minsud intended to complete a C$900,000 nonbrokered private placement. A portion of the proceeds would be used to continue exploration program at Chita Valley. (Minsud PR Mar 4, 2015)_x000D_\n   In late September 2014, Minsud planned to complete an 18-hole, 2,200-m DD program at the South Porphyry at Chita Valley. (Minsud PR 9/22/14)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In March 2018, Minsud reported the following contractors in relation to the project:- droneXplora-ConsultoresGIS (2016). (Minsud TR Mar 26, 2018)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of December 2022, Chita Valley covered a total surface area of 19,852 ha. (Minsud PR Dec 14, 2022)_x000D_\n    As of May 2020, Minas de Pinto consisted of Arqueros, San Marcos, Estrellita, Paulita, Paulita II, Pierina II, Pierina III, San Pablo, San Urbano and Rosita II, covering a total area of 2,445 hectares. (Minsud PR May 8, 2020)_x000D_\n   As of March 2018, the project consisted of 7 contiguous properties:- the Brechas Vacas, Chita and Minas de Pinto mining concessions or Minifestaciones de Descubrimiento (8,514.24 ha); and four exploration permits or Cateos, Chita Este (4,490.77 ha), Brechas Vacas Oeste (1,232.15 ha), Chita Norte (1,881.31 ha), Chita Sur (1,304.18 ha). (Minsud TR Mar 26, 2018)_x000D_\n   In July 2016, Minsud completed a restructuring and second addendum to the Brechas Vacas Option Agreement. The NSR to be retained by the owners was reduced from 1.5% to 0.6% having MSA the option of acquiring 50% of the NSR for $400,000. (Minsud PR July 4, 2016)_x000D_\n   As at December 2015, Minsud reported that an addendum to the Brechas Vacas property option signed in 2012 extended payments, with final payment due in June 2019 and a 1.5% NSR to be retained by property owners. Similarly, final payment on the Minas de Pinto concession was due before May 2019. (Minsud TR Feb 1, 2016)_x000D_\n   As at June 2015, the Chita Valley Project comprised seven concessions covering about 174 sq km. These comprised the granted Brechas Vacas, Chita and Minas de Pinto mining concessions and two pending concessions - Chita Este and Brechas Vacas Oeste. As of June 2014, Minsud had acquired two adjacent exploration permits (Chita Norte and Chita Sur) from Troy Resources in exchange for a 2% NSR on future production from the acquired claims.     (Minsud TR June 19, 2015)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":221015996,"MEAS_IND_ORE_TONNAGE_INCL_RESV":221015996,"INF_RESRC_ORE_TONNAGE":581594576,"TOTAL_RESRC_ORE_TONNAGE":802610572,"R_AND_R_ORE_TONNAGE":802610572,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Epithermal Low Sulphidation, Porphyry Deposit","ORE_MINERALS":"Bornite, Calaverite, Chalcocite, Chalcopyrite, Covellite, Digenite, Galena, Molybdenite, Sphalerite, Tennantite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Chita Valley","DISTANCE_FROM":"80 km WSW of San José de Jáchal","LOCATION_COMMENTS":"The project is located about 145 km northwest of San Juan. (Minsud TR Feb 1, 2016)","ROYALTY_TYPE":"Net Smelter Return","ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"The Chita Valley project is a large exploration stage Tertiary diatreme volcanic vent/porphyry complex. (Minsud Fact Sheet Feb 8, 2016)﻿_x000D_\nThe Chita Valley Complex includes at least five episodes of Tertiary intermediate to felsic epizonal intrusive activity. The principal target type_x000D_\nsought in the Chita Valley area is Cu+/-Mo+/-Au+/-Ag mineralization associated with a large Miocene age porphyry/diatreme breccia/epithermal vein complex.    (Minsud TR June 19, 2015)","EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":0,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":0.277,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":606976,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":0.223,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":1278201,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":0.24,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":1885177,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":0.24,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":1885177,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":0.277,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":606976,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":0,"CONTAINED_RESV_Ag_oz":0,"GRD_MEAS_IND_Au_gpt":0.104,"GRD_MEAS_IND_Ag_gpt":9.357,"CONTAINED_MEAS_IND_Au_oz":744000,"CONTAINED_MEAS_IND_Ag_oz":65920000,"GRD_INF_Au_gpt":0.09,"GRD_INF_Ag_gpt":8.893,"CONTAINED_INF_Au_oz":1670000,"CONTAINED_INF_Ag_oz":166078000,"GRD_TOTAL_RESRC_Au_gpt":0.093,"GRD_TOTAL_RESRC_Ag_gpt":9.025,"CONTAINED_TOTAL_RESRC_Au_oz":2414000,"CONTAINED_TOTAL_RESRC_Ag_oz":231998000,"GRD_R_AND_R_Au_gpt":0.093,"GRD_R_AND_R_Ag_gpt":9.025,"CONTAINED_R_AND_R_Au_oz":2414000,"CONTAINED_R_AND_R_Ag_oz":231998000},{"PROP_NAME":"Constellation","PROP_ID":77019,"PRIMARY_COMMODITY":"Copper","ALSO_KNOWN_AS":"Josemaria, Los Helados","DEV_STAGE":"Prefeas/Scoping","ACTV_STATUS":"Inactive","MO_YR_SOURCE_DATE":"04/2022","MINE_TYPE1":"Open Pit","MINE_TYPE2":"Underground","MINE_TYPE3":null,"COMMODITIES_LIST":"Copper,Gold,Silver","OPERATOR_NAME":"Lundin Mining Corporation","OPERATOR_COMMON_NAME":"Lundin Mining Corp.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":32059.86727706,"OWNER_LIST":"Lundin Mining Corporation  100%; Pan Pacific Copper Co., Ltd. (Fractional) %","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"Lundin Mining Corporation","CURRENT_OWNER_COMMON_NAME":"Lundin Mining Corp.","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":32059.86727706,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-28.43907,"LONGITUDE":-69.54482,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In February 2018, NGEx announced its 2018 development plans, including evaluating a stand-alone development scenario for Josemaria and potentially spinning out the Josemaria project. (NGEx PR Feb 21, 2018)_x000D_\n   During the September 2017 quarter, NGEx continued to assess future development options and continued to optimize and de-risk the Constellation project to advance towards varied development options. The company did not conduct any significant drilling program since the completion of the PEA. (NGEx 9/17 QR Nov 9, 2017)_x000D_\n   During the June 2017 quarter, NGEx evaluated the leach amenability of the oxide cap at the Josemaría deposit through metallurgical studies and continues on opportunities to add value to Constellation project on development options testing the potential to recover gold from the oxide cap and continuing environmental studies. (NGEx 6/17 QR Aug 10, 2017)_x000D_\n   In the March 2017 quarter, NGex reported that bottle-roll and column tests were in progress and results were expected in the second quarter 2017. (NGEx 3/17 QR May 8, 2017)_x000D_\n   In the September 2016 Quarter, NGex updated the plan for Project Constellation by evaluating lower cost development options including the potential to initially develop Josemaria at a smaller scale, testing the heap leach potential of the oxide cap at Josemaria and reducing timelines to development by starting the process of acquiring water rights and continuing baseline environmental studies. (NGex PR Nov 10, 2016)_x000D_\n   In August 2016, NGEx planned to conduct leach test work on the oxide gold zone at Josemaria, targeted exploration on some earlier stage prospects between Los Helados and Josemaria, and continued environmental baseline studies at Constellation. (NGEx PR Aug 12, 2016)_x000D_\n   In March 2016, an amended Technical Report on the Constellation project PEA was submitted. The report was amended to correct minor inconsistencies in the original filing between the footnotes to the Mineral Resource tables between Section 14 and Section 1. There were no other changes to the Mineral Resource statements. (NGEx TR Mar 31, 2016)_x000D_\n   Also, in In February 2016, NGEx reported an updated financial model for Constellation. Upon completion of PEA, the export retention tax applicable to copper concentrate exports from Argentina was eliminated thus increasing Constellation’s NPV and IRR. (NGEx PR Feb 22, 2016) _x000D_\n   In February 2016, NGEx released a Technical Report on the Constellation project PEA. The base case financial results predicted an after-tax NPV of $2.61 billion at 8% discount and a 16.6% IRR (this differed from the figures released in January 2016 of $2.09 billion NPV post-tax at 8% discount). Recommended work included drilling and a Pre-Feasibility Study. (NGEx TR Feb 22, 2016)_x000D_\n   In January 2016, NGEx announced results from a preliminary economic assessment for the integrated operation at Los Helados and Josemaria, or Project Constellation. The study outlined a sequential open pit and underground operation producing 150,000 mt/d of ore and producing 150,000 mt/y Cu, 180,000 oz/y Au, and 1.18 million oz/y Ag over a 48-year mine life. C1 cash cost for the combined project was estimated at $1.05/lb Cu (net of byproduct credits) and initial capital costs were estimated at $3.08 billion. (NGEx PR Jan 7, 2016)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As at end FY December 2017, NGEx held a 100% interest in the Josemaria project (# 33273) with the Pan Pacific's interest in Los Helados (# 37659) project having been diluted to about 38%. (NGEx 16/17 AR Mar 27, 2018)_x000D_\n   As of August 2016, NGEx and Pan Pacific Copper held a 60.72% and 39.28% interest, respectively at Los Helados, while NGEx and JOGMEC held a 60% and 40% interest, respectively at the Josemaria project JV. (NGEx PR Aug 12, 2016)_x000D_\n   As of February 2016, NGEx reported that the PEA proposed processing plant would be located in Argentina. (NGEx TR Feb 22, 2016)_x000D_\n   In January 2016, NGEx announced the integration of the Los Helados and the Josemaria projects into Constellation. Ownership of the projects remained the same, both projects were still 60% owned by NGEx. The 40% at Los Helados was still owned by Pan Pacific and the 40% at Josemaria was still owned by JOGMEC. (NGEx PR Jan 7, 2016)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":null,"DISTANCE_FROM":"215 km NNW of San José de Jáchal","LOCATION_COMMENTS":"The project is located about 135 km southeast of Copiapo. (NGEx TR Feb 22, 2016)","ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":null,"EST_MINE_LIFE_YR":48,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINE u_gpt":null,"GRD_INF_Ag_gpt":null,"CONTAINED_INF_Au_oz":null,"CONTAINED_INF_Ag_oz":null,"GRD_TOTAL_RESRC_Au_gpt":null,"GRD_TOTAL_RESRC_Ag_gpt":null,"CONTAINED_TOTAL_RESRC_Au_oz":null,"CONTAINED_TOTAL_RESRC_Ag_oz":null,"GRD_R_AND_R_Au_gpt":null,"GRD_R_AND_R_Ag_gpt":null,"CONTAINED_R_AND_R_Au_oz":null,"CONTAINED_R_AND_R_Ag_oz":null},{"PROP_NAME":"Del Carmen","PROP_ID":27822,"PRIMARY_COMMODITY":"Gold","ALSO_KNOWN_AS":"Alturas-Del Carmen, Amarillo, Brecha Limite, Brecha Oportuna, Carcavas, Cerro San Pablo, Chibolita, Cresta de Gallo, Del Carmen Norte, Ladera Sur Tortolas, Lion King, Naciente Quebrada Pedregosa, NQP, Rojo Grande","DEV_STAGE":"Prefeas/Scoping","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"05/2022","MINE_TYPE1":"Open Pit","MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Gold,Silver","OPERATOR_NAME":"Barrick Mining Corporation","OPERATOR_COMMON_NAME":"Barrick Mining Corp.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":102138.9896256,"OWNER_LIST":"Barrick Mining Corporation  100%","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"Barrick Mining Corporation","CURRENT_OWNER_COMMON_NAME":"Barrick Mining Corp.","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":102138.9896256,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-30.03424,"LONGITUDE":-69.87613,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In May 2022, Barrick Gold reported that drilling at Del Carmen resumed in the June 2022 quarter. (Metalla PR May 13, 2022)_x000D_\n   In the year ended 2019, an updated mineral inventory was calculated for Rojo Grande which will contribute to further development studies for Alturas (profile #75858) in 2020. A 24 DD holes totaling 7,167 m were also completed. (Barrick 12/19 AR Mar 25, 2020)_x000D_\nIn April 2015, Malbex completed the previously announced transfer of its remaining interest at Del Carmen to Barrick Gold. (Malbex PR April 4,2015)_x000D_\nIn early March 2015, Malbex entered into an agreement with Barrick whereby Barrick would acquire Malbex’s remaining interest at Del Carmen for $4.8 million. (Malbex PR Mar 6, 2015)_x000D_\n   In the September 2014 quarter, Barrick assumed operatorship at Del Carmen, and planned to conduct field activities at the project in the upcoming season. (Malbex PR 11/14/14)_x000D_\n  In April 2014, Malbex entered into an earn in agreement with Barrick to acquire up to 75% interest in Del Carmen. In conjunction, Barrick agreed to subscribe to a C$1 million private placement. (Malbex PR 4/22/14)_x000D_\nIn October 2013, Malbex announced preliminary economic results for Del Carmen. The study outlined a 5-million-mt/y open pit operation producing an average of 112,000 oz Au and 521,000 oz Ag over a 7.5-year mine life. Cash costs were estimated at $650/oz Au including royalties, and initial capital costs were estimated at $256.4 million including contingencies. _x000D_\n\tIn addition, the company reported an updated NI 43-101-compliant resources estimate for the Rojo Grande deposit at Del Carmen. At a cutoff of 0.3 g/mt AuEq, inferred resources totaled 30.97 million mt grading 1.01 g/mt Au and 11 g/mt Ag. (Malbex TR 10/10/13)_x000D_\n\tIn August 2013, Malbex reported that it would continue with the completion of a preliminary economic assessment at Rojo Grande at Del Carmen. In addition, Malbex would continue to secure a partner for Del Carmen. (Malbex 6/13 IR 8/13/13)_x000D_\n\tIn August 2012, Malbex reported the results of metallurgical testing at Rojo Grande. Average gold recoveries of 80% in static columns showed that there is good potential to use heap leach cyanidation to process Rojo Grande mineralization. (Malbex PR 8/16/12)_x000D_\n\tIn June 2012, Malbex reported further drill results from the Rojo Grande prospect with highlights including 67 m grading 2.76 g/mt Au and 14.8 g/mt Ag, located outside of current resources. Mineralization remained open to the west and southwest. _x000D_\n\tThe company also reported results of exploration drilling at the Naciente Quebrada Pedregosa target with a highlight of 9 m grading 1.51 g/mt Au, and one hole completed at the Cerro Frio target which returned 8 m grading 1.08 g/mt Au. Further exploration was planned for both targets. (Malbex PR 6/21/12)  _x000D_\n\tIn April 2012, Malbex reported results from drilling at Del Carmen with highlights including 15 m grading 3.87 g/mt Au and 4.3 g/mt Ag in shallow oxide mineralization at the Rojo Grande prospect. At the Lion King target, drilling returned 18 m grading 1.1 g/mt Au and 19.5 g/mt Ag, and at the Ladera Sur Tortolas target, drilling intersected 6 m grading 1.25 g/mt Au and 30.6 g/mt Ag. Drilling also intersected shallow oxide mineralization at the Cerro San Pablo target. _x000D_\n\tMalbex was in discussions with several companies to joint venture the Del Carmen project, in order to focus on exploration at its other projects. (Malbex PR 4/25/12)_x000D_\n\tAs of the end of the March 2012 quarter, Malbex had completed its 2011-12 field season at Del Carmen which included 7,385 m of core drilling that tested Rojo Grande and seven other targets. _x000D_\n\tMetallurgical testing was nearing completion with final results expected in the June 2012 quarter. The company reported it was seeking a partner to fund further exploration at the project. (Malbex 3/12 MD&A 5/29/12)  _x000D_\n\tIn mid-March 2012, an accident at Del Carmen resulted in the death of an employee of one of the drill contractors at the site. Malbex Resources and Argentinean authorities were investigating the incident. Drilling with one rig was expected to resume shortly with the other two rigs to resume by the end of the week. (Malbex PR 3/12/12)  _x000D_\n\tIn February 2012, Malbex announced the arrival of a third DD rig at Del Carmen. (Malbex PR 2/21/12)_x000D_\n\tIn January 2012, preliminary results from the geophysical survey under way at Del Carmen Norte identified several new drill targets, as well as potential porphyry gold-copper mineralization below the epithermal mineralization at Rojo Grande. Malbex was planning drill testing of the zone. (Malbex PR 1/20/12)_x000D_\n\tEarlier in January 2012, the first stepout hole at Rojo Grande expanded the zone to the southwest with an intercept of 109 m grading 2.05 g/mt Au and 7.4 g/mt Ag. _x000D_\n\tA geophysical survey of the Del Carmen Norte alteration system had begun, including the Rojo Grande deposit, and was expected to be completed by the end of the month. The drill program and geophysical survey were part of the company's $7.9-million (C$8-million) exploration program. (Malbex PR 1/12/12) _x000D_\n\tAs of the end of the December 2011 quarter, Malbex had completed 1,818 m of drilling comprising seven holes at Del Carmen during the 2011-12 season to date. (Malbex 12/11 QR 3/20/12) _x000D_\n\tIn mid-November 2011, Malbex initiated a 10,000-m drill program at Del Carmen with a second rig mobilized to the site in December. (Malbex 9/11 MD&A 12/15/11)_x000D_\n\tIn early November 2011, Malbex reported on exploration completed in its fiscal year ended September 30. The company had drilled 5,538 m in 25 holes at Del Carmen as of April 2011, and phase-one metallurgical testing returned an average gold recovery of 76.5%, indicating that the ore was amenable to heap leaching methods. Another exploration program including DD, geophysical surveys, and geological mapping was expected to begin shortly. (Malbex PR 11/1/11)_x000D_\n\tIn October 2011, Malbex published the technical report associated with the recent resources estimate at Rojo Grande. The company was planning an exploration program for the 2011-12 field season aiming to expand resources at Rojo Grande and drill test other targets at Del Carmen Norte. The program had an estimated budget of $7.04 million and work would include geophysical surveys, DD, and metallurgical studies. The program was expected to be completed by the end of April 2012. (Malbex RPT 10/24/11) Later, Malbex reported an exploration budget of $7.74 million (C$8 million) for the 2011-12 field program at Del Carmen. (Malbex 9/11 MD&A 12/15/11)","ENVIRO_COMMENTS":"In early 2010, a preliminary glacier survey indicated that the property did not host any glaciers. Later in the year, Malbex initiated a detailed study to address whether the Del Carmen project is located within a periglacial region. The more detailed study identified several snow and ice bodies that might meet the definitions of a glacier under provincial law, as well as several periglacial features such as rock glaciers (frozen landslides). _x000D_\n\tThe features were mostly located on a part of the concession away from mineralization and alteration at the Del Carmen Norte prospect and the company was preparing to conduct further studies to determine additional measures required to ensure full compliance with the law. In October, a law was passed to ban all mining activities on glaciers and in the periglacial regions of Argentina. (Malbex 9/11 MD&A 12/15/11)","SUBCONTRACTORS":"In October 2013, Micon International prepared an updated NI 43-101-compliant resources estimate for the Rojo Grande deposit at Del Carmen. (Malbex TR 10/10/13)_x000D_\n\tIn August 2012, McClelland Laboratories conducted metallurgical testing at Rojo Grande. (Malbex PR 8/16/12)_x000D_\n\tIn November 2011, Malbex contracted DAG XL SRL of San Juan for a 10,000-m drill program, and Quantec Geoscience for a geophysical survey. _x000D_\n\tIn October 2011, Malbex contracted McClelland Labs for phase-two metallurgical testing at Del Carmen. (Malbex 9/11 MD&A 12/15/11) _x000D_\n\tIn September 2011, Micon International Ltd completed an initial resources estimate for the Rojo Grande zone at Del Carmen. (Malbex PR 9/12/11) _x000D_\n\tIn November 2010, Major Drilling of Mendoza was contracted for a drill program at Del Carmen Norte. McClelland Laboratories in Sparks, NV was contracted for preliminary metallurgical testing. _x000D_\n\tAs of 2009, Malbex contracted ALS Chemex for preparation and analysis of samples from Del Carmen. (Malbex RPT 10/24/11)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of June 2012, the Naciente Quebrada Pedregosa target was located about 1,000 m south of the Rojo Grande deposit, and the Cerro Frio target was located 500 m from the northern end of the Cresta del Gallo target. (Malbex PR 6/21/12)_x000D_\n\tAs of April 2012, the Cerro San Pablo target was located about 500 m west of the Rojo Grande prospect, the Lion King target was located about 700 m southeast of Rojo Grande, and the Ladera Sur Tortolas target was located about one km north of Rojo Grande. (Malbex PR 4/25/12) _x000D_\n\tAs of October 2011, the Del Carmen property comprised 11 mining concessions covering an area of 15,129 ha. The surface rights were held by the Province of San Juan. The concessions were controlled by the Instituto Provincial de Exploraciones y Explotaciones Mineras de San Juan (IPEEM), and Malbex's subsidiary Malbex San Juan S.A. held a 100% interest in Del Carmon through an exploration and exploitation agreement with IPEEM. The agreement covered four phases of exploration beginning September 12, 2008 and an initial 30-year exploitation option. _x000D_\n\tUpon achievement of commercial production, certain royalties would come into effect including a 3% royalty on production value over 'pithead value' to the Province of San Juan, and a sum equivalent to 2% of gross sales of minerals and/or metals extracted from the properties to IPEEM. (Malbex RPT 10/24/11) _x000D_\n\tIn the 2009-10 field season, Malbex identified a large target at Del Carmen from geophysical surveys, known as Cerro Amarillo. (Malbex 9/11 MD&A 12/15/11) _x000D_\n\tIn 1998, the Del Carmen property covered an area of 10,300 hectares.  (NM 11/30/98)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE_INCL_RESV":0,"INF_RESRC_ORE_TONNAGE":30970000,"TOTAL_RESRC_ORE_TONNAGE":30970000,"R_AND_R_ORE_TONNAGE":30970000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Epithermal High Sulphidation","ORE_MINERALS":"Oxide, Pyrite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Del Carmen","DISTANCE_FROM":"210 km NW of San Juan","LOCATION_COMMENTS":"The Valle del Cura project is located in a relatively remote region with limited utilities and services on the eastern flank of the Andean Cordillera, adjacent to the Chile-Argentina border, at the southern end of the Valle del Cura. The Veladero (profile #108974) and Pascua-Lama (profile #104382) projects are nearby (Veladero is 75 km to the north) and are serviced by a good all-weather private 170-km gravel road. The Del Carmen property is accessed by a 15-km gravel road spur from the Veladero mine road. (Malbex RPT 10/24/11)","ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"As of January 2012, Malbex was investigating the potential of copper-gold porphyry style mineralization below the high sulfidation epithermal mineralization at Del Carmen. (Malbex PR 1/12/12) _x000D_\n\tDel Carmen is a high sulfidation epithermal gold-silver deposit located in the Valle del Cura. As of October 2011, drilling had defined an area of high-sulphidation epithermal gold-silver mineralization measuring 730 m in strike, about 200 m wide, and up to 280 m in height. Gold and silver mineralization in high-sulfidation epithermal deposits typically occurs as disseminations in zones of intense silicification, commonly characterized as vuggy silica. The silicified zone is typically surrounded by quartz-alunite alteration where original feldspar phenocryst sites are occupied by alunite. The quartz-alunite zone is succeeded by quartz-kaolinite alteration. This sequence is zoned outward from dacitic zones. Higher grade mineralization is spatially associated with a dacite dome.  _x000D_\n\tDisseminated pyrite (1 to 3%) is common in the quartz-kaolinite zone, typically minor in quartz-alunite alteration, and absent in vuggy silica. Silicified rocks typically show variable iron staining with hematite, goethite and/or jarosite. Elevated gold (>0.1 g/mt) is most common in areas of strong to intense silicification, especially where hydrothermal brecciation has occurred. However, some quartz-alunite alteration contains gold in similar concentrations._x000D_\n\tThe Del Carmen Norte alteration system is hosted by andesite and dacite. Hydrothermal alteration on the northern wall of Quebrada del Medio transitions upward into andesite. The altered rocks at Del Carmen Norte are currently interpreted as part of the Oligocene Doña Ana Formation, a 500-m thick sequence of andesitic tuff, ignimbrite and pyroclastic breccia, with intercalations of dacitic lavas as well as sandstone and conglomerate units. _x000D_\n\tPermian-Triassic rhyolitic lavas and tuffs and subordinate volcaniclastic rocks assigned to the Choiyoi Group form the faulted eastern margin of the Valle del Cura. Andesitic to dacitic volcanic and volcaniclastic rocks of the Cerro de las Tórtolas Formation extend from the 6,300 m peak of the volcano almost to the floor of Valle del Cura north of the Del Carmen property. The Cerro de los Tortólas Formation volcanic rocks are locally overlain by Vacas Heladas Ignimbrites on the western side of the Valle del Cura. The Valle del Cura is occupied primarily by unconsolidated Pleistocene to Holocene alluvial, colluvial and glacial sediments. (Malbex RPT 10/24/11)","EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_p 2)_x000D_\n   In May 2022, Sable started 5,000-m drill program at Don Julio in January 2022 with eight hole, 3,069-m drilling completed to date and was expected to be completed in mid-May 2022. (Sable PR May 4, 2022)_x000D_\n   In October 2021, Sable reported that it has initiated exploration program at all of its project in San Juan. In addition it is finalizing drill preparations to initiate drilling on porphyry-skarn targets at Don Julio. (Sable PR Oct 14, 2020)_x000D_\n   In September 2021, Sable planned a 5,000-m drill program at Don Julio which was expected to start in January 2022. (Sable PR Sept 20, 2021)_x000D_\n   In February 2020, Sable planned a geophysical survey as part of its additional exploration at Fermin. (Sable PR Feb 24, 2020)_x000D_\n   In January 2020, Sable announced that they received drilling permits for six new targets at Don Julio. Field work resumed last November at the site. (Sable PR Jan 7, 2020)_x000D_\n   During the December 2018 quarter, Sable completed the first reconnaissance drilling at  Don Julio Cluster for a total of 3,101-m in 11 drill holes. Sampling of core was underway with results pending. (Sable PR Jan 7, 2019)_x000D_\n   In October 2018, Sable began a 6-hole and a 4-hole DD program at Heaven Hill and Esperanza respectively. (Sable PR Oct 31, 2018)_x000D_\n   In September 2018, Sable finalized drill plan for Don Julio, a minimum of 8 diamond drill holes of up to 450 meters deep for a total of 3600 meters are planned at Don Julio. (Sable PR Sept 20, 2018)_x000D_\n   In September 2018, Sable initiated road and drill pad construction for Esperanza target at Don Julio, where drilling was planned to begin in October 2018. (Sable PR Sept 18, 2018)_x000D_\n   In August 2018, Sable received all necessary permits to drill at Don Julio and will begin drilling in October 2018. (Sable PR Aug 16, 2018)_x000D_\n   In April 2018, Sable announced the first geochemical assay results from the ongoing Phase 2 rock sampling and detailed mapping program at Don Julio. (Sable PR Apr 16, 2018)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of September 2022, Don Julion project covered an area of 69,350 ha. (Sable PR Sept 6, 2022)_x000D_\n   As of January 2021, Don Julion project comprises a 58,000 ha land package. (Sable PR Jan 28, 2021)_x000D_\n   As of February 2020, Don Julio contained eight of the 19 identified anomalies within its exploration program and covered about 12 x 10 km. (Sable PR Feb 12, 2020)_x000D_\n   As of August 2018, Don Julio contains the first 5 targets of the 15 identified in the 35,000 ha San Juan Regional exploration program. (Sable PR Aug 16, 2018)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Epithermal High Sulphidation, Porphyry Deposit, Skarn (Metasomatic)","ORE_MINERALS":"Chalcopyrite, Galena, Sphalerite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Don Julio","DISTANCE_FROM":"160 km NW of San Juan","LOCATION_COMMENTS":null,"ROYALTY_TYPE":"Net Smelter Return","ROYALTY_PCT":1,"GEOLOGY_COMMENTS":null,"EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":null,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":null,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RES ober 2025. (Sable PR Sept 22, 2025)_x000D_\n   In May 2025, Osisko officially changed their name to OR Royalties Inc. (OR PR May 8, 2025)_x000D_\n   In the year ended December 2022, Sable reported that the planned 3,000m drill program at El Fierro was postponed due to lack of drill rig availability and the next drill phase will be planned once the ongoing target definition work is completed. (Sable 12/22 MD&A Apr 25, 2023)_x000D_\n   In October 2022, Sable planned a district mapping prospecting work at El Fierro this month. A second round of drill program was also planned in January 2023 at Pyros and Antenna Hill. (Sable PR Oct 12, 2022)_x000D_\n   In May 2022, Sable completed 63 holes, 10,923-m drilling to date at Pyros. (Sable PR May 4, 2022)_x000D_\n   In early March 2022, Sable started a drill program at Pyros and planned a 3,900-m of two drilling fences at El Fierro. (Sable PR Mar 2, 2022)_x000D_\n  In January 2022, Sable announced that it had completed the phase II, 31-hole, 3,630-m drill program in mid-December 2021 at El Fierro. In addition, the company was conducting some extra drill program on Fierro Bajo. (Sable PR Jan 11, 2022)_x000D_\n   In mid-October 2021, Sable planned to undertake a second phase of drilling at EI Fierro.  (Sable PR Oct 14, 2021)_x000D_\nIn August 2021, Sable planned a 15,000-m DD program for El Fierro in October. (Sable PR Aug 31, 2021)_x000D_\n   In July 2021, Sable announced that the next drill campaign at El Fierro was scheduled to begin in the December 2021 quarter. (Sable PR July 21, 2021)_x000D_\n   In April 2021, Sable announced first results from its drill program at El Fierro. (Sable PR Apr 6, 2021)_x000D_\n   In March 2021, Sable planned to start drill program in 10 holes at La Verde. (Sable PR Mar 4, 2021)_x000D_\n   In February 2021, Sable started its 5,000-m first phase drill program at El Fierro. (Sable PR Feb 9, 2021)_x000D_\n   In December 2020, Sable received all the necessary permitting required for 10,000-m drill \n   In the year ended December 2023, Glencore reported an updated mineral resource estimate at El Pachon. (Glencore RPT Dec 31, 2023)_x000D_\n   As of December 2022, El Pachon hosted 3.38 billion mt grading 0.47% Cu, 0.01% Mo and 1.9 g/mt Ag of reserves and resources. (Glencore PR Dec 31, 2022)_x000D_\nAs of December 2021, El Pachon hosted 3.27 billion mt grading 0.47% Cu, 0.01% Mo and 1.96 g/mt Ag of reserves and resources. (Glencore PR Dec 31, 2021)_x000D_\n   As of December 2019, El Pachon hosted 3.12 billion mt grading 0.48% Cu, 0.01% Mo and 1.97 g/mt Ag of reserves and resources. (Glencore PR Dec 31, 2019)_x000D_\nAs of year-end December 2018, reserves and resources estimate at El Pachon totaled 3.1 billion mt grading 0.48% Cu, 0.10% Mo and 1.97 g/mt Ag. (Glencore RPT Dec 31, 2018)_x000D_\nAs of year-end December 2017, reserves and resources estimate at El Pachon totaled 3.1 billion mt grading 0.48% Cu, 0.10% Mo and 1.97 g/mt Ag. (Glencore RPT Feb 1, 2018)_x000D_\nAs of year-end December 2016, reserves and resources estimate at El Pachón totaled 3.2 billion mt grading 0.48% Cu, 0.10% Mo and 1.97 g/mt Ag. (Glencore RPT Feb 2, 2017)_x000D_\n   As at December 31, 2014, El Pachon's resources remained unchanged from the previous year (Glencore PR  Feb 11, 2015)_x000D_\n   As of December 2013, El Pachon's resources remained unchanged. Measured and indicated resources totaled 1.58 billion mt grading 0.55% Cu, 2.1 g/mt Ag, and 0.012% Mo, and inferred resources totaled 1.7 billion mt grading 0.4% Cu, 2 g/mt Ag, and 0.01% Mo. (Glencore Xstrata PR 3/31/14)_x000D_\n   In May 2013, Glencore International and Xstrata merged to form Glencore Xstrata. (Glencore PR 5/2/13)_x000D_\n\tIn late October 2012, it was reported that construction at El Pachon was expected to begin in 2014. (BNA 10/29/12)_x000D_\n\tIn October 2012, Xstrata updated resources at El Pachon. Measured and indicated resources totaled 1.58 billion mt grading 0.55% Cu, 0.012% Mo, and 2.2 g/mt Ag, and inferred resources totaled 1.7 billion mt grading 0.4% Cu, 0.01% Mo, and 2 g/mt Ag. (Xstrata PR 10/3/12)_x000D_\n\tIn June 2012, it was reported that construction of the El Pachon mine would begin in 2014. The life of the mine is estimated at 25 years. (BNA 6/20/12)\tAs of May 2012, Xstrata continued towards development of El Pachon following the signing of a letter of interest to take up to 50 megawatts of geothermal power from Earth Heat, with room for expansion. (Miningnews.net 5/22/12)_x000D_\n\tAs of April 2012, Xstrata continued to advance the feasibility study at El Pachon and its environmental evaluation was expected by mid-2012. (BNA 4/19/12)_x000D_\n\tIn February 2012, Glencore International and Xstrata announced a \"recommended merger of equals\" whereby Glencore would acquire the 65.92% of Xstrata that it did not already own on the basis of 2.8 new Glencore shares for each Xstrata share, and a total consideration of $40.1 billion. (Xstrata PR 2/7/12)_x000D_\n\tIn December 2011, Xstrata announced updated resources at El Pachon totaling 2.7 billion mt grading 0.48% Cu, 0.01% Mo, and 2.1 g/mt Ag. (Xstrata PR 12/6/11)_x000D_\n\tAs of August 2011, El Pachon's projected capacity was 400,000 mt/y of copper, which would begin in 2016.  (Xstrata 6/10 RPT 8/2/11) _x000D_\n\tAs of February 2011, Xstrata was continuing feasibility studies at El Pachon which would continue through 2011. (Xstrata 12/10 PFR 2/8/11)_x000D_\n\tIn June 2010, El Pachon's potential capacity was reported to be between 250,000 mt/y and 300,000 mt/y Cu. (BNA 6/11/10)_x000D_\n\tIn December 2009, Business News Americas reported that El Pachon could be in production by 2016 at a rate of 200,000 mt/y Cu. (BNA 12/3/09)","ENVIRO_COMMENTS":"An environmental baseline study was conducted for the project in Argentina and the EIS was presented to the mining department of the Province of San Juan in Argentina and approved in July 1997.  As of September 1997, the EIS for the Chilean infrastructure was expected to be presented shortly.  (Cambior PR 9/25/97)","SUBCONTRACTORS":"In December 2007, Xstarta contracted Bechtel to provide long-term EPCM services for Las Bambas (profile# 106876), El Pachon, and Tintaya (profile# 106395). (BNA 12/6/07)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"The project lies immediately adjacent to the Los Pelambres mine (profile # 104656) across the border in Chile, and has a specific protocol in place under the Chile-Argentina Cross Border Mining Treaty. (MJ 11/24/06)_x000D_\n\tAs of September 1997, the El Pachon project area comprised 31 mining concessions totaling 1,855 ha, with surface rights over 34,000 ha. (Cambior PR 9/25/01)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":2080000000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":2080000000,"INF_RESRC_ORE_TONNAGE":3900000000,"TOTAL_RESRC_ORE_TONNAGE":5980000000,"R_AND_R_ORE_TONNAGE":5980000000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Disseminated, Porphyry Deposit","ORE_MINERALS":"Bornite, Chalcocite, Chalcopyrite, Covellite, Molybdenite, Native","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"El Pachon","DISTANCE_FROM":"180 km W of San Juan","LOCATION_COMMENTS":"El Pachon is located approximately two km from the Chilean border and ten km from the Los Pelambres mine (profile #104656) in Chile. (Cambior PR 9/25/97)","ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"El Pachon is a porphyry Cu-Mo deposit comprised of andesites, tuffs, siliceous tourmaline breccias, diorite, and a quartz-biotite-feldspar porphyry._x000D_\n\tMineralization is mainly in the andesite, diorite, and siliceous breccias. There is also a surface leached zone overlying a secondary enrichment, beneath which is a mixed zone above the hypogene or primary mineralization.  (MJ 10/3/97)","EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":0,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":0.5,"GRD_MEAS_
