_Au_oz":null,"CONTAINED_INF_Ag_oz":null,"GRD_TOTAL_RESRC_Au_gpt":null,"GRD_TOTAL_RESRC_Ag_gpt":null,"CONTAINED_TOTAL_RESRC_Au_oz":null,"CONTAINED_TOTAL_RESRC_Ag_oz":null,"GRD_R_AND_R_Au_gpt":null,"GRD_R_AND_R_Ag_gpt":null,"CONTAINED_R_AND_R_Au_oz":null,"CONTAINED_R_AND_R_Ag_oz":null},{"PROP_NAME":"Los Azules","PROP_ID":34032,"PRIMARY_COMMODITY":"Copper","ALSO_KNOWN_AS":"Agostina, Azul, Azul 1, Azul 2, Azul Este, Azul Norte, Cecilia, Escorpio, Escorpio II, Gina, La Ballena, Los Azules Norte, Marcela, Mercedes, Mirta, Porfido Norte, Rosario, Sofia, Tango, Totora","DEV_STAGE":"Feasibility Complete","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"11/2024","MINE_TYPE1":"Open Pit","MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Copper,Gold,Silver,Molybdenum,Iron Ore,Nickel,Arsenic","OPERATOR_NAME":"McEwen Inc.","OPERATOR_COMMON_NAME":"McEwen Inc.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":1177.47088154,"OWNER_LIST":"Stellantis N.V. (Venturer) 18.3%; McEwen Inc. (Venturer) 46.4%; Nuton LLC (Venturer) 17.2%; Private Interest (Venturer) 18%","ROYALTY_HOLDER_LIST":"TNR Gold Corp. (NSR) 0%McEwen Inc. (NSR) 1%","OWNER_NAME":"McEwen Inc.","CURRENT_OWNER_COMMON_NAME":"McEwen Inc.","OWNER_TYPE":"Venturer","OWNER_PCT":46.4,"CURRENT_CONTROLLING_OWN_PCT":46.45,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":1177.47088154,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-31.08139,"LONGITUDE":-70.16865,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In 2025, McEwen reported the completion of feasibility study at Los Azules. (McEwen 12/25 AR May 20,2026)_x000D_\n  In October 2025, McEwen reported FS with an updated mineral resource estimate at Los Azules. (McEwen 8-K Oct 7, 2025)_x000D_\n   During the September 2025 quarter, McEwen expected to begin construction at Los Azules in the early 2027. (McEwen PR Nov 6, 2025) _x000D_\n  In September 2025, McEwen announced the approval of its Environmental Impact Declaration (EIA), with a FS expected to be completed by October 2025 (McEwen PR Sept 24, 2025)_x000D_\n   During the June 2025 quarter, McEwen completed geotechnical, hydrogeological, and condemnation drilling for the feasibility study at Los Azules. (McEwen 6/25 QR Aug 8, 2025) _x000D_\n  In July 2025, McEwen Mining Inc. changed its name to McEwen Inc. (McEwen PR July 7, 2025)_x000D_\n   In June 2025, McEwen reported that the feasibility study is anticipated to be completed in September 2025 quarter. (McEwen 8-K June 19, 2025)_x000D_\n   In May 2025, McEwen planned to complete feasibility study in July 2025 at Los Azules. (McEwen PR May 22, 2025)_x000D_\n  In May 2025, TNR reported that Environmental Impact Assessment approval was in place since December 2024, and was advancing towards the release of a DFS, expected in July 2025 at Los Azules. (TNR Gold PR May 12, 2025)_x000D_\n   In January 2025, McEwen expected to update resource estimate in March 2025 quarter and feasibility study in June 2025 quarter at Los Azules. (McEwen PR Jan 15, 2025)_x000D_\n   In December 2024, McEwen Mining received approval of Environmental Impact Assessment (EIA) to publish a definitive feasibility study in the first half of 2025 with the start of construction in 2026 at Los Azules. (McEwen Mining PR Dec 3, 2024) _x000D_\n   In October 2024, TNR reported that the feasibility study at Los Azules is scheduled for publication by the first half of 2025. (TNR PR Oct 28, 2024)_x000D_\n   In late June 2024, TNR reported that work on a bankable feasibility study for the Los Azules is scheduled for publication by the end of the March quarter 2025. (TNR PR June 27, 2024)_x000D_\n   Also in August 2024, McEwen secured an agreement with YPF Luz to power its large Los Azules copper with 100% renewable energy. (McEwen PR Aug 26, 2024) _x000D_\n In August 2024, TNR reported completion of resource drilling for feasibility study at Los Azules. (TNR PR Aug 14, 2024) _x000D_\n  As of May 2024, TNR reported that McEwen has announced completion of the feasibility drill program at Los Azules. (TNR PR May 21, 2024) _x000D_\n As of the March 2024 quarter, McEwen reported that 56,528-m of drilling at Los Azules was completed to date. (McEwen 3/24 10-Q May 8, 2024)_x000D_\n  Also in February 2024, McEwen reported that Feasibility Study was expected to be completed in March 2025 quarter. Also another record-setting drill season was underway at Los Azules with over 62,000-m of drilling, of which 43,000-m have been completed to date. (McEwen PR Feb 26, 2024)_x000D_\n   In February 2024, McEwen reported that 36,000-m drilled out of the 55,000-m planned for comprehensive Feasibility Study. In addition company reports 22 drill rigs were working in drilling program. (McEwen PR Feb 12, 2024)_x000D_\n   In November 2023, McEwen reported that the next steps for the Los Azules Project are continuing with infill resource drilling, variability and confirmatory metallurgical testing, environmental baseline studies, and commencing critical preliminary engineering such as hydrogeologic field investigations and geotechnical drilling at the heap leach pad site, tailings dam site and within the pit wall slopes to support a feasibility study. (McEwen 8-K Nov 3, 2023)_x000D_\n   In November 2023, McEwen planned a drill program targeting more than 45,000-m using 14-18 drill rigs at Los Azules. (TNR PR Nov 2, 2023)_x000D_\n   In October 2023, McEwen reported the preliminary study results and feasibility study was expected to complete in 2025 at Los Azules. (McEwen 10/23 8-K Oct 3, 2023) _x000D_\n  In August 2023, McEwen has recently completed drilling season at Los Azules, and used upto 15 rigs to complete 39,900-m drill program for 138 holes at project. (McEwen PR Aug 1, 2023) _x000D_\n  In July 2023, McEwen planned next phase of drilling in October 2023 at Los Azules. (McEwen PR July 12, 2023) _x000D_\n  In June 2023, McEwen completed a 138 holes totaling 39,900-m drill program at Los Azules. (McEwen PR July 12, 2023)_x000D_\n   In June 2023, McEwen reported the preliminary economic assessment and updated the mineral resource estimate at Los Azules. (McEwen PR June 20, 2023) _x000D_\n  In June 2023, McEwen planned to undertake feasibility study in 2024 at Los Azules. (McEwen Factsheet June 1, 2023)_x000D_\n    During the March 2023 quarter, McEwen submitted EIR on April 14, 2023 and also planned to update PEA in June 2023 quarter at Los Azules. (McEwen 03/23 10-Q May 8, 2023)_x000D_\n   In May 2023, McEwen announced that drilling would continue until the end of the field season in May 2023 and would resume in October 2023 at the end of winter at Los Azules. (McEwen PR May 4, 2023) _x000D_\n  In April 2023, McEwen reported that 25,000-m has been drilled since resumption and PFS mine design to be completed in late 2024 at Los Azules. (McEwen PR Apr 5, 2023) _x000D_\n  In year ended December 2022, McEwen reported an updated mineral resource estimate at Los Azules. (McEwen 12/22 10-K Mar 14, 2023)_x000D_\n   Also In March 2023, McEwen planned to update PEA and publish in June 2023 quarter for Los Azules. (McEwen 8-K Mar 14, 2023)_x000D_\nIn March 2023, TNR reported that from October to third week of February 2023, a 16,900 m in 66 holes have been completed form its current drill program at Los Azules. (TNR PR Mar 9, 2023)_x000D_\n    In March 2023, TNR reported that 62,000-m drill program is underway at Los Azule. (TNR PR March 5, 2023) _x000D_\n  In February 2023, McEwen entered into a binding agreement with Nuton, a Rio Tinto venture and an existing McEwen Copper shareholder, wherein Nuton has agreed to invest $30 million to acquire shares of McEwen Copper. After closing, Nuton will own 14.2% of McEwen Copper, and McEwen will own 51.9%. The companies also entered into a Copper Cathodes and Concentrates Purchase Rights Agreement pursuant to which Nuton can purchase a percentage of the copper products produced from the Los Azules project equal to their equity ownership percentage in McEwen Copper at the time of exercise. (McEwen PR Feb 27, 2023) _x000D_\n  In January 2023, McEwen reported that drilling has been resumed in October 2022 at Loz Azules. The company also reported that 11,900-m has been drilled in 46 holes since resumption. (McEwen PR Jan 26, 2023) _x000D_\n  In August 2022, McEwen reported that the drill program at Loz Azules has temporarily been halted for the winter and will resume in October 2022. In addition, an updated PEA for the project was expected to be released in March 2023 quarter. (McEwen PR Aug 4, 2022)_x000D_\n   In the June 2022 quarter, McEwen planned to start drilling in December 2022 quarter at Los Azules. (McEwen PR Aug 11, 2022)_x000D_\n   In June 2022, McEwen planned 59,000-m of dill program in order to upgrade inferred resources to indicated and to conduct geological programs at Los Azules. (McEwen 8-K June 23, 2022)_x000D_\n  In the March 2022 quarter, McEwen planned to complete 13,000-m of 59,000-m drill program in June 2022 quarter at Los Azules. (McEwen 3/22 10-Q May 10, 2022)_x000D_\n   In May 2022, McEwen completed 10,780-m drill program by 10th May 2022 and drill program is expected to restart in October followed by winter break at Los Azules. (McEwen 8-K May 10, 2022) _x000D_\n  In May 2022, McEwen planned to report updated PEA in March 2023 quarter and PFS in first half of 2024 at Los Azules. (McEwen PR May 4, 2022)_x000D_\n   In year ended December 2021, McEwen reported an updated mineral reserves and resource estimate totaling 2.97 billion mt grading at 0.37% Cu, 0.05g/mt Au, 1.64 g/mt Ag and 0.003% Mo. (McEwen 12/21 10-K Mar 7, 2022) _x000D_\n  In December 2021, McEwen planned to advance Los Azules from PEA to a prefeasibility study. In addition, to upgrade resource estimate through 44,000-m definition drill program and 9,000-m geotechnical/metallurgical. (McEwen 8K Dec 1, 2021)_x000D_\n   In November 2021, TNR reported that drills are expected to turn towards the end of November and continue through the end of June 2022 quarter. (TNR PR Nov 10, 2021)_x000D_\n   During the September 2021 quarter, mineral resources at Los Azules remained the same. (McEwen 9/21 10-Q, Nov 3, 20210)_x000D_\n   In September 2021, McEwen announced that preparations were underway for a large 53,000-m drill program at Los Azules. (McEwen PR Sept 29, 2021) _x000D_\n  In July 2021, McEwen has planned 53,000-m resources and reserves definition drill program at Los Azules. (McEwen PR July 13, 2021)_x000D_\n   During the March 2021 quarter, McEwen continued on engineering and developing cost estimates to advance the proposed low altitude all-year access route and also progressing on identifying opportunities to accelerate the development and improve the economics of Los Azules. (McEwen PR May 7, 2021)_x000D_\n   During the March 2020 quarter, McEwen continued the environmental baseline monitoring work at Los Azules. (McEwen 3/20 10-Q May 18, 2020)_x000D_\n   In March 2020, McEwen has temporarily suspended operations at Los Azules. (McEwen PR Mar 23, 2020) _x000D_\n  In July 2019, McEwen was targeting the submission of the environmental impact assessment at Los Azules by the end of the year and expecting to receive the environmental impact declaration by 2020. (McEwen PR July 30, 2019)_x000D_\n    In the December 2018 quarter, McEwen announced a new access road connecting to Los Azules was currently being investigated. (McEwen 12/18 QR Feb 21, 2019) _x000D_\n  During H1 2018, McEwen Mining spent $5.9 million developing infrastructure alternatives and environmental base line monitoring work at Los Azules to advance its permitting efforts. (McEwen PR July 31, 2018)_x000D_\n   As of February 2018, McEwen will continue further technical and environmental baseline analysis in Los Azules. (McEwen PR Feb 22, 2018)_x000D_\n   In 2017, a total of 6,500-m was drilled bringing total drilling done to date at Los Azules to 67,641-m. (McEwen 12/17 AR Feb 21, 2018)_x000D_\n   In late November 2017, the government of Chile and Argentina signed a protocol to facilitate the development at Los Azules. (TNR PR Nov 30, 2017)_x000D_\n   In October 2017, McEwen released the NI43-101 compliant Preliminary Economic Assessment of the Los Azules project which is an update form the previous PEA (2013) with a revised flowsheet/phased implementation and updated economic parameters. Recommended work included infill drilling, and improving knowledge base of the environmental baseline work. (McEwen TR Oct 16, 2017)_x000D_\n   In September 2017, a revision of the 2013 PEA was released that contemplated a staged implementation strategy to reduce risk. The new PEA was for an owner-operated open pit mine with a conventional flotation plant producing copper concentrate for export. Capital costs for the initial Phase 1 operation (80,000 mt/d throughput) were estimated at $2,363 million with a further $278 million required in Phase 2 to increase production to 120,000 mt/d. The mine would produce 415 million lbs/y copper for the first 10 years at a C1 cash cost of $1.11/lb. (McEwen PR Sep 7, 2017)_x000D_\n   As of the June 2017 quarter, the updated PEA was expected to be completed by the September 2017 quarter. (McEwen 6/17 10-Q Aug 2, 2017) _x000D_\n  In May 2017, TNR reported that the results from drill program were expected to be finalized by second half of 2017. (TNR PR May 25, 2017)_x000D_\n   During the March 2017 quarter, McEwen conducted a combination of infill and exploration drilling, some early stage geotechnical drilling at the mine and a potential mine tailings dam, an aerial survey of the proposed mining area, mine facility areas and potential linear infrastructure areas, environmental base line monitoring work, and geotechnical reconnaissance for materials for use in project construction. (McEwen 3/17 10Q May 4, 2017)_x000D_\n    During the June 2016 quarter, McEwen was preparing for an updated PEA at Los Azules. A drill program was planned to start in early 2017. (McEwen 6/16 QR Aug 4, 2016)_x000D_\n   As of the March 2016 quarter, planning for the next field season at Los Azules in March 2017 quarter was underway. (McEwen 8-K May 5, 2016)   In the June 2015 quarter, McEwen reported its intention to monetize the Los Azules project.  (McEwen 8K Aug 6, 2015)_x000D_\n   For 2015, McEwen budgeted $0.7 million for Los Azules. While no significant exploration work or drilling program was expected, the company would continue to advance the project with baseline environmental studies. (McEwen PR Mar 10, 2015) _x000D_\n  In late October 2014, TNR Gold extended for one year its advisory agreement with PI Financial in relation to the sale of its NSR on Los Azures. (TNR PR 10/23/14) _x000D_\n  In mid-October 2014, McEwen entered into a transaction with TNR Gold, whereby TNR’s back-in right for up to 25% equity in certain portions of Los Azules has been terminated. (McEwen PR 10/17/14)_x000D_\n Under the terms, TNR would convert all of its rights and interest under a Cordon de Los Azules Exploration and Option Agreement, and in exchange would receive a 0.4% NSR, 850,000 common shares, and 1% of the project purchase price if sold or transferred within three years of the transaction. (TNR PR 10/17/14)_x000D_\n   In early August 2014, TNR Gold commented that the impairment recorded by McEwen on Los Azules does not adversely affect TNR’s valuation of its back-in right in the property. (TNR PR 8/13/14)_x000D_\n   In June 2014, McEwen was conducting an impairment test of Los Azules as a result of the recently announced acquisition of Lumina by First Quantum. (McEwen PR 7/17/14)_x000D_\n   In May 2014, McEwen reported that the 2013-2014 drill program was completed in March 2014 at Los Azules and do not expect to complete significant exploration during this 2013-2014 season. (McEwen 3/14 10Q 5/7/14)_x000D_\n   In February 2014, TNR signed and settlement with McEwen for Los Azules. The settlement restored TNR's back-in right for up to 25% which would be exercisable following a feasibility study. If TNR elects to back-in for 5% or less, the company's interest would automatically convert to a 0.6% NSR. (TNR PR 2/5/14) _x000D_\n  During the September 2013 quarter, TNR executed the formal documentation for the Los Azules settlement and completed the transfer of the adjoining Escorpio IV concession to McEwen. (TNR 9/13 QR 11/25/13)_x000D_\n In September 2013, a preliminary economic assessment of Los Azules outlined a 120,000 mt/d operation producing 171,000 mt/y Cu over a 34.9-year mine life. Initial capital costs were estimated at $3.92 billion and life of mine cash costs were estimated at $1.08/lb Cu, net of byproduct credits.  Indicated resources were estimated at 389 million mt grading 0.63% Cu and 0.07 g/mt Au, and inferred resources were estimated at 1.4 billion mt grading 0.46% Cu and 0.06 g/mt Au. (McEwan PR 9/23/13)_x000D_\n   In June 2013, McEwen reported that it would no longer sell Los Azules due to lowered company capital costs. (McEwen PR 6/10/13)_x000D_\n   In May 2013, McEwen was still considering selling the Los Azules property. The sales process began mid-January and final bids were due late in the second quarter. (McEwen PR 5/9/13)_x000D_\n    In late March 2013, McEwen announced further results from drilling at Los Azules. Drilling west of the resource returned 150 m grading 0.7% Cu, and 414 m grading 0.5% Cu. Drilling below the known resource returned 338.5 m grading 0.49% Cu.  An preliminary economic assessment and resource update was due in the September quarter. (McEwen PR 3/28/13)_x000D_\n In March 2013, McEwen announced results from metallurgical testwork being carried out at Los Azules. Flotation optimization had determined copper recoveries of 95%. (McEwen PR 3/13/13)_x000D_\n Also it early February 2013, it was reported that McEwen continued work on an updated preliminary economic assessment for Los Azules. The study was expected during the September 2013 quarter, would be based on a larger mineral and would evaluate the possibility of increasing the daily throughput. (BNA 2/6/13)_x000D_\n    In early February 2013, McEwen reported updated resources at Los Azules. Indicated resources totaled 310 million mt grading 0.65% Cu, 0.07 g/mt Au, and 1.8 g/mt Ag, and inferred resources totaled 1.3 billion mt grading 0.49% Cu, 0.06 g/mt Au, and 2 g/mt Ag. (McEwen PR 2/5/13)_x000D_\n    In mid-January 2013, McEwen announced results from its drill program at Los Azules. Highlights included 160 m grading 0.61% Cu, and 609.9 m grading 0.47% Cu. The company expected to complete 15,000 m of drilling by the end of April 2013. (McEwen PR 1/17/13)_x000D_\n   In late November 2012, McEwen was considering selling the Los Azules property. (Mineweb 11/22/12)_x000D_\n   In mid-November 2102, McEwen announced that the lawsuit between itself and TNR had been settled. McEwen had the title to the Escorpio IV claim, and TNR retained a Back-In Right for up to a 25% interest in the claims. TNR also received 1 million shares of McEwen. (McEwen PR 11/12/12)_x000D_\n TNR also announced that it would recieve a 0.6% NSR on the Los Azules project. (TNR PR 11/12/12)_x000D_\n In mid-October 2012, McEwen began a 15,000-m drill program at Los Azules. (McEwen PR 11/7/12)_x000D_\n In June 2012, McEwen updated its NI 43-101 resources at Loz Azules to 1.27 billion mt grading 0.63% Cu. It expected to begin 15,000 m of RC drilling in November 2012. (McEwen PR 6/28/12)_x000D_\n In late May 2012, in response to recent decrees announced by the government of Argentina, McEwen reported that the repatriation of funds from the San Jose mine (profile# 110897) could impair the company's ability to internally finance its projects. (McEwen PR 5/18/12) _x000D_\n   If uncertainties persisted, McEwen would have to seek funds from external financing alternatives or from the sale or partial sale of Los Azules. (McEwen PR 5/21/12)_x000D_\n As of mid-May 2012, TNR and its subsidiary Solitario remained in litigation with Minera Andes (a subsidiary of McEwen) and MIM Argentina Exploraciones regarding TNR's right to back-in to a 25% interest in a substantial portion of the mineral properties constituting Los Azules. A trial in the Courts of British Columbia was set to begin in November, 2012 and last for approximately six weeks.  McEwen would continue its expansion drilling program at Los Azules, but would focus its efforts on the portion of the Los Azules claims that were not subject to the ongoing litigation. (TNR PR 5/11/12)_x000D_\n In early May 2012, McEwen announced results from its ongoing expansion drilling. Hole 1175 returned 15.2 m grading 0.702% Cu, and hole 1279 returned 350.7 m grading 0.53% Cu. As a result of a slow drill season, the company had contracted Major Drilling to provide four core drills, which were more powerful than the ones previously in use. An updated resource estimate was expected by mid-year. (McEwen PR 5/10/12)_x000D_\n As of March 2012, McEwen reported that drilling was under way at Los Azules. Due to ground conditions and equipment problems, drilling had been slow with 1,700 m completed to date of the planned 8,000 m. (McEwen PR 3/15/12)_x000D_\n In January 2012, TNR offered to settle the litigation with Minera Andes for a payment of $125 million to TNR. Minera Andes and US Gold both rejected the offer. (Minera Andes PR 1/13/12)_x000D_\n Drilling was expected to resume at Los Azules by the end of the month with an 8,000-m drill program planned. (Minera Andes PR 1/18/12)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In December 2021, A prominent San Juan-based road construction firm (Zlato) is building the roads at Los Azules. (McEwan PR Dec 22, 2021)_x000D_\nIn September 2013, Samuel Engineering, Ausenco Vector, WLR Consulting, and MTB Project Management Professionals contributed to a preliminary economic assessment at Los Azules. (McEwan PR 9/23/13)_x000D_\n\tIn May 2012, McEwen contracted Major Drilling to provide four core drills for the 2012-13 drill season. (McEwen PR 5/10/12)_x000D_\n\tIn December 2010, Minera Andes announced results from an updated preliminary assessment on Los Azules. The assessment used input from Samuel Engineering, Ausenco Vector, and MTB Project Management Professionals. (Minera Andes PR 12/16/10)_x000D_\n\tAs of June 2010, Quantec Geoscience completed a Titan 24 survey. (Minera Andes PR 6/21/10)_x000D_\n\tAs of March 2010, TNR Gold engaged British Swiss Investment Corp to undertake a review of Los Azules and alternatives for the project. (TNR Gold PR 3/1/10)","START_UP_YR":null,"PROJ_START_UP_YR":2030,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":2051,"DESCRIPTION_CLAIM":"As of June 2025, Los Azules comprised of 22 mineral claim. (McEwen RPT June 27, 2025)_x000D_\n   As of July 2023, Los Azules comprised of an area of 31,746.42 ha. (McEwen TR July 28, 2023)_x000D_\n   As of December 2019, Los Azules comprises 21 claims totaling 123 square miles. (McEwen 12/19 10-K Mar 16, 2020)_x000D_\n   As of the year ended December 2017, Loz Azules comprised 331 claims covering an area of 376 sq. km. (McEwen 12/17 10K Feb 21, 2018)_x000D_\n   As of the year ended December 2016, Loz Azules comprised 321 claims covering an area of 32,723 ha. (McEwen 12/16 10K Mar 1, 2017)_x000D_\n   As of June 2016, TNR reported the exact NSR held at Los Azules as 0.36% (different from what had been reported in the previous reports of having 0.4% NSR). (TNR 6/16 FS June 15, 2016) _x000D_\n   In early January 2016, TNR Gold announced that the company and its lender (back in 2012) agreed to extend the due date of its loan repayment from December 31, 2015 to December 31, 2018. In addition, the outstanding indebtedness of about C$4.3 million would bear an interest of 10%/y. The company would also give the lender 10% direct or indirect interest in the company's 0.4% NSR at Los Azules, 2% NSR at Mariana (profile# 37586) and the mineral claims comprising Shotgun (profile# 30624). (TNR Gold PR Jan 5, 2016)_x000D_\n   In mid-October 2014, McEwen entered into a transaction with TNR Gold, whereby TNR’s back-in right for up to 25% equity in certain portions of Los Azules has been terminated. In exchange for the termination, TNR would receive a 0.4% NSR on the property, (McEwen PR 10/17/14), as well as 850,000 common shares and 1% of the property purchase price upon sale or transfer within three years of the agreement. (TNR PR 10/17/14)_x000D_\n   As of November 2013, the Los Azules property covered 32,700 ha of mining rights. McEwen believed it had sufficient surface rights for the project. (McEwen TR 11/7/13)_x000D_\n\tDuring the September 2013 quarter, TNR executed the formal documentation for the Los Azules settlement and completed the transfer of the adjoining Escorpio IV concession to McEwen. (TNR 9/13 QR 11/25/13)_x000D_\n\tIn mid-November 2012, McEwen announced that the lawsuit between itself and TNR had been settled. McEwen had the title to the Escorpio IV claim, and TNR retained a Back-In Right for up to a 25% interest in the claims. TNR also received 1 million shares of McEwen. (McEwen PR 11/12/12) TNR also announced that it would recieve a 0.6% NSR on the Los Azules project. (TNR PR 11/12/12)_x000D_\n\tAs of August 2012, the Los Azules property covered 24,800 ha. (McEwen TR 8/1/12)_x000D_\n\tIn April 2010, TNR proposed to exercise its right to acquire 25% of the northern half of the Los Azules property.  Minera Andes was contesting TNR's right to exercise the option with a court action filed. (TNR PR 4/1/10)_x000D_\n\tAs of March 2010, TNR Gold claimed to retain a 25% back-in right on certain properties in and around Los Azules which Xstrata had given to Minera Andes.  A court date was set for the fall of 2010 to resolve the dispute.  TNR engaged British Swiss Investment Corp to undertake a review of Los Azules and alternatives for the project. (TNR Gold PR 3/1/10)_x000D_\n\tAs of February 2009, TNR Gold had a conditional 25% back-in option on Xstrata's portion of the Los Azules deposit that Minera Andes optioned.  TNR was seeking rectification of the option agreement. (TNR Gold PR 2/24/09)_x000D_\n\tLos Azules is not easy to access. It sits at about 4,000 m elevation in an isolated area of the Argentinean Andes, near the Chilean border. There is essentially no infrastructure onsite and there are no nearby towns or settlements. The road into Los Azules is closed roughly seven months of the year because of snow or running water. (NM 2/23/09)","RESV_ORE_TONNAGE":1023052000,"MEAS_IND_ORE_TONNAGE":965500000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":1988552000,"INF_RESRC_ORE_TONNAGE":4239300000,"TOTAL_RESRC_ORE_TONNAGE":5204800000,"R_AND_R_ORE_TONNAGE":6227852000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Porphyry Deposit","ORE_MINERALS":"Bornite, Chalcocite, Chalcopyrite, Pyrite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Los Azules","DISTANCE_FROM":"165 km WNW of San Juan","LOCATION_COMMENTS":"Los Azules is located 6 km east of the Chilean-Argentine border in the Cordilleran region of San Juan province. It is accessible by unimproved dirt roads except for seasonal closures in winter. (McEwen 12/14 AR Mar 9, 2015)_x000D_\n   Los Azules is located at San Juan, province of Argentina. (TNR PR 8/13/14)","ROYALTY_TYPE":"Net Smelter Return","ROYALTY_PCT":1.25,"GEOLOGY_COMMENTS":"Geology at Los Azules comprises Mesozoic volcanic rocks intruded by a Miocene diorite stock, itself intruded by a sub-parallel suite of diorite-dacite dikes along a major NNW-striking fault zone. Porphyry copper style mineralization and hydrothermal alteration are spatially, temporally and genetically related to the dikes. The figure below is a plan map showing the distribution of porphyry dikes at Los Azules. _x000D_\nHydrothermal alteration is classic porphyry-style early potassic (K-feldspar and biotite), and propylitic (chlorite-epidote-albite-calcite) facies overprinted in places by sodic-calcic (albite-chlorite), chloritic, phyllic (quartz-scericite-pyrite) and argillic (supergene) alteration. (Minera Andes Rpt 12/16/10)","EST_MINE_LIFE_YR":21,"GRD_RESV_Cu_pct":0.453,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":4634349,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":0.255,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":2449397,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":0.214,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":9071840,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":0.22,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":11521237,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":0.259,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":16155586,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":0.356,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":7083746,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":0,"CONTAINED_RESV_Ag_oz":0,"GRD_MEAS_IND_Au_gpt":0.032,"GRD_MEAS_IND_Ag_gpt":0.857,"CONTAINED_MEAS_IND_Au_oz":1000000,"CONTAINED_MEAS_IND_Ag_oz":26600000,"GRD_INF_Au_gpt":0.042,"GRD_INF_Ag_gpt":1.1,"CONTAINED_INF_Au_oz":5700000,"CONTAINED_INF_Ag_oz":149900000,"GRD_TOTAL_RESRC_Au_gpt":0.04,"GRD_TOTAL_RESRC_Ag_gpt":1.055,"CONTAINED_TOTAL_RESRC_Au_oz":6700000,"CONTAINED_TOTAL_RESRC_Ag_oz":176500000,"GRD_R_AND_R_Au_gpt":0.033,"GRD_R_AND_R_Ag_gpt":0.881,"CONTAINED_R_AND_R_Au_oz":6700000,"CONTAINED_R_AND_R_Ag_oz":176500000},{"PROP_NAME":"Los Pumas","PROP_ID":85885,"PRIMARY_COMMODITY":"Gold","ALSO_KNOWN_AS":null,"DEV_STAGE":"Exploration","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"12/2021","MINE_TYPE1":null,"MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Gold,Copper,Silver","OPERATOR_NAME":"Sable Resources Ltd.","OPERATOR_COMMON_NAME":"Sable Resources Ltd.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":15.05088332,"OWNER_LIST":"Sable Resources Ltd.  100%","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"Sable Resources Ltd.","CURRENT_OWNER_COMMON_NAME":"Sable Resources Ltd.","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROL nstruction of an exploration adit to provide access for drilling the deposit from underground drill stations. (NGEx PR Apr 30, 2026)_x000D_\n   In March 2026, NGEx completed three drill holes and increased the targeted Phase 4 program to 30,000-m at Lunahuasi. (NGEx PR Mar 23, 2026)_x000D_\n   In March 2026, NGEx received approval for environmental impact statement for the exploration development at Lunahuasi. (NGEx PR Mar 9, 2026)_x000D_\n     During the December 2025 quarter, NGEx completed 20-hole, 25,000-m phase 4 drill program till date at Lunahuasi. (NGEx PR Mar 19, 2026)_x000D_\n   In February 2026, NGEx completed 15-hole, 17,000-m from its on-going phase 4 drill program till date at Lunahuasi. (NGEx PR Feb 10, 2026)_x000D_\n   In January 2026, NGEx reported that eight rigs are currently drilling at Lunahuasi. To date, they drilled 12 DD holes totalling 12,000-m.(NGEx PR Jan 12, 2026)_x000D_\n   In October 2025, NGEx reported that 25,000-m Phase 4 drill program has started at Lunahuasi with six drill rigs currently turning and two more starting soon. (NGEx PR Oct 29, 2025)_x000D_\n   In September 2025, NGEx planned a Phase 4 exploration program at Lunahuasi. (NGEx PR Sept 25, 2025)_x000D_\n   In August 2025, NGEx completed 25,003-m of RC drill program at Lunahuasi. (NGEx RPT Aug 11,2025)_x000D_\n   In August 2025, NGEx planned to commence phase four drill program in October at Lunahuasi. (NGEx PR Aug 11, 2025)_x000D_\n   In July 2025, NGEx reported that Phase 3 drilling results reveal a new mineralization style and exploration target for the Project (NGEx PR July 8, 2025_x000D_\n   In May 2025, NGEx reported that the phase 3 drill program has been completed with over 25,003m in 24 holes at Lunahuasi, and planned to commence phase 4 drill program in October at Lunahuasi. (NGEx PR May 9, 2025)_x000D_\n   In April 2025, NGEx reported completion of 20 DD holes over 23,352m at Lunahuasi. (NGEx PR Apr 24, 2025)_x000D_\n   In January 2025, NGEx reported that phase 3 drill program has been expanded from 20,000-m to 25,000-m with two additional drills scheduled to be added at Lunahuasi. (NGEx PR Jan 22, 2025)_x000D_\n     In December 2024, NGEx reported the completion of 6,500-m of drill program. Also, the company has reported that six drill rigs currently operating at Lunahuasi. (NGEx PR Dec 18, 2024)_x000D_\n   In October 2024, NGEx started Phase 3 DD program for up to 20,000-m at Lunahuasi. (NGEx PR Oct 22, 2024)   _x000D_\n   In September 2024, NGEx reported that it had planned a Phase 3 DD program for ~20,000-m in early October at Lunahuasi. (NGEx PR Sept 26, 2024)_x000D_\n   In April 2024, Ngex reported the completion of 12,952-m drill program and next drill program to begin in or around early December 2024 quarter at Lunahuasi. (Ngex PR Apr 30, 2024)_x000D_\n   In October 2023, NGEx reported that highly expected 2023/2024 field campaign second drill program has resumed at Lunahuasi. The initial plan is for approximately 15,000-m of drilling with two drill rigs at site and another two drill rigs to be added later this month. (NGEx PR Oct 17, 2023)   _x000D_\n    In August 2023, NGEx completed drill program in 11-holes totaling 10,436-m at Los Helados. The company also expected to resume drilling at Lunahuasi in the December 2023 quarter and continue into the June 2024 half. (NGEx PR Aug 24, 2023)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In June 2026, NGEx reported that samples were prepared at ALS laboratory in Mendoza and assayed at ALS laboratory in Lima for copper, gold, silver, and multi-element ICP analysis at Lunahuasi. (NGEx PR June 23, 2026)_x000D_\nIn March 2026, NGEx received environmental approval for development of an exploration adit at Lunahuasi. (NGE PR Mar 9,2026)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of March 2026, NGEx Minerals received approval from the Mining Authority of San Juan Province, Argentina, for a proposed explorati 4 g/mt Au and 10.56 g/mt Ag, and inferred resources were estimated at 240,000 mt grading 1.56 g/mt Au and 7.99 g/mt Ag. (Elementos PR 9/20/12)_x000D_\nIn October 2010, Elementos announced results from an initial drill program completed at its Manantiales low-sulfidation gold-silver project. DD hole MDH019 testing the Manantial vein intercepted 12.6 m grading 5.04 g/mt Au and 37 g/mt Ag from 82.78 m, including.  The drill program at Manantiales consisted of 19 DD holes totaling 1,635.7 m, including 15 holes testing the Manantial vein and four holes testing the Julietta Norte vein, located 1.7 km southeast of Manantial.  Additional drilling is planned for early 2011, which will include drilling of the untested La Puerta vein system. (Elementos PR 10/25/10)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":null,"RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":340000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":340000,"INF_RESRC_ORE_TONNAGE":240000,"TOTAL_RESRC_ORE_TONNAGE":580000,"R_AND_R_ORE_TONNAGE":580000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":null,"DISTANCE_FROM":"115 km WNW of San Juan","LOCATION_COMMENTS":null,"ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":null,"EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":null,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":null,"GRD Friolera, Lama, Lama East, Pascua Lama, Penelope, Quebrada de Pascua","DEV_STAGE":"Advanced Exploration","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"11/2023","MINE_TYPE1":"Open Pit","MINE_TYPE2":"Underground","MINE_TYPE3":null,"COMMODITIES_LIST":"Gold,Silver,Copper","OPERATOR_NAME":"Barrick Mining Corporation","OPERATOR_COMMON_NAME":"Barrick Mining Corp.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":102138.9896256,"OWNER_LIST":"Barrick Mining Corporation  100%","ROYALTY_HOLDER_LIST":"Royal Gold, Inc. (NPI) 0%Metalla Royalty & Streaming Ltd. (Sliding) 0%Unnamed Owner (Sliding) 0%Royal Gold, Inc. (NSR) 0%Franco-Nevada Corporation (NSR) 0%Wheaton Precious Metals Corp. (Streaming) 0%","OWNER_NAME":"Barrick Mining Corporation","CURRENT_OWNER_COMMON_NAME":"Barrick Mining Corp.","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":102138.9896256,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-29.32967,"LONGITUDE":-69.98827,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In February 2025, Barrick reported that mineral resource estimate remained the same at Pascua-Lama. (Barrick PR Feb 6, 2025)_x000D_\n   In 2023, Barrick planned to update PEA in 2024 for Pascua-Lama. The company also reported mineral resources remained same for Pascua-Lama. (Barrick 12/23 AR March 15, 2024)_x000D_\n   In December 2022, Barrick has initiated a study to evaluate the development of a standalone operation at Lama, and expected to be completed in June 2023 quarter, and provide a development decision for the Lama project in 2024. (Barrick PR Dec 12, 2022)_x000D_\n   In the year ended December 2021, Barrick reported that Exploration drill program was suspended in February 2022 by Chilean Supreme court at Pascua. A drill program was planned with two rigs in the first half of FY2022 at Lama. A geometallurgical drill campaign was undertaken in FY2021 at Penelope. (Barrick 12/21 AR Mar 18, 2022)_x000D_\n   During the year-ended December 2020, Barrick initiated a four-rig, 5,400-m geometallurgical drill campaign at Pascua-Lama. (Barrick 12/20 AR Mar 19, 2021)_x000D_\n   As at December 2020, Pascua Lama resources remained same. (Barrick RPT Dec 31, 2020)_x000D_\n   In September 2020, Barrick accepted the Antofagasta Environmental Court’s decision to uphold the closure order and sanctions Chile’s environmental regulator imposed on Compañía Minera Nevada, the Barrick subsidiary that holds the Pascua-Lama project. The project would now be transitioned from care and maintenance to closure in accordance with the decision. (Barrick PR Sept 18, 2020)_x000D_\n   In the December 2019 quarter, Barrick completed a study of the Pascua-Lama project and concluded that the company do not have a plan that meets our investment criteria under our current assumptions. (Barrick 12/19 AR Mar 25, 2020)_x000D_\n   During the September 2018 quarter, Barrick suspended the work on the prefeasibility study for the potential underground project at Pascua-Lama. In addition, Shandong will conduct an evaluation for the potential to develop a mining project at Lama. (Barrick 9/18 QR Oct 24, 2018)_x000D_\n   In February 2018, Barrick continued to evaluate a block cave underground operation at Pascua-Lama with an initial processing capacity of 13,000-15,000 mt/d, with the potential to expand to 30,000 mt/d in the future. (Barrick PR Feb 22, 2018)_x000D_\n   In February 2018, Barrick reported that the sanction is disproportionate to actual environmental impacts. The company is appealing the resolution on a number of grounds however this does not impact the ongoing evaluation of the underground operation at the Pascua-Lama, which would require additional permitting and regulatory approvals in both Argentina and Chile. Proven and probable gold reserves were also being reclassified as a result of evaluation. (Barrick PR Feb 6, 2018)_x000D_\n   In January 2018, Barrick was analyzing revised sanction related to Pascua-Lama project. Based on the preliminary review of the resolution, the SMA has not revoked Pascua-Lama’s environmental permit (RCA) but has ordered the closure of existing facilities on the Chilean side of the project. The company continues to undertake optimization studies to complete the PFS for an underground mining operation at Pascua Lama. (Barrick PR Jan 18, 2018)_x000D_\nAs of December 2017, Pascua Lama hosted a mineral resources of 450 million mt grading 1.54 g/mt Au, 51.52 g/mt Ag, and 0.082% Cu. (Barrick 12/17 RPT Dec 31, 2017) _x000D_\n   In September 2017, Barrick planned to restart its project using revised development plan at Pascua Lama. (Mining News Sept 27, 2017)_x000D_\n   During the June 2017 quarter, Barrick reported that the company remained focused on optimizing, stabilizing and preserving the project site, and addressing outstanding legal, regulatory, and permitting matters for the Pascua Lama project. (Barrick RPT July 26, 2017)_x000D_\n   In April 2017, Barrick announced the company and Shandong would form a working group to explore the joint development of the Pascua Lama project. (Barrick PR Apr 6, 2017)_x000D_\n   In mid-February 2017, Barrick announced that a scoping study at Pascua Lama would be completed by 2017. (Barrick PR Feb 15, 2017)_x000D_\n   In the year ended December 2016, Pascua-Lama hosted reserves and resources estimate totaling 449.9 million mt grading 1.54 g/mt Au, 51.52 g/mt Ag and 0.08% Cu. (Barrick 12/16 6K Feb 15, 2017)_x000D_\n   In June 2016, Barrick announced that it was granted a preliminary approval to a proposed $140 million class action settlement. The settlement would follow three years of litigation in connection with Pascua-Lama. (Barrick PR June 20, 2016)_x000D_\n   In 2015, Barrick anticipated expenditures of about $170 to $190 million at Pascua Lama, including about $140 to $150 million for care and maintenance. (Barrick Gold 12/14 10K Mar 30, 2015)_x000D_\n   As at December 2015, mineral reserves and resources at Pascua Lama remained the same. (Barrick 12/15 QR Feb 17, 2016)_x000D_\n   In its 2014 Annual Report, Barrick stated that it would preserve the option to resume the development of Pascua Lama, including by completing a new execution plan to optimize remaining construction activities. A decision to resume development was dependent on improved economics. _x000D_\nCapital expenditures in 2014 primarily related to capitalization of Linea Minera power line costs and water management system costs. The company expected to incur about $30 to $40 million in capitalized costs in 2015, primarily attributable to permitting and engineering activities related to the final water management solution, as well as commitments to support local communities. (Barrick Gold 12/14 AR Mar 30, 2015)_x000D_\n   In late February 2015, Barrick announced that a permit application for final water management system was expected to be submitted in mid 2015. (Barrick IP Feb 23, 2015)_x000D_\n   In January 2015, Silver Wheaton amended the silver streaming agreement with Barrick regarding Pascua Lama wherein the company would now be entitled to the production of Lagunas Norte, Pierina, and Veladero until March 31, 2018. (Silver Wheaton PR Jan 5, 2015)_x000D_\n   In December 2014, Barrick reported that the Court of Chile declined to consider an appeal of lower court decision regarding sanctions imposed on Pascua-Lama. SMA would reevaluate the administrative fines it imposed on the project.(Barrick PR Dec 31, 2014)_x000D_\n   During the September 2014 quarter, Barrick placed Pascua-Lama on care and maintenance. A decision to restart development would depend on improved economics and more certainty regarding legal and permitting matters. The company continued to explore opportunities to improve the project’s risk-adjusted returns, including engineering optimization, strategic partnerships or royalty and other income streaming agreements. (Barrick 9/14 QR 10/29/14)_x000D_\n   During the June 2014 quarter, Barrick signed a Memorandum of Understanding (MOU) with a group of 15 Diaguita indigenous communities and associations in Chile’s Huasco province. As part of the MOU, the company would make technical and environmental information about the Pascua-Lama project available to the communities and provide financial resources and materials required to support analysis of this information. (Barrick 6/14 QR 7/30/14)_x000D_\n   In April 2014, the ramp-down was still on schedule for completion by mid-2014. Barrick also announced that a decision to restart development would depend on improved economics and reduced uncertainty related to legal and regulatory requirements. (Barrick PR 4/30/14)_x000D_\n    In early March 2014, the Chilean Environmental Court annulled the resolution issued in May 2013 by environmental regulator, Superintendencia del Medio Ambiente (SMA). The matter was remanded to the SMA for issuance of a new resolution, which could mean more severe sanctions against Barrick. By late March 2014, the company filed an appeal to the Chilean Supreme Court for the annulment of the early March decision of the Environmental Court and the issuance of the Supreme Court of a new decision. (Barrick 3/14 QR 3/31/14)_x000D_\n   As of March 2014, Pascua-Lama would have an expected mine life exceeding 25 years. Also, in its first full five years operation, an average production of 9 million oz/y Ag was expected for Silver Wheaton attributable to Pascua-Lama. (Silver Wheaton PR 3/20/14)_x000D_\n   As of March 2014, environmental protection and regulatory compliance activities were under way. (Royal Gold PRES 3/19/14)_x000D_\n   During the December 2013 quarter, Barrick announced the temporary suspension of construction at Pascua Lama. Ramp down was scheduled for completion in the first half of 2014._x000D_\nAs of December 2013, proven and probable resources at Pascua Lama 357.83 million T grading 0.043 oz/t Au, 1.886 oz/t Ag, and 0.072% Cu; measured and indicated resources totaled 173.57 million T grading 0.037 oz/t Au, 0.661 oz/t Ag, and 0.062% Cu; and inferred resources totaled 21.48 million T grading 0.045 oz/t Au, 0.59 oz/t Ag, and 0.04% Cu. (Barrick 12/13 QR 2/13/14)_x000D_\n\tIn early November 2013, the unionized workers of Pascua Lama voted in favor of Barrick's latest offer. (BNA 11/7/2013)_x000D_\n\tIn late October 2013, Barrick reported that its projected 2014 capital cost for the Pascua Lama project was further reduced to $1 billion. (Barrick 9/13 QR 10/31/13)_x000D_\n\tIn late October 2013, Silver Wheaton revised its previously announced offtake agreement of silver production from Pascua Lama. The company extended the pending test completion date to December 31, 2017. _x000D_\n\tIn addition, Silver Wheaton would be entitled to the silver production from Barrick's other mines including, Lagunas Norte (profile #31952), Pierina (profile #29496), and Veladero (profile #29040) until the end of 2016, due to production shortfall at Pascua Lama. (Silver Wheaton PR 10/31/13)_x000D_\n\tIn late October 2013, Barrick elected to temporarily suspend construction activities at Pascua-Lama pending improved project economics. (Royal Gold PR 10/31/13)_x000D_\n\tIn late September 2013, the Supreme Court of Chile issued a ruling that would uphold the environmental approval for Pascua Lama and required the completion of a water management system before resuming construction activities. The ruling concluded the action filed in September 2012 on behalf of four indigenous communities. (Barrick PR 9/26/13)_x000D_\n\tAlso in July 2013, a Chilean indigenous group called on the Supreme Court to revoke the environmental license issued to Pascua Lama. (MW 7/22/13) The Diaguita indigenous community was calling for Barrick to present a new environmental impact assessment. (BNA 8/30/13)_x000D_\n\tIn mid-July 2013, the Copiapo Court of Appeals ruled that Barrick must complete the water management system at Pascua Lama before it could resume construction at the project. A plan was submitted for review by Chilean authorities, with completion of the water management system expected by the end of 2014. (Barrick PR 7/15/13)_x000D_\n\tIn July 2013, Chile's Superintendence of the Environment (SMA) required extra work for the water management system at Pascua Lama; as a result the construction would be delayed for two years to mid-2016. (MJ 7/5/13)_x000D_\n\tIn July 2013, Chile's second environmental court agreed to review a new lawsuit against Barrick for environmental damage caused by Pascua Lama on the border of Chile and Argentina. The lawsuit was field by a group of farmers who claimed that the project would continue to damage glaciers. (BNA 7/4/13)_x000D_\n\tEarly in July 2013, Silver Wheaton reported the amendment of the silver purchase agreement for Pascua Lama. Completion date was extended to December 31, 2016. (Silver Wheaton PR 7/2/13)_x000D_\n\tIn late-June 2013, Barrick submitted a plan to the Chilean authorities for the construction of the water management system at Pascua Lama. The construction was estimated to be completed by the end of 2014 and production would be expected by mid-2016. Capital expenditures in 2013 and 2014 were reduced. _x000D_\n\tIn addition, Barrick was waiting for the decision from the Copiapo Court of Appeals in regard to the action filed in September 2012 on behalf of four indigenous communities seeking to suspend construction at Pascua Lama. (Barrick PR 6/28/13)_x000D_\n\tIn mid-June 2013, it was reported that Barrick would complete the required water infrastructure in December 2014 in order to resume construction at Pascua Lama. (Miningweekly.com 6/12/13)_x000D_\n\tIn early June 2013, it was reported that production at Pascua Lama will not begin in the second half of 2014 due to the noncompliance with the environmental requirements. As a result, capital cost would increase. (BNA 6/4/13)_x000D_\n\tIn May 2013, Barrick received a directive from Chile's Superintendence of the Environment or Superintendencia del Medio Ambiente (SMA) to complete the water management system before resuming construction at Pascua Lama. The company reviewed the SMA resolution in full detail.  _x000D_\n\tIn addition, Barrick was fined $15.5 million (C$16 million) for its noncompliance to the water management system requirements. (Barrick PR 5/24/13)_x000D_\n\tIn May 2013, Barrick estimated that construction work to comply with the water management requirements at Pascua Lama would cost $29 million. This included construction of a water channel and waste water treatment units. (BNA 5/10/13)   _x000D_\n\tIn late April 2013, three top executives at Barrick Gold quit after a court ruling halted construction at Pascua Lama. Barrick was studying several options for Pascua Lama, which spans the Argentina-Chile border, including a complete suspension or starting production on the Argentinean side of the border, which was not affected. (MW 4/26/13)_x000D_\n\tIn April 2013, Barrick announced that it was suspending development work on the Chilean side of the Pascua-Lama project while working to address environmental and regulatory requirements.  However, activities deemed necessary for environmental protection would continue as authorized._x000D_\n\tDevelopment activities in Argentina, where the majority of Pascua-Lama's critical infrastructure was located (including the process plant and tailings storage facility) were not affected.  (Barrick PR 4/10/13)_x000D_\n\tIn early April 2013, Barrick Gold was fined $85,000 for failing to comply with the glacier monitoring plan for the project. The latest fine followed two previously sanctioned processes that resulted in Barrick being required to pay a total of $259,000 back in February 2013. Barrick was also reported to be facing charges from Chile's environmental supervision agency for violations of the project's environmental permits._x000D_\n\tAs part of the ongoing proceedings, Barrick presented a report to the appeals court in January arguing that the melting of glaciers and dust issues near Pascua Lama were the product of global warming, climate change and the region's unfavorable conditions._x000D_\n\tIt was those unfavorable conditions that led Barrick to voluntarily halt prestripping activities in late October. Following the voluntary stoppage, Chile's geology and mining service (Sernageomin) issued an order for prestripping to be put on pause until health and safety issues posed by excessive dust could be dealt with._x000D_\n\tWhile production at Pascua Lama remained scheduled to start in the second half of 2014, Barrick stated hat pre-stripping had to be back on track by sometime late in the June 2013 quarter, otherwise, it could begin to impact the schedule. (BNA 4/2/13)_x000D_\n\tAlso in late February 2013, it was reported that Chile's environmental evaluation department in region III had fined Barrick $200,000 for a series of irregularities associated with its Pascua Lama project. The irregularities included wastewater management, glacier monitoring, and the mitigation of dust issues. (BNA 2/21/13)_x000D_\n\tIn late February 2013, Fluor was contracted by Barrick to provide overall project management and construction management for the Pascua location on the Chile side of the site, and construction management for the Lama location on the Argentina side. The later two scopes would be part of a 50/50 joint venture with Argentinean contractor Techint. (Fluor PR 2/19/13)_x000D_\n\tIn mid-February 2013, it was reported that Barrick had finalized its capital cost estimate for Pascua Lama. The figure remained unchanged from the previously announced preliminary calculation of $8-8.5 billion. (BNA 2/14/13)_x000D_\n\tIn early February 2013, it was reported that Barrick had claimed that landslides affecting several points along a water channel in the area of Pascua Lama did not affect water quality. (BNA 2/4/13)_x000D_\n\tIn January 2013, a special environmental auditing unit from Argentina's San Juan province found that the Veladero mine (profile# 29040) and the Pascua Lama project did not have any impact on glaciers or periglacial areas. (BNA 1/30/13)","ENVIRO_COMMENTS":"In September 2020, Barrick accepted the Antofagasta Environmental Court’s decision to uphold the closure order and sanctions Chile’s environmental regulator imposed on Compañía Minera Nevada, the Barrick subsidiary that holds the Pascua-Lama project. (Barrick PR Sept 18, 2020)_x000D_\n   In March 2015, Chile’s Environmental Court rejected the claims that Pascua-Lama had damaged glaciers within the project’s area of influence. (Barrick PR March 23, 2015)_x000D_\n   On December 30, 2014, the Chilean Supreme Court declined to consider Barrick’s appeal of an Environmental Court decision regarding sanctions imposed on the project in Chile in May 2013 by that country’s environmental regulator (known as the SMA). As a result of the ruling, the SMA would now re-evaluate the ~$16 million administrative fine it previously imposed on the project for deviations from certain requirements of the project’s Chilean environmental approval in 2013. A new resolution from the SMA was pending and could include more severe sanctions against the project. (Barrick Gold 12/14 AR Mar 30, 2015)_x000D_\n  As of September 2014 quarter, hearings related to the environmental damage claim associated with Pascua Lama were ongoing and would continue until November 2014. (Silver Wheaton 9/14 QR 9/30/14)_x000D_\n   In February 2013, it was reported that Barrick had claimed that landslides affecting several points along a water channel in the area of Pascua Lama did not affect water quality. (Barrick PR 2/4/13)_x000D_\n\tIn January 2013, a special environmental auditing unit from Argentina's San Juan province found that the Veladero mine (profile# 108974) and the Pascua-Lama project did not have any impact on glaciers or periglacial areas. (BNA 1/30/13)_x000D_\n\tIn June 2011, the Argentinean Supreme Court was planning to analyze the recently enacted glacier law to determine its constitutionality, following the filing of a suit by Barrick subsidiary Barrick Exploraciones Argentinas. Barrick also requested an injunction until the issue was resolved. Barrick did not expect the three nearby glaciers to be affected by operations at Pascua Lama. (BNA 6/13/11)_x000D_\n\tIn early September 2010, the Argentine senate was discussing a bill which would specifically prohibit mining exploration and operations in and around glaciers. This would directly impact development of Pascua Lama on the Argentine side of the border. Barrick was continuing camp and access construction at the project, while seeking an exclusion from the bill for its project. (BNA 9/7/10) The senate approved the bill later in the month. (BNA 9/30/10)_x000D_\n\tAs of May 2009, EIA approvals had been received from regulatory authorities in Chile and Argentina. The project underwent extensive community and environmental review over several years, which had resulted in improved and enhanced design and environmental protection measures such as: revised pit limits to not impact icefields (Toro 1, Toro 2, and Esperanza), water management program including 87 water monitoring points, enhancement to the quality and quantity of availability of water to downstream users; and technical and social monitoring of the project by the local communities in the area. (Barrick PR 5/7/09)_x000D_\n\tIn 2001, Chile's environmental authorities approved an EIS for an open pit mine at Pascua Lama which involved transferring large volumes of ice between two local glaciers. In December 2004, Barrick submitted a modified EIS to both Chilean and Argentine authorities, proposing to increase the amount of ice to be transferred to 813,000 cubic meters. Environmentalists and some local residents have protested both plans, citing concerns about a possible impact on water supplies in the region. As a result, Chilean authorities asked Barrick to evaluate alternatives such as underground mining, even though the company had previously ruled this out as unfeasible. _x000D_\n\tAs of July 2005, Barrick planned to spend $60 million on regional development over the proposed mine's projected 20-year life, if construction of the project goes ahead. The company could also develop 30 water-quality monitoring stations along the area's river basin, along with infrastructure designed to seal off mining operations from the surrounding environment. Authorities were expected to rule on the issue by October or November 2005. (BNA 7/12/05)","SUBCONTRACTORS":"In February 2013, Fluor was contracted by Barrick to provide overall project management and construction management for the Pascua location on the Chile side of the site, and construction management for the Lama location on the Argentina side. The later two scopes would be part of a 50/50 joint venture with Argentinian contractor Techint. (Fluor PR 2/19/13)_x000D_\n\tDuring the September 2012 quarter, Barrick engaged Fluor Corporation to assume overall project management. (Silver Wheaton 9/12 QR 11/5/12)_x000D_\n\tBy July 2010, Barrick had contracted Fluor-Techint to perform engineering, purchasing for the project, and the construction of the processing plant to be located on the Argentine side of the project. Barrick had also contracted Delkor South America of Santiago to construct thickening and clarification equipment. (MA 7/5/10)_x000D_\n\tIn June 2010, Barrick entered into an agreement with Guacolda for the supply of 120 MW of electricity to Pascua Lama from the Huasco thermo complex in Chile. Argentine approval of the 106-km transmission line to the project was pending. (BNA 6/30/10)_x000D_\n\tIn late March 2000, Barrick contracted SNC-Lavalin for basic engineering services at its Pascua-Lama project._x000D_\n\tSNC-Lavalin also carried out feasibility studies and helped Barrick with test work at the site. (BNA 3/28/00)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"In June 2025, Lama holds 594 ha of land area. (Metalla PR June 27, 2025)_x000D_\n   As of March 2017, Royal Gold has a 1.09% fixed rate royalty for Copper at Pascua-Lama. (Royal Gold 3/17 10-Q May 10, 2017)_x000D_\n   In mid-July 2015, Royal Gold acquired an additional 0.22% NSR sliding-scale royalty totaling 5.45% at Pascua-Lama for an additional $2 million if the project comes into production in 2018 or an additional $1 million if the project enters production in 2019. (Royal Gold 6/15 10-K Aug 5, 2015)  Also, Royal Gold's NSR on copper would not take effect until January 1, 2017.  (Royal Gold WS 8/21/15))_x000D_\n   In March 2015, the total project area consisted of about 45,500 ha in Chile and Argentina. (Silver Wheaton 12/14 AR Mar 18, 2015)_x000D_\n   In January 2015, Silver Wheaton amended the silver streaming agreement with Barrick regarding Pascua Lama. Under the revised agreement, the company would now be entitled to the production of Lagunas Norte, Pierina, and Veladero until March 31, 2018 in consideration of extending the completion date of test deadline to June 30, 2020. (Silver Wheaton PR Jan 5, 2015)_x000D_\n   As of December 2014, the property was subject to a royalty of up to 3% payable to the Provincial Government for minerals extracted from the Argentinean soil. A gross proceeds sliding scale royalty was also payable on gold produced, ranging from 1.433% to 9.555%, and a 1.91% NSR royalty was payable on copper. In addition, a step-scale 5% or 7.5% gross proceeds royalty on gold and a sliding scale NSR royalty of 0.5% to 6%, were payable on all products other than gold and silver on certain portions of the property located in Argentina. (Barrick Gold 12/14 10K Mar 30, 2015)_x000D_\n   As of March 2014, Silver Wheaton held a 25% silver stream for Pascua Lama. (Silver Wheaton 3/14 QR 5/9/14)_x000D_\n   In mid-August 2012, Mountainstar reported that a court date of September 5, 2012 had been set regarding its dispute with Barrick over the Amarillos and Tesoro claims at Pascua Lama. (Mountainstar PR 8/15/12) _x000D_\n\tIn December 2011, Barrick responded to allegations being made by Mountain-West regarding certain claims at Pascua Lama. Barrick stated that the allegations were false and misleading, and that neither Mountain-West nor its JV partner Jorge Lopehandia had a registered ownership interest in the Amarillos 1 - 3000 concessions or the Tesoro Uno 1-30 to Tesoro Doce 1-5 concessions. Barrick had filed a formal complaint with the Ontario and British Columbia Securities Commissions. (Barrick PR 12/21/11) _x000D_\n\tAs of October 2011, Royal Gold held a 0.78-5.23% sliding scale NSR for gold at the Pascua Lama project with about 20% of the royalty limited to the first 14 million oz of gold produced. Also, 24% of the royalty could be extended beyond 14 million oz produced for $4.4 million. In addition, a one-time payment totaling $8.4 million would be made if gold prices exceed $600/oz Au for any six-month period within the first 36 months of commercial production. Royal Gold also held a 1.05% NSR for copper, which would not take effect until January 1, 2017. (Royal Gold WS 10/11)_x000D_\n\tIn September 2011, Mountain-West Resources translated and published a technical report which included information pertaining to the ownership of certain claims at Pascua Lama. _x000D_\n\tThe report concluded that the properties known as Los Amarillos 1 through 3000 and Tesoros One through Twelve should not have been included in the list of properties owned by Barrick, due to the fact that they had not been and were not currently registered in the company's name at the Registrar of Mines of the City of Vallenar, Atacama Region, in conformity with Chilean law. (Mountain-West RPT 9/21/11)_x000D_\n\tIn early July 2010, Royal Gold acquired an additional 1% NSR sliding-scale royalty at Pascua Lama from three parties for $68 million. Royal Gold's royalty interests at Pascua Lama totaled 5.23% on gold production at prices greater than $800/oz Au, and 1.05% on copper production effective January 1, 2017. (Royal Gold PR 7/6/10)_x000D_\n\tIn September 2009, Barrick entered an offtake agreement with Silver Wheaton for 25% of the life-of-mine silver production from the Pascua Lama and 100% of silver production from the Lagunas Norte (profile #31952), Pierina (profile #29496), and Veladero (profile #29040) mines until project completion at Pascua Lama. Barrick will receive a cash deposit of $625 million over three years, plus ongoing payments (minimum of $3.90/oz Ag) for each ounce of silver delivered under the agreement. (Barrick PR 9/8/09) Barrick will deliver to Silver Wheaton silver production from the Pascua Lama, Lagunas Norte, Pierina, and Veladero mines until December 31, 2016. (Silver Wheaton 12/13 AR 3/20/14)_x000D_\n\tAs of June 2008, Royal Gold held a 0.16-1.08% sliding scale NSR. (Royal Gold WS 6/08) _x000D_\n\tAs of June 2008, International Royalty held a 0.63% NSR on copper. (International Royalty Website 6/08)_x000D_\n\tIn late March 2007, Barrick submitted an EIA to Chile's environmental regulator for a $50 million thermo generation project in region IV that would supply Pascua Lama with a portion of its energy. This new project, known as Punta Colorada, would consist of two 18V46-model Wartsila turbines with 16.3 MW capacity each. (BNA 3/23/07)_x000D_\n\tIn December 2006, International Royalty Corp entered into binding agreements to acquire a  0.47-3.15% sliding-scale NSR royalty on the Pascua gold project. IRC has agreed to pay $37.4 million in cash at closing for this royalty interest. The royalty applies to the first 14 million oz of gold produced from the Chilean side of the Pascua-Lama deposit. (International Royalty PR 12/21/06) _x000D_\n\tIn July 2001, Barrick announced plans to combine the development of its Pascua Lama and Veladero (profile# 29040) projects. (NM 7/20/01)_x000D_\n\tIn February 1998, Barrick reported that it had increased direct ownership of the project to over 90%, and purchased the Lama property. The Lama property lies on the projected extension of the Pascua orebody just inside the Argentina border. (Barrick 12/97 AR 2/27/98)_x000D_\n\tAlthough only 20% of the open pit orebody lies in the Lama portion on the Argentine side, the mill facilities will be built in Argentina within the mining operations area envisioned in the progressive Cross Border Mining Treaty between the two countries. (MJ 11/24/06)_x000D_\n\tBarrick has an agreement with the governments of Chile and Argentina that will allow Barrick to test extensions of the Pascua orebody into Argentina and further explore Frontera. (Barrick 12/97 AR 2/27/98)_x000D_\n\tIn 1994, Barrick Gold acquired Pascua Lama through the Lac Minerals Ltd purchase. (Barrick 12/03 AR 3/1/04)_x000D_\n\tIn 1993, the project covered about 18,225 ha. (LAC PR 2/16/93)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":441993000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":441993000,"INF_RESRC_ORE_TONNAGE":15430000,"TOTAL_RESRC_ORE_TONNAGE":457423000,"R_AND_R_ORE_TONNAGE":457423000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Epithermal High Sulphidation","ORE_MINERALS":"Calaverite, Cerargyrite (Chlorargyrite), Enargite, Pyrite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Pascua Lama","DISTANCE_FROM":"280 km NNW of San Juan","LOCATION_COMMENTS":"Pascua Lama is located in the Frontera District in Chile’s Region III and Argentina’s San Juan Province. It straddles the Chile-Argentina border and is approximately 150 km southeast of the city of Vallenar, Chile, 380 km by road northwest of the city of San Juan, Argentina and approximately 10 km from the Veladero mine. The Chilean part of the deposit is at an elevation of approximately 4,300 to 5,250 m above sea level. (Barrick Gold 12/14 10K Mar 30, 2015)_x000D_\n   The Pascua Lama project straddles the border between Argentina and Chile. The site is accessible from the city of Vallenar in Region III via secondary roads C-485 to Alto del Carmen, and C-489 from Alto del Carmen to El Corral, Chile. (Royal Gold 6/11 AR 8/18/11) _x000D_\n   The property lies 48.3 km north of the El Indio mine.  (Barrick 12/94 AR 2/24/95)_x000D_\n The deposit is located at an elevation of 4,850 m and it is likely that the plant and camp site will be located downstream from the mine, at 3,000 m where the lower altitude will allow processing operations to run more smoothly. (MMLA 5/98)","ROYALTY_TYPE":"Streaming Agreement","ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"Gold, silver and copper mineralization at Pascua-Lama is part of a mineralized acid sulfate system that was structurally controlled within intrusive and volcanic rock sequences of Upper Paleozoic and Middle Tertiary age. Basement rocks in the area are dominated by a multiphase granite pluton that may be a slightly younger upper Permian or lower Triassic phase of the Permian Guanaco Sonso sequence of intrusive and volcanics. In the deposit area, the granite intrudes older diorites and volcanic pyroclastic units and is, in turn, intruded by diorite stocks and dykes of mid-Tertiary Bocatoma age. During Tertiary time, all of the previously described rocks were cut by sub-vertical fault zones and hydrothermal breccias located at complex fault intersections._x000D_\nNumerous breccias bodies occur in the Esperanza, Quebrada de Pascua and Lama areas. Typically the breccias show a strong correlation to zones of intersection of two or more major structural zones. On the surface, this breccia body is about 650 meters long and up to 250 meters in width, while underground, between 200 and 400 m below the surface, the composite body measures about 550 m in length and up to 130 m in width. It extends to at least 700 m below surface. This well mineralized breccia pipe is evidence of an explosive hydrothermal event related to the formation of the Quebrada de Pascua ore deposit. (Barrick Gold 12/14 10K Mar 30, 2015)_x000D_\n   Pascua-Lama lies along the western margin of an oval-shaped alteration system measuring 10 km in its longest dimension. Gold, silver, and copper mineralization occurs in a core zone of pervasive quartz-alunite alteration. Ore-grade values occur in strongly silicified and quartz-alunite altered zones along north-south- and northwest-southeast-trending faults.  (NM 12/23/02)   _x000D_\n\tIn 1993, road cuts exposed a stratabound, subhorizontal zone of disseminated gold and silver. Mineralization occurs at the base of a porous tuff lying unconformable on Paleozoic basement.  Alteration includes quartz-alunite in the footwall grading to silicification and steam-heated (acid leach) alteration in the hanging wall. Below the 4,575-m level, low-grade mineralization is associated with quartz veinlets and stockwork.  (NM 4/26/93)","EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":0,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":0.083,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":363010,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":0.049,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":7484,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":0.081,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":370494,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":0.081,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":370494,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":0.083,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":363010,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":0,"CONTAINED_RESV_Ag_oz":0,"GRD_MEAS_IND_Au_gpt":1.541,"GRD_MEAS_IND_Ag_gpt":51.929,"CONTAINED_MEAS_IND_Au_oz":21873600,"CONTAINED_MEAS_IND_Ag_oz":737985000,"GRD_INF_Au_gpt":1.741,"GRD_INF_Ag_gpt":17.802,"CONTAINED_INF_Au_oz":865200,"CONTAINED_INF_Ag_oz":8833390,"GRD_TOTAL_RESRC_Au_gpt":1.551,"GRD_TOTAL_RESRC_Ag_gpt":50.781,"CONTAINED_TOTAL_RESRC_Au_oz":22738800,"CON 03/2025","MINE_TYPE1":null,"MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Copper,Gold,Silver,Lead,Zinc,Bismuth","OPERATOR_NAME":"King Copper Discovery Corp.","OPERATOR_COMMON_NAME":"King Copper Discovery Corp.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":246.22919013,"OWNER_LIST":"PetraGold Mining Services S.R.L (Optionor) %; Private Interest (Fractional) %; King Copper Discovery Corp. (Optionee) 100%; Cerro Negro SRL (Fractional) %","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"King Copper Discovery Corp.","CURRENT_OWNER_COMMON_NAME":"King Copper Discovery Corp.","OWNER_TYPE":"Optionee","OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":246.22919013,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-30.833963,"LONGITUDE":-69.600415,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In March 2025, Turmalina announced its company name change to \"King Copper Discovery Corp\". (Turmalina PR March 11, 2025)_x000D_\n  In March 2025, Turmalina reported that company will change its name to King Copper Discovery Corp from Turmalina Metals Corp. (Turmalina PR March 3, 2025)_x000D_\n   In May 2024, Turmalina repoted that heavy equipment has been mobilized to prepare drilling platforms, access roads and transect target mineralized structures. (Turmalina PR May 8, 2024)_x000D_\n   In November 2023, Turmalina planned a 4,000-m DD program at San Francisco. (Turmalina PR Nov 15, 2023)_x000D_\n   In October 2023, Turmalina completed the 22 hole totaling 2,984-m DD program at San Francisco. (Turmalina PR Oct 10, 2023)_x000D_\n   In June 2023 quarter, Turmalina reported that it has completed the phase one, phase two and phase three exploration program at the San Francisco. (Turmalina 6/23 MD&A Aug 17, 2023)_x000D_\n   In July 2023, Turmalina began a 3,000-m DD program at San Francisco. (Turmalina PR July 5, 2023)_x000D_\n   In March 2023, Turmalina was preparing for a program of about 12,000-m of RC drill program at San Francisco to test seven new high priority targets from 2022 exploration program. (Turmalina PR Mar 2, 2023)_x000D_\nIn January 2022, Turmalina announced the start of 2022 exploration program at San Francisco. (Turmalina PR Jan 24, 2022)_x000D_\nIn June 2021, Turmalina completed a mapping and sampling program with the identification of several high priority breccia pipes, also phase three deep drilling currently underway at San Francisco. (Turmalina PR June 8, 2021)_x000D_\n   In January 2021, Turmalina reported that 22 holes for a total of 4,653 m were drilled during the 2020 phase two drill program at San Francisco. A further nine holes totaling 2,768 m were drilled in 2020. (Turmalina PR Jan 25, 2021)_x000D_\n   In June 2020, Turmalina started a 4,500-m, phase two drill program at San Francisco. (Turmalina PR June 3, 2020)_x000D_\n   In May 2020, Turmalina received approval from regulatory authorities in San Juan to begin DD program for  4,500-m DD at San Francisco. The mobilization of drill rigs to the site would start immediately. (Turmalina PR May 20, 2020)_x000D_\n   In May 2020, Turmalina reported that it would start phase 2 drilling program soon at San Francisco. (Turmalina PR May 4, 2020)_x000D_\n   In March 2020, Turmalina completed the summer field program at San Francisco, with exploration staff demobilized from site at the end of the program, which mapped the entire project area and identified several exploration targets.  Turmalina geologists were planning the upcoming drill program. _x000D_\n   On March 19, the Argentine government declared a nation-wide mandatory quarantine, which would be in effect from the 21st to the 31st of March to reduce the spread of COVID-19.  While work is ongoing by the technical and management team, in preparation for drilling, the decision to begin drilling would be made once planning was complete, in consultation with local authorities.  (Turmalina PR Mar 23, 2020)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In March 2020, as project geological modeling and was expected to be ready by the end of the September 2025 quarter. (Orvana PR Aug 12, 2025)_x000D_\n   In June 2022, Orvana completed 41 holes, 6,482.6-m phase I infill and resource-growth drill program at Oxides Horizon. Phase II is also planned to start in November 2022 with 11,000-m of drill program at Cerros Taguas and 3,000-m at Cerro Campamento. (Orvana PR June 6, 2022)_x000D_\n   In March 2022, Orvana completed 24-holes for 3,845-m drill program as of 27, March at Taguas,It also planned to undertake an infill drill program divided in two phases at Cerros Taguas and Cerro Campamento in 2022 and 2023. (Orvana PR Mar 31, 2022)_x000D_\n   In the year ended September 2021, Orvana reported that Preliminary Economic Assessment(PEA) is being finalized in the first quarter of fiscal 2022 at Taguas. 56,600-m had been drilled till now at Taguas.(Orvana 9/21 AR Dec 30, 2021)_x000D_\nIn mid-July 2021, Orvana planned to completed an expanded-resource PEA for Taguas by the end of 2021. It also planned an infill drill program required to develop a PFS in 2022. (Orvana PR July 14, 2021)_x000D_\n   In July 2021, Orvana reported an updated mineral resource estimate for Taguas totaling 133.6 million mt grading 0.35 g/mt Au, 9.42 g/mt Ag, and 0.11% Cu. (Orvana PR July 5, 2021)_x000D_\n   In April 2021, the drill program at Taguas was completed. Results were expected to be completed in late May. (Orvana PR May 25, 2021)_x000D_\nIn February 2021, Orvana reported that a 5,000-m drill program was currently ongoing at Taguas. (Orvana PR Feb 24, 2021)_x000D_\n   In January 2021, Orvana reported that preparations are underway for a drill campaign to start in February 2021. (Orvana PR Jan 18, 2021)_x000D_\n   In September 2020, Orvana planned field work in coming months at Taguas. (Windfall PR Sept 14, 2020)_x000D_\n   During the September 2019 quarter, Orvana prepared a drilling program in order to expand and to support the potential upgrade in Mineral Resource estimates at Taguas project. (Orvana 9/19 QR Nov 26, 2019)_x000D_\n   In June 2019, Orvana announced a preliminary economic assessment (PEA) detailing an opet pit mining at Taguas at 12,000 mt/d. The LOM production was projected be at 410,000 oz Au and 9 million oz Ag with a production period of 10 years. _x000D_\nIn addition, the PEA also outlined an inferred resources containing 494,000 oz Au and 18.11 million oz Ag at a 0.25 g/mt AuEq cut off grade. (Orvana PR June 28, 2019)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In late-December 2021, Orvana reported that in 2017 Dr. Catalina T. Michieli of the National University of San Juan made an archaeological _x000D_\nreport of the Project based on bibliographic background and knowledge of the area. Another detailed archaeological survey was carried out in 2018. Certified reference materials (CRMs) purchased from CDN Resource Laboratories (4), Geostats Pty. Ltd. (3) and Rock Labs Ltd (7)._x000D_\n(Orvana TR Dec 29, 2021)_x000D_\n_x000D_\n     In September 2020, Windfall Geotek entered into an agreement with Orvana Minerals Corp to develop gold exploration targets over Taguas. (Windfall Geotek PR Sept 14, 2020)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of June 2026, The Evelina Property comprises four claims totalling 4,015 ha. The addition of the Evelina Property increases the Taguas Project's exploration footprint by approximately 123%, from 3,274 to 7,289 ha. (Orvana PR June 29, 2026)._x000D_\n   As of May 2021, Taguas consists of 15 mining concessions over an area of 3,273.87 ha. (Orvana PR May 21, 2021)_x000D_\n   As of September 2020, Taguas covered an area of 41.8 sq.km. (Windfall Geotek PR Sept 14, 2020)_x000D_\n   As of May 2019, Taguas comprsied of 15 mining concessions over an area of 3,273.87 ha. (Orvana PR May 14, 2019)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":39463000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":39463000,"INF_RESRC_
