MINE_TYPE2":"Open Pit","MINE_TYPE3":null,"COMMODITIES_LIST":"Gold,Silver,Zinc,Copper,Lead","OPERATOR_NAME":"Challenger Gold Limited","OPERATOR_COMMON_NAME":"Challenger Gold Ltd.","OPERATOR_COUNTRY":"Australia","OPERATOR_MKT_CAP":434.1303957,"OWNER_LIST":"Challenger Gold Limited  100%","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"Challenger Gold Limited","CURRENT_OWNER_COMMON_NAME":"Challenger Gold Ltd.","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Australia","OWNER_MKT_CAP":434.1303957,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-30.73193,"LONGITUDE":-68.95328,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In July 2026, Challenger commenced a 35,000-m DD program at Hualilan, with the first two of four rigs now operating on site, comprising targeted exploration drilling and geotechnical drilling to support Phase 1 development. (Challenger PR July 30, 2026)_x000D_\n   Also in May 2026, Challenger planned a resource growth drill program for Hualilan. (Challenger PR May 18, 2026)_x000D_\n   In May 2026, Challenger requested an extension to the voluntary suspension of its completed pre-feasibility study at Hualilan. (Challenger PR May 14, 2026)_x000D_\n   In April 2026, Challenger completed 40-hole infill drill program at Sanchez, Norte and Magnata, and further 4-hole at Sentazon. (Challenger RPT Apr 30, 2026)_x000D_\n   In the year ended December 2025, Challenger reported that a LOM PFS study is targeted for release by Q1 2026. (Challenger 12/25 AR Mar 31, 2026)_x000D_\n  In February 2026, Challenger commenced ore haulage from Hualilan to the Casposo Plant under its Toll Milling strategy. Additionally, installation of a dedicated modular Bailey bridge is underway, targeting completion in the June 2026 quarter. (Challenger PR Feb 27, 2026)_x000D_\n   Also in October 2025, Challenger reported the a planned 40,000-m drill program commencing in January 2026. (Challenger Gold PR Oct 27, 2025)_x000D_\n   In October 2025, Challenger engaged Austral Gold's Casposo Toll Milling Plant for processing Hualilán mineralized material. (Challenger RPT Oct 21, 2025)_x000D_\n   In September 2025, Challenger received approval of the environmental impact assessment amendment for Hualilan. The project was now fully permitted for toll milling. (Challenger PR Sept 30, 2025)_x000D_\n   In August 2025, Challenger was awarded the final permit that would allow the company to begin drill and blast operations for toll milling at Hualilan. (Challenger PR Aug 19, 2025)_x000D_\n   In July 2025, Challenger started final testwork for PFS study and expected to complete it in December 2025 quarter at Hualilan. (Challenger PR July 21, 2025)_x000D_\n   In July 2025, Challenger reported that PFS level testwork program will begin in July and all metallurgical testwork and metallurgic inputs for the stand-alone at Hualilan PFS was on track for completion by early December 2025 quarter. (Challenger PR July 9, 2025)_x000D_\n   In June 2025, Challenger announced the acceleration of drilling and studies for an expanded standalone Life of Mine (LOM) development at Hualilan, with the LOM study expected to be released by the first quarter of 2026. (Challenger PR June 4, 2025)_x000D_\n   In June 2025, a Preliminary Feasibility Study (PFS) was conducted for an open pit mining operation with a projected mine life of 34 months, utilizing the Hualilan Toll Milling Agreement with Austral Gold's Casposo mine (Profile#31219). The open pit mining phase is expected to last for 24 months, with a total of 3.27 million tonnes of ore planned to be mined. Ore haulage is scheduled from October 2025 to September 2028, with processing at the mill planned from the December quarter of 2025 to the June quarter of 2028. A processing rate of 150,000 wmt/y is estimated at Casposo mill. (Challenger TR June 4, 2025)_x000D_\n   Also in February 2025, Challenger announce that the pre-feasibility study for Toll Milling at Hualilan is expected to be completed in March 2025 (Challenger PR Feb 20, 2025)_x000D_\n   In February 2025, Challenger reported the completion of definitive toll milling agreements. (Challenger PR Feb 11, 2025)_x000D_\n   Also in December 2024, Challenger reported that Casposo plant is suitable for toll milling of Hualilan ore. (Challenger PR Dec 13, 2024)_x000D_\n   In December 2024, Austral entered into a Binding Memorandum of Understanding with Challenger to process Challenger’s Hualilan project at Casposo’s Plant. Under the terms of Toll Treatment Agreement, the Casposo Plant will be operated by Casposo Argentina Ltd. Sucursal Argentina, the guaranteed toll treatment of 150,000 tons available to Challenger per year, with a guaranteed toll treatment capacity available to Challenger of 450,000 tons over a three (3) year period, and Challenger agreed to pay US$3 million fixed payment (US$2 million payable within 15 days of signing the Binding MOU, US$1 million due in two years), a US$110,000 monthly fee, and an incentive fee linked to recovery margins. The operations were expected to start in the second half of 2025. (Austral PR Dec 5, 2024)_x000D_\n   In the September 2024 quarter, Hualilan obtained EIA approval which covers 19 mining rights. Additionally, Challenger planned to start production in the June 2025 quarter.  (Challenger 09/24 QR Oct 31, 2024)_x000D_\n   In early October 2024, Challenger has entered into an agreement to toll mill ore from Hualilan with Dolphin Real Assets Fund SPC Ltd. Toll milling is targeted to start within 9 months. (Challenger PR Oct 3, 2024; Challenger 09/24 QR Oct 31, 2024)_x000D_\n   Also in July 2024, Challenger reported that a 1,910-m diamond core drill program was completed at Hualilan. (Challenger 6/24 SR Sept 13, 2024)_x000D_\n  In July 2024, Challenger reported that the mineral resource estimate remained the same at Hualilan. (Challenger PR July 26, 2024)_x000D_\n   In December 2023, Challenger reached pivotal environmental achievement by obtaining a neutral carbon footprint certification for Hualilan. The company also reported complete Scope 1 and Scope 2 emissions related to the mine plan is underway for the Hualilan Scoping Study are being calculated independently. (Challenger PR Dec 21, 2023)_x000D_\n   In November 2023, Challenger announced the results of a scoping study at Hualilan. (Challenger PR Nov 8, 2023)_x000D_\n   During the September 2023 quarter, Challenger reported that drilling was completed at Hualian. (Challenger 9/23 QR Oct 31, 2023)_x000D_\n   In the June 2023 Quarter, Challenger is about to complete Scoping Study at Hualilan. (Challenger 6/23 QR Sept 12, 2023)_x000D_\n   During the March 2023 quarter, Challenger expected to deliver the scoping study in July 2023 at Hualilan. (Challenger 3/23 QR Apr 28, 2023)_x000D_\n   Also in March 2023, Challenger reported an updated mineral resource estimate totaling 60.6 million mt at Hualilan. (Challenger PR Mar 28, 2023)_x000D_\n   In March 2023, Challenger reported that a drill program which also consist of infill drill program was underway at Hualilan. Further resource extension, infill and exploration drill program and metallurgical test work was planned. (Challenger PR Mar 21, 2023)_x000D_\n   In December 2022, Challenger expected to complete scoping study during the June 2023 quarter. (Challenger PR Dec 23, 2022)_x000D_\n   In December 2022, Challenger planned to update mineral resource in the March 2023 quarter. (Challenger RPT Dec 7, 2022)_x000D_\n   In September 2022, Challenger reported that 204,000-m drill program has been completed and further 50,000-m additional drilling is planned to which will result in update of the mineral resource estimate at Hualilan. (Challenger PR Sept 9, 2022)_x000D_\n   In June 2022, Challenger updated mineral resource estimate at Hualilan totaling 47.7 million mt while scoping study was scheduled to start post completion of ongoing 204,000-m drill program. (Challenger RPT June 1, 2022)_x000D_\n   During the year ended June 2022, Challenger reported outstanding metallurgical testing with average gold recovery increased to 95% across all ore types. (Challenger 6/22 AR Sept 29, 2022)_x000D_\n   In May 2022, Challenger reported that Stage 1 metallurgical testing completed to provide comfort prior to committing to 200,000-m of drilling at Hualilan. The company reported significantly more detailed flotation, gravity recoverable gold (GRG) tests and leach testing of the various flotation tails components which has been  designed to lock in the flow sheet to support a Scoping Study. Additional Stage 2 work involving comminution and variability testing, blended test work, and pilot plant testing is ongoing. (Challenger RPT May 3, 2022)_x000D_\n   During the March 2022 quarter, Challenger completed a 89-hole, 34,374-m drill program at Hualilan. (Challenger 3/22 QR Apr 29, 2022)_x000D_\nIn March 2022, Challenger planned Infill drilling at Sentazon and Magnata. (Challenger RPT Mar 30, 2022)_x000D_\n   During the half year ended 2021, Challenger completed approximately 54,000-m of the 120,000-m drill program. The Company also_x000D_\nintends to release a maiden, and interim, Resource Estimate during H1 2022. (Challenger 12/21 IR March 16, 2022)_x000D_\n  In March 2022, Challenger reported that they had  committed to a 9-rig 120,000-m drill program at Hualilan project. (Challenger RPT March 9, 2022)_x000D_\n  In February 2022, Challenger announced results from 64 holes and three drill hole extensions at Verde within Hualilan. Also, the company planned a follow up drill program. (Challenger RPT Feb 15, 2022)_x000D_\n   During the December 2021 quarter, Challenger completed 83 holes for 30,170-m of drilling at Haulilan. The extension drill program at Sentazon had now been expanded to include an additional 24 drill holes with 15 completed and further holes in planning.  (Challenger 12/21 QR Dec 31, 2021)_x000D_\n   In December 2021, Challenger reported that ongoing drill program had significantly extended the mineralisation zone at Magnata within Hualilan. (Challenger PR Dec 29, 2021)_x000D_\n   In October 2021, Challenger received assay results from the next 8 holes of the drill program at Sentazon which had now been expanded to include a minimum of 17 additional drill holes with further holes in planning. (Challenger RPT Oct 19, 2021)_x000D_\n   In late September 2021, Challenger announced that a follow up drill program was planned and several drill holes at Verde will be extended as part of the ongoing program. (Challenger RPT Sept 30, 2021)_x000D_\n   In September 2021, Challenger has 110,401-m of the current fully funded drill program to complete, which will take the total metres drilled by the company at the Hualilan Gold project to 204,000-m. (Challenger PR Sep 9, 2021)_x000D_\n   In August 2021, Challenger announced results for its first deep step out holes at Sentazon. (Challenger RPT Aug 20, 2021)_x000D_\n   In August 2021, Challenger announced that the drill program at Sentazon was expanded to 32 holes. (Challenger PR Aug 12, 2021)_x000D_\n   In July 2021, Challenger completed 33 hole DD program and also programed 14 hole drill program at Magnata. (Challenger RPT July 29, 2021)_x000D_\n   Also in July 2021, Challenger reported that the metallurgical testing results with recoveries of 93.4% Au and 70.4% silver using gravity separation and floatation at Hualilan. (Challenger RPT July 21, 2021)_x000D_\n   In July 2021, Challenger will acquire a ninth man-portable rig to drill out Hualilan Hills. Mineral resources remained the same at Hualilan. (Challnger RPT July 1, 2021) _x000D_\n   In mid-June 2021, Challenger reported that a drill program was ongoing at Verde. (Challenger RPT June 16, 2021)_x000D_\n   In early June 2021, Challenger announced a new zone of high grade mineralization which extended strike to 3.1 km, an increase of 50% at Hualilan. (Challenger RPT June 3, 2021)_x000D_\n   In May 2021, Challenger announce further results from ongoing Phase 1 metallurgical testing at Hualilan. These results compliment the recoveries of 91-94% from the high-grade skarn mineralization from Phase 1 metallurgical testing in February 2021. (Challenger RPT May 17, 2021)_x000D_\n   In May 2021, Challenger announced results from drill which targeted the intrusion-hosted mineralization at the Hualilan project. (CEL RPT May 5, 2021)_x000D_\n   During March 2021 quarter, Challenger completed the current 45,000 m drill program at Hualilan Gold project. (Challenger 3/21 QR Apr 30, 2021)_x000D_\n   In April 2021, Challenger started 30,000-m drill program using five rigs at Hualilan. (Challenger RPT Apr 20, 2021)_x000D_\n   In March 2021, Challenger reported results from its drill program at Hualilan. Also company planned to undertake further metallurgical test work, initial drill program and to investigate further drilling requirements to upgrade both the unclassified mineralisation and mineralisation in the existing historical resources in next 12 months. (Challenger RPT Mar 25, 2021)_x000D_\n   In March 2021, Challenger announced first results from its underground channel sampling program at Hualilan. (Challenger RPT Mar 23, 2021)_x000D_\n   In late February 2021, Challenger reported initial results from metallurgical testing with a gold recovery of 91%-94% and silver recovery of 84%-86% at Hualilan. (Challenger RPT Feb 22, 2021)_x000D_\n   In mid-February 2021, Challenger reported follow up drilling was planned at GNDD-115. (Challenger RPT Feb 11, 2021)_x000D_\n   In February 2021, Challenger adjusted its drill plan with two rigs to focus on infilling and extending at Hualilan. (Challenger RPT Feb 2, 2021)_x000D_\n    During the December 2021 half, Challenger started 45,000-m high impact drill program at Hualilan. (Challenger 12/20 IR Mar 2, 2021)_x000D_\nDuring the December 2020 quarter, Challenger completed 62 diamond core holes totaling 16,528-m at Hualilan (Challenger 12/20 QR Jan 31, 2021)_x000D_\n   In August 2020, Challenger reported that the previously planned 35,000-m drill program has been expanded to 45,000-m. (Challenger RPT Aug 11, 2020)_x000D_\n   In July 2020, Challenger planned a 35,000-m drill program, scoping study, mining and geophysical studies at Hualilan. (Challenger PR July 16, 2020)_x000D_\n   In June 2020, Challenger completed 35 holes from its 7,500-m DD program to date. (Challenger PR June 17, 2020)_x000D_\n   In late-April 2020, Challenger restarted operations at Hualilan which included its 7,500-m DD program following the receipt of all government approvals and planned to undertake exploration work over the next 12 months. (Challenger PR Apr 30, 2020)_x000D_\n   In April 2020, Challenger completed geophysical survey at Cerro Norte. Result were expected in few weeks. In addition to that, Challenger advised by the San Juan Mining Minister that it should receive special clearance to restart all operations at Hualilan. (Challenger PR Apr 8, 2020)_x000D_\n   In February 2020, Challenger began its second dill program at Hualilan comprised of about 7,500 m of continuous drilling in three stages. (Challenger RPT Feb 11, 2020)_x000D_\n   During the December 2019 quarter, Challenger completed a 1,497-m drilling at Hualilan. A 3,000-m drill program was planned followed by a 5,000-m resource expansion program. (Challenger 12/19 QR Jan 31, 2020)_x000D_\n   In December 2019, Challenger planned to start next phase of drill program in January 2020 at Hualilan. (Challenger PR Dec 30, 2019)_x000D_\n   In October 2019, Challenger started the 2,000-m drilling program at Hualilan. (Challenger PR Oct 15, 2019)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"During the December 2025 quarter, Challenger Gold contracted Soil and Rock Engineering for designing a tailings storage facility at Hualilan. (Challenger Gold 12/25 QR Jan 30, 2026)_x000D_\n   In October 2025, Challenger Gold engaged Austral Gold's Casposo Toll Milling Plant to process a minimum of 450,000 tonnes of near-surface Hualilán mineralized material over three years, while utilizing THOR for drilling services covering approximately 3.2 million tonnes of ore and waste, and ORICA for blasting products and services from 2025 to 2028. (Challenger RPT Oct 21, 2025)_x000D_\n   In May 2023, Challenger signed a non-binding memorandum of understanding with YPF Luz for the supply of renewable power to Hualilan. (Challenger PR May 10, 2023)_x000D_\n   In 1999, Aaron Equipment of Chicago agreed to locate and coordinate the installation of the equipment needed for Hualilan gold production.  (LAMR 2/99)_x000D_\n\tDuring 1996, EPROM Ltda of Santiago, Chile, carriedout underground mapping, reserve estimates, sampling, and preliminary economic assessments._x000D_\n\tIn 1995, Watts, Griffis, and McOuate oversaw the 1,400 m RC drill program. (Plata CS 2/97)","START_UP_YR":null,"PROJ_START_UP_YR":2026,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of year ended December 2024, Hualilan covered an area of 632 sq km. (Challenger 12/24 AR Mar 31, 2025)_x000D_\n   As of November 2023, Hualilan comprised of 53 mining concessions covering 536 ha. (Challenger PR Nov 8, 2023)_x000D_\n   In the June 2023 Quarter, Challenger holds 15 mining licenses and an exploration license covering the 26 sq km at Hualilan. (Challenger 6/23 IR September 13, 2023)_x000D_\n   As of February 2023, Hualilan consisted of 15 minas (equivalent of mining leases) and five demasias (mining lease extensions) held under an farm-in agreement with Golden Mining SRL and CIA GPL SRL. Fourteen additional Minas and eight exploration licenses (Cateos) have been transferred to CEL under a separate farm-in agreement. Six Cateos and eight requested mining leases are directly held. (Challenger RPT Feb 7, 2023)_x000D_\n   During the September 2021 quarter, Challenger increased its position at Hualilan from 80 to 177.5 sq km. (Challenger 9/21 QR Oct 29, 2021)_x000D_\n   In October 2021, Challenger entered into agreements to acquire a package of exploration licenses adjacent to Hualilan. The concessions comprise five contiguous exploration licenses which are collectively called the Cordon del Peñon tenements. The Cordon del Peñon tenements covered 97.5 sq km. (Challenger RPT Oct 25, 2021)_x000D_\n   As of June 2021, Hualilan comprised of 15 mining leases and two mining lease extensions, an additional eight mining and three exploration licenses under a farm-in agreement, and a further four licenses directly held. (Challenger RPT June 16, 2021)_x000D_\n   As of May 2021, Challenger received formal notification for the grant of Ayen and three further exploration license surrounding Hualilan. It also acquired a 90% interest on a package of exploration and mining licenses surrounding the project through a farm-in agreement. (Challenger PR May 11, 2021)_x000D_\n   As of April 2020, Hualilan was comprised of 15 mining leases and 2 mining lease extensions. An application for an exploration license covering 26 sq km was accepted by San Juan Department of mines and was being processed. (Challenger PR Apr 30, 2020)_x000D_\n   As of December 2019, Challenger comprised 15 granted mining licenses and an exploration license application covering 26 sq.km. (Challenger PR Dec 30, 2019)_x000D_\n   In July 1998, Plata expanded its holdings to 10,775 ha from 338 ha.  (NM 7/12/98)_x000D_\n\tThe property includes remnants of about seven past-producing mines, with the deepest workings extending about 90 m from the surface.  (NM 9/1/97) _x000D_\n\tThe area is approximately 1,750 m above sea level and access to the property is on paved and gravel roads.  (Plata CS 2/97)","RESV_ORE_TONNAGE":427500,"MEAS_IND_ORE_TONNAGE":47772500,"MEAS_IND_ORE_TONNAGE_INCL_RESV":48200000,"INF_RESRC_ORE_TONNAGE":12400000,"TOTAL_RESRC_ORE_TONNAGE":60172500,"R_AND_R_ORE_TONNAGE":60600000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Carbonate Replacement (incl Manto), Epithermal Low Sulphidation, Intrusive Related, Skarn (Metasomatic)","ORE_MINERALS":"Bornite, Chalcocite, Chalcopyrite, Galena, Native, Oxide, Pyrite, Sphalerite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Hualilan","DISTANCE_FROM":"100 km NNW of San Juan","LOCATION_COMMENTS":"The property lies within the pre-Cordillerean foothills of the Andes. (La Mancha PR 11/17/03)","ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"Hualilan was reported to be a zinc skarn (containing Zn, Ag and Pb with only minor Cu), overprinted by epithermal to mesothermal low sulphidation gold (Au-Ag). (Challenger PR Nov 8, 2023)_x000D_\n   \tThe property features typical basin and range topography.  It is underlain by a thick, shallow-dipping, Ordovician-to-Silurian-aged sequence of limestone, sandstone, and conglomerate which was intruded by dacite porphyries.  Following the intrusive activity, the rocks were thrust-faulted, creating the north-trending Hualilan fault._x000D_\n\tOn a property scale, the Hualilan fault is cut by high-angle, cross-cutting faults which acted as conduits for gold-bearing hydrothermal fluids.  These faults also served as loci for high-temperature, skarn deposits and for lower-temperature, hydrothermal vein and vein-breccia deposits. (NM 6/26/95)_x000D_\n      At the property, two styles of gold mineralization have been identified: a distal, low temperature hydrothermal regime controlled by faulting and fracture patterns(Cerro Norte); and a high temperature skarn regime (Cerro Sur)._x000D_\n      Au-Ag mineralization at the property have been oxidized to a depth of 50 m, below which the primary mineralization consists of pyrite, Ag-bearing galena, sphalerite, and chalcopyrite.  (NM 9/1/97)","EST_MINE_LIFE_YR":2.8,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_ ur, La Cuna, La Cuna Norte, La Cuna Sur, Norte, Sagitario, Sagitario Sur, Sur","DEV_STAGE":"Target Outline","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"12/2022","MINE_TYPE1":"Underground","MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Gold,Silver","OPERATOR_NAME":"Austral Gold Limited","OPERATOR_COMMON_NAME":"Austral Gold Ltd.","OPERATOR_COUNTRY":"Australia","OPERATOR_MKT_CAP":80.17244148,"OWNER_LIST":"Southern Cone Foundation (Optionor) 50%; Austral Gold Limited (Optionee) 50%","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"Austral Gold Limited","CURRENT_OWNER_COMMON_NAME":"Austral Gold Ltd.","OWNER_TYPE":"Optionee","OWNER_PCT":50,"CURRENT_CONTROLLING_OWN_PCT":50,"OWNER_COUNTRY":"Australia","OWNER_MKT_CAP":80.17244148,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-29.80593,"LONGITUDE":-69.64475,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In April 2023, Austral reported that further drill program was underway at La Cuna Norte and Sagitario. (Austral PR Apr 24, 2023)_x000D_\n   In December 2022, Austral reported that 5,000-m drill program had been started at Jaguelito. (Austral RPT Dec 2, 2022)_x000D_\n   During the September 2022 quarter, Austral started the design of a 5,000-m drill program at Jaguelito. (Austral 9/22 QR Oct 31, 2022)_x000D_\n   In April 2022, Austral announced that field work and surface mapping commenced at Jaguelito. (Austral RPT Apr 28, 2022)_x000D_\nIndustrias Penoles has not reported on this property for two consecutive years. This property is presumed to have been relinquished. (S&P June 2018)_x000D_\n   In November 2007, Minera chose not to continue with the Jaguelito project because it would not be viable. (BNA 11/30/07)_x000D_\n\tIn April 2007, Minera reported results from the completed DD program at Jaguelito. The program comprised 52 holes for a total of 5,762 m which targeted two principle zones, Capote and Alcatraz. An additional 493 m of surface trench sampling was also completed. Highlights of the drilling program included 70 m grading 0.77 g/mt Au and 309.0 g/mt Ag as well as 116 m grading 4.07 g/mt Au and 52 g/mt Ag. (Minera PR 4/30/07)_x000D_\n\tEarlier in April, Minera raised $22.3 million (11.4 million pounds) through a private placement. A portion of the funds were to be used to advance the prefeasibility and feasibility studies of Jaguelito. (Minera PR 4/12/07)_x000D_\n\tBy December 2006, Minera IRL planned to complete the earn-in requirements for a 100% interest in the project from Penoles within the upcoming year by spending $1.4 million and completing a prefeasibility study which was in progress. _x000D_\n\tDuring 2002, Minera IRL acquired the Jaguelito rights for $12 million from Industrias Penoles SA. (MJ 12/1/06) \t_x000D_\n\tDuring 2002, Penoles shut down all activities at Jaguelito.(Penoles 12/02 AR) The project was at an advanced stage of exploration but Penoles considered the deposit too small at the time, on the basis of a resource estimate and scoping study. (MJ 12/1/06)_x000D_\n\tDuring 2000, due to depressed gold prices, Penoles temporarily suspended exploration at Jagüelito in Argentina, and Mezcala and Pinos Altos in Mexico. It continued targeted exploration in Peru, which it said showed high potential. (Penoles 12/00 AR)_x000D_\n\tIn March 2000, Penoles was planning to explore the property, with the aim of increasing resources from an estimated 1 million oz of gold equivalent. (MMLA 3/6/00)_x000D_\n\tIn 1998, Penoles continued exploring the Jagüelito prospect in San Juan province with positive results, identifying interesting values of gold and silver. (Penoles 12/98 AR 3/99)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of April 2023, Jaguelito comprised of eight \"discovery manifestation\" covering a total land area of 11,700 ha. (Austral PR Apr 24, 2023)_x000D_\n   As of February 2022, Jaguelito covered an area of 11,000 ha. Cumbre Verde, Filo, Jose, La Brea, La Majadita, Lirio, Miranda, Nacimiento, Nacimiento 2, Nacimiento1, Portones, Project Constellation, Ranchillos-Rio Blanco, Rio Blanco, Risuko, Sillimanita, Solitario 17, TNR Northern, Vicuna, Vicuna 4","DEV_STAGE":"Feasibility Complete","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"02/2025","MINE_TYPE1":"Open Pit","MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Copper,Gold,Silver","OPERATOR_NAME":"Vicuña Corp.","OPERATOR_COMMON_NAME":"Vicuña Corp.","OPERATOR_COUNTRY":"Argentina","OPERATOR_MKT_CAP":null,"OWNER_LIST":"BHP Group Limited (Venturer) 50%; Lundin Mining Corporation (Venturer) 50%","ROYALTY_HOLDER_LIST":"Metalla Royalty & Streaming Ltd. (NPI) 0%TNR Gold Corp. (NPI) 0%Private Interest (NSR) 0%Filo Corp. (NSR) 0%","OWNER_NAME":"BHP Group Limited","CURRENT_OWNER_COMMON_NAME":"BHP Group Ltd.","OWNER_TYPE":"Venturer","OWNER_PCT":50,"CURRENT_CONTROLLING_OWN_PCT":50,"OWNER_COUNTRY":"Australia","OWNER_MKT_CAP":319931.06088648,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-28.44905,"LONGITUDE":-69.54294,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In June 2026, Lundin reported that Vicuña received approval for inclusion of Josemaria to the Incentive Regime for Large Investments (RIGI) under the Long-Term Strategic Export Projects designation (PEELP) in Argentina. (Lundin PR June 16, 2026)_x000D_\n   In February 2026, Lundin announced the results of an integrated PEA for the Vicuna, which comprises Filo del Sol (#31067) and Josemaria and is held in a 50/50 joint arrangement with BHP. (Lundin PR Feb 16, 2026)_x000D_\n   During the half year ended December 2025, BHP reported an updated mineral resource estimate at Josemaria. (BHP 12/25 IR Feb 17, 2026)_x000D_\n   In December 2025, Lundin expected to complete technical report in March 2026 quarter at Josemaria. (Lundin PR Dec 11, 2025)_x000D_\n   In May 2025, Lundin reported updated mineral resource estimates at Josemaria. (Lundin PR May 4, 2025)_x000D_\n   In January 2025, Lundin reported that an updated mineral resource estimate is targeted for the June half of 2025. (Lundin PR Jan 16, 2025)_x000D_\n   In February 2023, Lundin is advancing detailed engineering and an update of the initial capital cost estimate and project schedule for Josemaria. (Lundin PR Feb 8, 2023)_x000D_\n   In May 2022, Nova announced that construction decision at Josemaria was expected in the second half of 2022. (Nova PR May 24, 2022)_x000D_\n   In late April 2022, TNR announced that Lundin planned to complete an updated technical report at Josemaria in the December 2022 quarter. (TNR PR Apr 28, 2022)_x000D_\n   In April 2022, Josemaria announced that the Mining Authority of San Juan, Argentina approved the Environmental Social Impact Assessment for the Josemaria. The company also reported that securing of additional environmental and sectorial permits was underway. (Josemaria PR Apr 11, 2022)_x000D_\n   In February 2022, Josemaria reported that it started a 65,000-m drill program at Josemaria in the December 2021 quarter with a total of 2,400-m of drilling completed by December 2021. The company also started basic engineering at the project and was expected for completion during the first half of 2022. (Josemaria 12/21 ER Feb 25, 2022)_x000D_\nIn the September 2021 quarter, Josemaria reported that camp expansion activities were ahead of schedule, and drill program was expected to begin in the December 2021 quarter at the Josemaria project. (Josemaria PR Nov 15, 2021)_x000D_\n   In September 2021, Josemaria reported that Environmental Social Impact Assessment (“ESIA”) would be completed in 1H 2022. Also the company was planning to execute 65,000-m drill program and basic engineering with the goal of completion in second quarter of 2022. (Josemaria Resources PR Sept 8, 2021)_x000D_\n   During the March 2020 quarter, Josemaria continued to progress engineering studies, permitting and the negotiation of commercial terms with host governments, in advance of a construction decision at Josemaria. (Josemaria PR May 10, 2021)_x000D_\n   In February 2021, Josemaria Resources completed environmental and social impact assessment (ESIA) at Josemaria. (Josemaria Resources PR Feb 23, 2021)_x000D_\n   In October 2020, Josemaria Resources announced the results of the feasibility study at Josemaria. The study outlined a processing rate of 152,000 mt/d producing 136,000 mt/y Cu, 231,000 oz/y Au and 1,164,000 oz/y Ag over its 19-year minelife. The initial capital cost on the project was estimated at $2.485 billion with a post-tax NPV of $1.53 billion, post-tax IRR of 15.4% at 8% discount rate. (Josemaria PR Oct 19, 2020)_x000D_\n   During the June 2020 quarter, Josemaria continued its environmental and social impact assessment and anticipated the filing of ESIA in the March 2021 quarter. (Josemaria 6/20 QR Aug 12, 2020)_x000D_\n  In February 2020, Josemaria Resources reported that it planned to complete the feasibility study at Josemaria by the September 2020 quarter. (Josemaria PR Feb 21, 2020)_x000D_\n    In June 2019, NGEx announced final assay results from DD program at Josemaría. The Feasibility Study was expected to be completed in 2020. (NGEx PR June 10, 2019)_x000D_\n    In early April 2019, NGEx had completed 6,750-m of reserve definition diamond drill program at Josemaria. Also, the company completed additional field work in support of the planned Feasibility Study which was planned to be completed in 2020. (NGEx PR Apr 1, 2019)_x000D_\n   As of December 2018, NGEx reported a non-material change was made to the capital and operating cost estimates on its previously reported PFS, resulting in minor adjustments to the initial capital cost, sustaining capital cost, capital cost spend profile over the life of mine, and operating costs. (NGEx PR Dec 19, 2018)_x000D_\n    In December 2018, NGEx announced its intention to spin-out the Josemaria project into a stand alone public company. (NGEx PR Dec 12, 2018)_x000D_\n   In November 2018, NGEx reported results of a Pre-Feasibility Study (PFS) for Josemaria. The study considered a conventional open mine with 150,000 mt/d flotation processing to produce an average of 125,000 mt/y Cu, 230,000 oz/y Au and 790,000 oz/y Ag. The NPV(8%) was $2 billion with an IRR 18.6%. Pre-production capital was $2.75 million. A mineral reserve of 1,008 million mt grading 0.29% Cu, 0.21g/mt Au, and 0.92g/mt Ag was estimated. (NGEx PR Nov 20, 2018)_x000D_\n   During the September 2018 quarter, NGEx has commenced PFS to evaluate the potential to develop an open pit mine awith a low strip_x000D_\nratio and a simple flotation processing flow sheet for Josemaría project as a stand-alone project. The PFS is expected to complete by March quarter 2019. (NCEx 9/18 QR Sept 30, 2018)_x000D_\n   In July 2018, NGEx retained SRK Consulting and Ausenco Engineering to complete a PFS for an open pit mine and adjacent processing plant to exploit the Josemaria deposit. The PFS was expected to be finished by the first quarter of 2019.    (NGEx PR July 3, 2018)_x000D_\n   In May 2018, NGEx planned to initiate a pre-feasibility study and was expected to be completed in the first quarter of 2019. (NGEx 03/18 QR May 9, 2018)_x000D_\n   In February 2018, NGEx announced its 2018 development plans, including evaluating a stand-alone development scenario and potentially spinning out Josemaria. (NGEx PR Feb 21, 2018)_x000D_\n   During the June 2017 quarter, NGEx evaluated the leach amenability of the oxide cap at Josemaria through a series of metallurgical tests and studies and explored whether this material was amenable to heap leaching. (NGEx 6/17 QR Aug 10, 2017)_x000D_\n   In August 2016, NGEx announced plans to conduct leach test work on the oxide gold zone at Josemaria, targeted exploration on some earlier stage prospects between Los Helados (#37659) and Josemaria, and continued environmental baseline studies at Constellation (#77019). (NGEx PR Aug 12, 2016)_x000D_\n   In March 2016, an amended Technical Report on the Constellation (#77019) project PEA was submitted. The report was amended to correct minor inconsistencies in the original filing between the footnotes to the Mineral Resource tables between Section 14 and Section 1. There were no other changes to the Mineral Resource statements.     (NGEx TR Mar 31, 2016)_x000D_\n   In February 2016, NGEx released Technical Report on the Preliminary Economic Assessment of the Constellation (#77019) Project which included the Josemaria deposit. The PEA envisaged a 15 year open pit life at Josemaria targeting the highest grade ore first (in the Lirio property), with a plant designed to process 150,000 mt/d of Josemaria feed. (NGEx TR Feb 22, 2016)_x000D_\n   In January 2016, NGEx announced results from a preliminary economic assessment for the integrated operation at Los Helados and Josemaria, or Project Constellation (#77019). The study outlined a sequential open pit and underground operation producing 150,000 mt/d of ore and producing 150,000 mt/y Cu, 180,000 oz/y Au, and 1.18 million oz/y Ag over a 48-year mine life. C1 cash cost for the combined project was estimated at $1.05/lb Cu (net of byproduct credits) and initial capital costs were estimated at $3.08 billion. (NGEx PR Jan 7, 2016)_x000D_\nIn October 2015, NGEx provided an update on its ongoing Preliminary Economic Assessment (PEA) of an integrated Los Helados (profile #37659) and Josemaria operation. The ongoing engineering work program would be used in the PEA of the Integrated Study expected to be completed in early 2016. In addition, NGEx recently completed a review of the exploration potential on the 60,000 ha land package which included Los Helados, Josemaria and Filo del Sol (profile #31067). A surface exploration program was developed and scheduled for January to April 2016. (NGEx PR Oct 13, 2015)_x000D_\n   During the September 2015 quarter, work focused on bringing the deposit into the Integrated Study. Mine planning and initial development of capital and operating costs continued and field work to support the environmental program was carried out. (NGEx PR Nov 13, 2015)_x000D_\n    In August 2015, NGEx completed a second phase of metallurgical test work. A scoping study to evaluate the potential for a combined Los Helados-Josemaria operation was expected to be complete in the first quarter of 2016. (NGEx PR Aug 7, 2015)_x000D_\n   In February 2015, NGEx announced that it was planning to incorporate 2014 drill results into an updated resource estimate. Metallurgical test work was underway and was expecting to be completed during the first quarter 2015. (NGEx 12/14 MD&A Feb 18, 2015)_x000D_\n   As of December 2014, NGEx was considering a scoping level study to evaluate the potential for a combined Los Helados-Josemaria operation. (NGEx 12/14 MD&A Feb 18, 2015)_x000D_\n   During the September 2014 quarter, NGex continued its metallurgical test work and baseline environmental programs at Josemaria. Upon completion of metallurgical test work by 2015 first quarter, an updated resources estimate would follow. No exploration work was carried out during the quarter which coincided with the South American winter. (NGex PR Nov 10, 2014)_x000D_\n   In August 2014, NGEx reported that during the June 2014 quarter, metallurgical test work and baseline environmental programs continued. (NGEx 8/7/14)_x000D_\n   During the June 2014 quarter, final assay results of the 2013/2014 drill program were received and no field work was carried out at Josemaria. Metallurgical test work and baseline environmental programs continued. (NGEx 6/14 QR 8/7/14)_x000D_\n   In late April 2014, NGEx reported final results from its 2013/2014 drill program at Josemaria. A total of 7,302-m were drilled in 14 holes. Results included 88.2 m grading 0.28% Cu, 0.16 g/mt Au, and 0.43 g/mt Ag, and 292.2 m grading 0.31% Cu, 0.18 g/mt Au, and 1.4 g/mt Ag. Metallurgical test work and baseline environmental programs were ongoing. (NGEx PR 4/24/14)_x000D_\n   During the March 2014 quarter, NGEx planned to incorporate drilling results at Josemaria into an updated resources estimate. Metallurgical test work was under way and once completed would allow completion of an updated 43-101 technical report in the December 2014 quarter. Mine engineering studies were on hold while the company focused on activities at Los Helados (NGEx 3/14 ER 5/5/14)_x000D_\n   In February 2014, NGEx reported results from its 14-hole, 7,302-m, 2013/2014 initial drill program at Josemaria. Better results included 434.1 m grading 0.44% Cu, 0.22 g/mt Au, and 0.99 g/mt Ag in hole JMDH80 and 510 m grading 0.35% Cu, 0.2 g/mt Au, and 1.53 g/mt Ag in hole JMDH81. Further drill program results were pending. A conceptual engineering study was under way. (NGEx PR 2/21/14)_x000D_\n   In 2013, NGEx started drilling for the 2013/2014 field season and completed a total of 7,310 m by February 2014. Two geotechnical holes to guide in mine planning studies were also included in the program. (NGEx 12/13 ER 12/31/13)   _x000D_\n   In mid-December 2013, NGEx began DD drilling at Josemaria to test for extensions to the supergene zone at the north end of the deposit. (NGEx PR 12/11/13)_x000D_\n   In October 2013, NGEx reported updated resources at Josemaria. Measured and indicated resources were estimated at 834 million mt grading 0.34% Cu, 0.24 g/mt Au, and 1.09 g/mt Ag; and inferred resources were estimated at 318 million mt grading 0.28% Cu, 0.17 g/mt Au, and 0.92 g/mt Ag. (NGEx PR 10/1/13)_x000D_\n   In July 2013, NGEx announced final results from its 18-hole, 8,242-m drill program at Josemaria. Better results included 249.9 m grading 0.67% Cu, 0.28 g/mt Au, and 1.48 g/mt Ag, including 116 m grading 0.84% Cu, 0.29 g/mt Au, and 1.38 g/mt Ag (hole JMDH69) and  255 m grading 0.61% Cu, 0.20 g/mt Au and 1.32 g/mt Ag, including 136 m grading 0.8% Cu, 0.22 g/mt Au, and 1.11 g/mt Ag (JMDH72). (NGEx PR 7/8/13)_x000D_\n   In late March 2013, NGEx announced initial results from its drill program at Josemaria. Highlights included 230.5 m grading 0.62% Cu and 0.24 g/mt Au, and 160.5 m grading 0.53% Cu and 0.19 g/mt Au. A total of 7,300 m in 14 holes had been completed to date. _x000D_\n   The company expected to complete an updated resource estimate in the September 2013 quarter. (NGEx PR 3/25/13)_x000D_\n   In mid-January 2013, NGEx announced that its $34 million private placement was fully subscribed. A portion of the proceeds would be used to fund a drill program at Josemaria. (NGEx PR 1/15/13)_x000D_\n   In early January 2013, NGEx updated resources at Josemaria. Indicated resources totaled 700 million mt grading 0.35% Cu, and 0.26 g/mt Au, and inferred totaled 332 million mt grading 0.33% Cu, and 0.19 g/mt Au. The company continued drilling, and an initial 5,000-m had been budgeted for a step-out program. (NGEx PR 1/10/13)_x000D_\n\tIn mid-December 2012, NGEx began a drill program at Josemaria with one drill on-site. Drilling would continue through April 2013, and an updated resource estimate for Josemaria was expected in the coming weeks. (NGEx 12/18/12)_x000D_\n\tIn late July 2012, NGEx reported the final assay results from its drill program at Josemaria. Highlights included 481 m grading 0.4% Cu, and 0.27 g/mt Au, and 376 m grading 0.41% Cu, and 0.34 g/mt Au. (NGEx PR 7/30/12)_x000D_\n\tIn mid-July 2012, NGEx announced results from the completed infill drill program at Josemaria. Highlights included 182 m grading 1.06% Cu, 0.31 g/mt Au, including 20 m grading 1.48% Cu, 0.17 g/mt Au; and 452 m grading 0.51% Cu, 0.46 g/mt Au, including 78 m grading 0.89% Cu, 0.56 g/mt Au. Further assays were pending. (NGEx PR 7/16/12)_x000D_\n\tIn late May 2012, NGEx announced additional results from its infill drill program. Highlights included 172 m grading 1.33% Cu, and 0.36 g/mt Au in hole JMDH49; and 552 m grading 0.45% Cu, and 0.43 g/mt Au in hole JMDH25. (NGEx PR 5/23/12)_x000D_\n\tAs of late March 2012, a 39-hole, 19,220-m drill program was completed. Initial assay result highlights included 520 m grading 0.54% Cu, 0.42 g/mt Au in hole JMDH30 and 404 m grading 0.51% Cu, 0.41 g/mt Au in hole JMDH31. (NGEx PR 3/28/12)_x000D_\n\tIn late November 2011, NGEx began the 15,000-m drill program as planned. The program was being conducted by four rigs with an additional four rigs to be added in the coming weeks. The program was to be completed in May 2012. (NGEx PR 11/28/11)_x000D_\n\tIn early November 2011, NGEx reported that a new 15,000-m drill program would begin during the month to upgrade the existing inferred resources to measured and indicated. (NGEx PR 11/10/11)_x000D_\n\tAs of February 2011, a 2,500-m drill program (funded by JOGMEC) was under way at Josemaria targeting extensions and an anomaly north of the deposit. (NGEx PR 2/15/11)_x000D_\n\tIn April 2010, NGEx (formerly Canadian Gold Hunter) announced drill results from a 2,253-m step-out program completed at Josemaria.  Best results included 289.65 m grading 0.3% Cu and 0.188 g/mt Au, 18 m grading 0.49% Cu and 0.262 g/mt Au, and 2 m grading 0.49% Cu and 0.089 g/mt Au. (NGEx PR 4/1/10)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In February 2020, Josemaria Resources assembled an integrated engineering team led by Fluor Canada Ltd., who is responsible for overall project management, infrastructure and mineral process design and project cost estimation. (Josemaria PR Feb 21, 2020)_x000D_\n   In July 2018, NGEx retained SRK Consulting and Ausenco Engineering to complete a PFS for an open pit mine and adjacent processing plant to exploit the Josemaria deposit.   (NGEx PR July 3, 2018)_x000D_\n   In October 2013, Behre Dolbear International completed an updated resource estimate at Josemaria. (NGEx PR 10/1/13)_x000D_\n   In July 2013, ACME Labs prepared and analyzed results at Josemaria. (NGex PR 7/8/13)_x000D_\n   In January 2013, Behre Dolbear & Company, Inc completed a updated resource estimate for Josemaria. (NGEx TR 2/25/13)_x000D_\n   In May 2012, ACME Labs prepared assay results from the infill drill program at Josemaria. (NGEx PR 5/23/12)","START_UP_YR":null,"PROJ_START_UP_YR":2030,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":2100,"DESCRIPTION_CLAIM":"As of year ended December 2023, DPM holds 13 exploitation licenses and 4 exploration licenses. Total holdings cover an area of approximately 33,030 ha. (Lundin 12/23 AR Feb 21, 2024)_x000D_\n   As of November 2020, Josemaria holds eight exploitation licenses (minas) and one exploration license (cateos) covering an area of 16,425 ha. (Josemaria TR Nov 5, 2020)_x000D_\n   As of year ended 2019, Josemaria holds eight exploitation licenses (minas) and two exploration licenses (cateos) covering an area of 16,715 ha. (Josemaria 12/19 AR Feb 21, 2020)_x000D_\n   As of February 2016, there were 2 royalties reported for the Josemaria project:- a 0.5% NSR royalty over certain mineral tenures to the Lirio family and a 7% NPI royalty over the remaining Batidero property tenure. (NGEx TR Feb 22, 2016)_x000D_\n   As of November 2013, the Josemaria property covered 15,099.76 ha. (NGEx TR 11/14/13)_x000D_\n   As at November 2013. Josemaria was subject to royalties as follows: the Lirio group was subject a $2M royalty following the second year of production and a 0.5% NSR (paid over 10 years less costs), paid to the owners. Also a 1%-3% NSR was payable to the Province of San Juan; The Batidero properties were subject to a 7% NPI to TNR. (NGEx TR Nov 13, 2013; TNR 12/13 MD&A Apr 11, 2014)_x000D_\n   As of February 2013, the Josemaria property covered 10,052 ha. (NGEx TR 2/25/13)_x000D_\n   In July 2007, Lundin Mining and Tenke Mining completed a merger.  As part of the business combination, Tenkes Batidero and Vicuna (profile# 111504) properties would be conveyed to a new company, Suramina Resources Inc. (Lundin Mining PR 7/3/07)_x000D_\n   As of June 2007, Suramina was earning a 100% interest in the Josemaria property from TNR, which would be completed in 2009, and held 75% interest in the Batidero property (TNR 25%). (Suramina TR 6/15/07)_x000D_\n   In June 2006, Tenke signed an agreement giving CVRD an option to earn a controlling 52.5% interest in Tenke's holdings in the TNR Northern by funding $7 million of exploration by April 2009. (Tenke PR 6/8/06)_x000D_\n   In June 2004, Tenke optioned the 40,000-ha Northern Properties from TNR Resources and added them to Batidero. (Tenke PR 6/10/04)_x000D_\n   As of June 2002, Batidero covered 49 sq km. (Tenke PR 6/10/02)_x000D_\n   As of March 2010, an unnamed company held a 0.5% NSR and will receive C$2 million within 6 months following the second complete year of mine operation. (NGEx Resources 12/09 FIN Mar 31, 2010)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":1646000000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":1646000000,"INF_RESRC_ORE_TONNAGE":736000000,"TOTAL_RESRC_ORE_TONNAGE":2382000000,"R_AND_R_ORE_TONNAGE":2382000000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Porphyry Deposit","ORE_MINERALS":"Bornite, Chalcocite, Chalcopyrite, Covellite, Enargite, Pyrite, Tennantite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Josemaria","DISTANCE_FROM":"215 km NNW of San José de Jáchal","LOCATION_COMMENTS":"The project is located about 130 km southeast of Copiapo. (NGEx TR Feb 22, 2016)","ROYALTY_TYPE":"Net Profits Interest","ROYALTY_PCT":0.08,"GEOLOGY_COMMENTS":"The Cu–Au mineralization at Josemaría is mostly hosted by a Miocene porphyry system which forms an elongated body with minimum dimensions of 800 to 900 m north–south, 600 to 700 m east–west and 600 to 700 m vertically. A well-developed leached cap overlies the entire Josemaría deposit, and is related to oxidation at and below the modern-day surface. The leached cap ranges from 10–20 m in thickness. Mineral zones within the Josemaría deposit were defined by the relative abundance of chalcopyrite, pyrite and chalcocite, as well as the mode of occurrence of chalcocite (hypogene or supergene) and level of oxidation. Chalcopyrite and pyrite are disseminated through the potassic zone, with minor bornite. Quartz–magnetite ± chalcopyrite veining occurs through much of the main mineralized zone, as discrete veins and locally as a more intense stockwork. The Josemaría deposit remains open to the south, beneath a thickening cover of post-mineral volcanic rocks, and also at depth.    (NGEx TR Mar 31, 2016)_x000D_\n   The simplified geological model for Josemaria consisted of a multiphase porphyry  intrusion of probable Miocene  age emplaced along the north-south trending contact between felsic volcanic rocks and equigranular tonalite, both tentatively assigned to the Permo-Triassic  Choiyoi group. A considerable fault roughly follows this contact, and may be a control on the emplacement of the porphyry intrusives. All of these units were unconformably covered by younger Tertiary  flows. All units, including the Tertiary volcanics, were cut by small, siliceous hydrothermal  breccias . Basement rocks in the deposit are were Paleozoic  granites assigned to the Carnerito Formation ._x000D_\nAlteration associated with the porphyry system included potassic  and chlorite sericite  clay alteration zones containing pyrite  chalcopyrite and chalcopyrite bornite mineralization, as well as advanced argillic, and minor associated sericitic zones accompanied by a high sulfidation assemblage, rich in hypogene chalcocite._x000D_\nMinor oxide  copper mineralization and mixed chalcocite oxide copper  mineralization occurred at shallower levels than the main enrichment zone. Significant gold  occurred within a part of the oxide cap. (NGEx TR 11/14/13)_x000D_\n   The ample regional distribution of volcanics and intrusives of Mesozoic ages are reactive hosts for the calcalkaline intrusivity and volcanics related to Eocene-Miocene (35 to 7 Ma) episodes. _x000D_\n   This type of magmatic-tectonic activity resulted in several Cu-Mo porphyry deposits in the region, with possible overimposed events of mostly gold-related intrusive systems._x000D_\n   Most of the porphyry intrusives are cutting through a thick sequence of upper Mesozoic and Paleogene sediments and volcanics with different evolution in their magmatic fluids in relation to the hosting rocks. This fact, together with the different tectonic relations in typical foreland compressive faulting, evolving to regional back arc transtensive regimes, results in a wide series of porphyry-epithermal transitions and the main resulting mineralization in these transitions comprise sections of volcanics, sediments and volcanic breccias with varied degrees of mineralization, generally where the main episodes correspond with the silicification-sulfide stage. (Tenke PR 6/10/04)","EST_MINE_LIFE_YR":70,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":0,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":0.28,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":4623000,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":0.22,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":1587000,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":0.26,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":6210000,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":0.26,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":6210000,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":0.28,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":4623000,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":0,"CONTAINED_RESV_Ag_oz":0,"GRD_MEAS_IND_Au_gpt":0.19,"GRD_MEAS_IND_Ag_gpt":1.1,"CONTAINED_MEAS_IND_Au_oz":9800000,"CONTAINED_MEAS_IND_Ag_oz":59000000,"GRD_INF_Au_gpt":0.11,"GRD_INF_Ag_gpt":1,"CONTAINED_INF_Au_oz":2600000,"CONTAINED_INF_Ag_oz":23000000,"GRD_TOTAL_RESRC_Au_gpt":0.16,"GRD_TOTAL_RESRC_Ag_gpt":1.07,"CONTAINED_TOTAL_RESRC_Au_oz":12400000,"CONTAINED_TOTAL_RESRC_Ag_oz":82000000,"GRD_R_AND_R_Au_gpt":0.16,"GRD_R_AND_R_Ag_gpt":1.07 e returned 5 m grading 0.0177% U3O8._x000D_\n\tOver the last half of 2010, the company planned to conduct geophysical surveys at Las Marias. (Cauldron 6/10 QR 7/30/10)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of December 2014, Las Marias comprised one granted exploration license (cateo) and 12 cateo applications covering an area of 747 sq km.  (Cauldron 12/14 IR Feb 27, 2015)_x000D_\n   As of June 2012, Las Maria covered 793 sq km and comprised two granted exploration licenses and nine applications. (Cauldron 6/12 QR 7/31/12)_x000D_\n\tAs of March 2012, Las Marias covered 793 sq km. (Cauldron 12/11 HYR 3/6/12)_x000D_\n\tAs of October 2010, Las Marias covered an area of 660 sq km. (Cauldron 6/10 QR 7/30/10)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":null,"DISTANCE_FROM":"35 km N of San José de Jáchal","LOCATION_COMMENTS":null,"ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":null,"EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":null,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":null,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":null,"CONTAINED_MEAS_
