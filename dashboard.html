OVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-28.47488,"LONGITUDE":-69.66439,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In June 2026, Lundin reported that Vicuña received approval for inclusion of Filo del Sol to the Incentive Regime for Large Investments (RIGI) under the Long-Term Strategic Export Projects designation (PEELP) in Argentina. (Lundin PR June 16, 2026)_x000D_\n   In February 2026, Lundin announced the results of an integrated Preliminary Economic Assessment for the Vicuna, which combines the Filo del Sol and Josemaria (#33273). The results of this study have been entered under the Josemaria (#33273). (Lundin PR Feb 16, 2026)_x000D_\n   In January 2026, Lundin reported a planned 50,000-m drill program at Filo del Sol. (Lundin PR Jan 21, 2026)_x000D_\n   During the half year ended December 2025, BHP reported an updated mineral resource estimate at Filo del Sol. (BHP 12/25 IR Feb 17, 2026)_x000D_\n   In December 2025, Lundin expected to complete technical report in March 2026 quarter at Filo del Sol. (Lundin PR Dec 11, 2025)_x000D_\n  In May 2025, Lundin reported an updated mineral resource estimates at Filo del Sol. (Lundin PR May 4, 2025)_x000D_\n   In February 2025, Lundin expected on track for maiden sulphide mineral resource in June 2025 quarter at Vicuna. (Lundin PR Feb 12, 2025)_x000D_\n    In November 2024, Filo reported that it had completed 9,500-m drill program and further drill program is ongoing at Filo de Sol. (Filo PR Nov 21, 2024)_x000D_\n   During the September 2024 quarter, Filo resumed drill program with 1,766m drilled at Filo del Sol. (Filo 9/24 QR Nov 8, 2024)_x000D_\n   In July 2024, Lundin Mining Corporation and BHP have entered into a definitive agreement to jointly acquire 100% of Filo’s issued and outstanding common shares not already owned by Lundin Mining and BHP pursuant to a court-approved plan of_x000D_\narrangement (the “Filo Acquisition”). (Lundin PR July 29, 2024)_x000D_\nAlso In June 2024, Filo reported that drill program is expected to recommence in September 2024 quarter. (Filo 6/24 QR Aug 9, 2024)_x000D_\n  In June 2024, Filo reported that drilling has been suspended for time being due to severe winter weather and will resume as soon as conditions permit. (Filo PR June 10, 2024)_x000D_\n   In April 2024, Filo announced completion of eight-hole drill program and total 14,582-m in March 2024 quarter at Filo del Sol. (Filo PR Apr 22, 2024)_x000D_\n   In March 2024, Filo planned a 40,000-m year round drill program at Filo del Sol. (Filo PR Mar 20, 2024)_x000D_\n   In late January 2024, Filo reported that drilling was ongoing with nine rigs active and till date 38,785-m of drilling was completed in 2023 at Filo del Sol. (Filo PR Jan 25, 2024)_x000D_\n   In July 2023, Filo reported that drilling was ongoing with nine rigs active at Filo del Sol, and winter drilling was focused on Aurora infill and the Aurora-Bonita gap. Three holes were underway at Aurora-Bonita, five holes were working at Aurora and Filo infill, and one rig was completing the last of a series of geotechnical holes to examine a potential future underground exploration adit. (Filo PR July 11, 2023)_x000D_\n   In May 2023, Filo completed MT geophysical survey at Filo del Sol. (Filo PR May 29, 2023)_x000D_\n   In mid April 2023, Filo reported that drilling was ongoing with 9 rigs active on the project and will remain a mix of both large and small step-outs at Filo del Sol. (Filo PR Apr 13, 2023)_x000D_\n   During the March 2023 quarter, Filo completed a 9,152-m drill program at Filo del Sol. (Filo 3/23 MD&A May 10, 2023)_x000D_\n   In March 2023, Filo del Sol hosted mineral resources and reserves estimate of 644.2 million mt, grading 0.32% Cu, 0.32 g/mt Au, and 10.2 g/mt Ag. (Filo PR Mar 17, 2023; TR Feb 28, 2023)_x000D_\nDuring the September 2022 quarter, Filo announced that it incorporated two brand new, state-of-the-art DD rigs at Filo del Sol. (Filo PR Nov 10, 2022)_x000D_\n   In October 2022, Filo reported that six rigs are currently working on site and company planned to add additional rigs into the program as the weather on project moderates. (Filo PR Oct 5, 2022)_x000D_\n   In August 2022, Filo reported that approximately 40,000-m of drill program was planned over the next 12 months at Filo del Sol. (Filo PR Aug 23, 2022)_x000D_\n   In June 2022, Filo planned follow-up drill program at Bonita in the spring 2022. (Filo PR June 9, 2022)_x000D_\n   In May 2022, Filo expanded 2021-2022 drill program to seven drill rigs with additional RC rig ar Filo Del Sol. (Filo PR May 4, 2022)_x000D_\n   In April 2022, Filo recently added RC rig to ongoing drill program at Filo Del Sol. (Filo PR Apr 19, 2022)_x000D_\n   In February 2022, Filo planned to continue drilling at Filo del Sol which will be a combination of step out drilling and resource definition. (Filo PR Feb 28, 2022)_x000D_\n   In January 2022, Filo completed 5,000-m DD program at Filo del Sol. The company plans to add an additional two drill rigs in early February, bringing the total count to seven. (Filo PR Jan 12, 2022)_x000D_\n   During December 2021 quarter, Filo started year 2021/2022 drill program and planned to increase number of drill rigs to 11 by end of March 2022 at Filo del Sol. (Filo 12/31 PR Mar 22, 2022)_x000D_\n   In September 2021, Filo restarted a drill program at Filo del Sol. The company is planning to start-up with three drills and four more rigs are planned to be added during December quarter 2021, with a goal of drilling throughout 2022 with seven rigs. (Filo PR Sept 1, 2021)_x000D_\n   In early August 2021, Filo reported that drill program would be resumed in mid August 2021 at Filo del Sol. (Filo PR  Aug 4, 2021)_x000D_\n   In June 2021, Filo reported results from the completed 15-hole, 11,280-m 2020/2021 field season at Filo del Sol. Drilling will be resumed in August. The company planned to complete a resource update prior to the end of the year. (Filo PR June 15, 2021)_x000D_\n   In May 2021, Filo announced that planning had already begun for next field campaign with field operations to be paused for six to eight weeks after May 2021 at Filo del Sol. (Filo PR May 13, 2021)_x000D_\n   In April 2021, Filo planned to continue the drilling to the end of May 2021 at Filo del Sol. (Filo PR Apr 12, 2021)_x000D_\n   As of late March 2021, Filo completed 8,500-m of core drilling at Filo del Sol where it planned to extend the ongoing program o complete up to 12,000-m of drilling. (Filo PR Mar 31, 2021)_x000D_\n   In March 2021, Filo reported that assay results from the initial set of holes were expected towards the end of this month at Filo del Sol. (Filo PR Mar 18, 2021) _x000D_\n   In November 2020. Filo announced that the 2020/2021 field season was underway at Filo del Sol. The drill program is planned to continue until late April and is targeting the completion of 8,000 m of DD. (Filo PR Nov 17, 2020)_x000D_\n   In October 2020, Filo announced that it was mobilizing crews and equipment to Filo del Sol, and remained on track to begin the planned 8,000-m DD program in early November. (Filo PR Oct 23, 2020)_x000D_\n   In July 2020, Filo planned a DD program at Filo del Sol, scheduled to start in November 2020 and was expected to be completed in April 2021. (Filo PR July 22, 2020)_x000D_\n   In May 2020, Filo announced final results from the recently completed 2019/2020 drill program at Filo del Sol. (Filo PR May 20, 2020)_x000D_\n   In March 2020, Filo reported that field program was being reduced with demobilization of personnel and equipment currently underway due to COVID-19 pandemic at Filo del Sol. (Filo March 19, 2020)_x000D_\n   In January 2020, Filo reported initial assay results from the drill program at Filo del Sol. (Filo PR Jan 6, 2020)_x000D_\n   In November 2019, Filo started 10,000-m drill program at Filo del Sol. Also company would begin drone magnetometer survey in early January 2020 at Filo del Sol. (Filo Mining PR Nov 13, 2019)_x000D_\n   During the September 2019 quarter, Filo reported that over 10,000-m DD program was planned at Filo del Sol. The field campaign would run from November 2019 to about March 2020. (Filo 9/19 QR Nov 7, 2019)_x000D_\n   In August 2019, Filo Mining was planning a 15,000-m DD program and a 3D IP geophysical survey at Filo del Sol starting off in early November 2019. (Filo Mining PR Aug 8, 2019)_x000D_\n   In May 2019, Filo Mining reported final assay results from the 2019 drill program at Filo del Sol. (Filo PR May 28, 2019)_x000D_\n   In April 2019, Filo Mining announced that the seven-hole 2018/2019 drill program at Filo del Sol had been completed. (Filo PR Apr 5, 2019)_x000D_\n   In March 2019, Filo Mining announced the results of the first two diamond drill holes from the 2019 drill program three holes totaling 2,184 m have been completed to date, with an additional four holes in progress.  The drill program was scheduled to be completed by the end of March. (Filo PR Mar 18, 2019)_x000D_\n   In January 2019, Filo announced the results of its PFS for its Filo del Sol project. Updated reserves of 259.1 million mt grading 0.39% Cu, 0.33 g/mt Au, and 15.1 g/mt Ag was based on an open pit design. Average annual production of 67,000 mt Cu, 159,000 oz Au and 8.653 million oz Ag was expected over a 14-year LOM. Total initial capital costs were $1,266 million and LOM Sustaining Capital at $217 million. (Filo PR Jan 14, 2018)_x000D_\n   As of June 2018, Filo reported completion of extensive field and 9,411-m and 31 RC drill holes drill program at the Filo del Sol project. (Filo Mining 06/18 Jun 30, 2018) _x000D_\n    During the June 2018 quarter, Filo Mining conducted an extensive field program at Filo del Sol including 9,411-m RC drilling to support PFS which was expected to be completed during the first quarter of 2019. Also, metallurgical test results was expected in third quarter of 2018. (FiloMining 6/18 QR Aug 9, 2018)_x000D_\n   In June 11 2018, Filo reported updated resources for Filo del Sol. Cut off grades of 0.2 g/mt Au, 0.15% CuEq , 20 g/mt Ag and 0.3 % CuEq were used for Gold Oxide, Copper Gold Oxide, Silver and Sulphide mineralization zone respectively. (Filo PR Aug 08, 2018; TR Feb 2, 2019)_x000D_\n   In May 2018, Filo announced final assay results from the recently completed 2017/18 drill program at Filo del Sol. (Filo PR May 31, 2018)_x000D_\n  In May 2018, Filo reported that the main goals of the 2017/18 drill program was to convert a part of the inferred oxide mineral resource to the indicated category and 9 holes were drilled into the Filo zone of the deposit and were expected to either convert existing inferred material to indicated or add to the mineral resource. (Filo PR May 16, 2018)_x000D_\n   In April 2018, Filo announced results from its recently completed 9,411-m, 31 RC holes and nine DD holes 2017/18 drill program at Filo del Sol. (Filo PR Apr 27, 2018)_x000D_\n   In March 2018, Filo reported that the PFS at Filo del Sol was targeted for completion by the March 2019 quarter. (Filo 12/17 AR Mar 20, 2018)_x000D_\n   In February 2018, Filo anticipated to complete Phase II work program, including about 10,000-m of RC and DD drill programs, to the end of August 2018 for the completion of a Pre-Feasibility Study (PFS) targeted this year at Filo del Sol. (Filo PROS Feb 22, 2018)_x000D_\n   In December 2017, Filo released an NI43-101 compliant Technical Report for the Preliminary Economic Assessment on the Filo del Sol project. (Filo TR Dec 18, 2017)_x000D_\n   In November 2017, Filo released results of a Preliminary Economic Assessment for the Filo del Sol. The study considered open pit mining of oxide ore with heap leach processing (nominal 50,000 mt/d) producing an average of 50,000 mt/y Cu, 115,000 oz/y Au and about 5 million oz/y Ag as copper cathode and dore over a 13-year mine life. Economic analysis gave a pre-tax NPV (8%) of $1,163 million, IRR 28.7% and initial capex of $792 million. Filo will move forward with a Pre-Feasibility Study. (Filo Mining PR Nov 28, 2017)_x000D_\n   As of November 2017, Filo Mining reported that the PEA of Filo del Sol was substantially completed with results to be released shortly. (Filo Mining PR Nov 28, 2017)_x000D_\n   In October 2017, an independent NI 43-101 Technical Report was released to disclose the results of an updated mineral resource estimate which incorporated new data collected during the 2016/17 field season, and the results of an ongoing program of metallurgical test work that indicates at least part of the mineralization is amenable to heap leach processing. Resources totaled 1.9 million mt Cu, 6.5 million oz Au and 170 million oz Ag. Completion of a PEA was recommended.     (Filo Mining TR Oct 4, 2017)_x000D_\n   In September 2017, Filo reported results from the ongoing metallurgical test work program on oxide mineralization from the Filo del Sol project. A comprehensive program had been under way throughout 2017 based on samples collected during the 2017 field program, including four bulk samples collected from surface exposures of the deposit. The objective of the program was to confirm the previously reported bottle roll leach results under column leaching conditions, and determine optimum processing options for the project. The company planned to collect additional metallurgical samples during the 2017/2018 field season for variability column testing. (Filo PR Sept 25, 2017)_x000D_\n   In September 2017, Filo Mining planned to begin a preliminary economic assessment (PEA) at Filo del Sol which was expected to be completed in Q1 2018. (Filo Mining PR Sept 19, 2017)_x000D_\n   During the June 2017 quarter, Filo Mining reported was focused on the interpretation of data from the 2016 and 2017 field program, which focused on infill and step out drilling on the Filo del Sol deposit. The complete assay results of the program were received during the June 2017 quarter. The company expected to complete the updated resource estimate for the project in September 2017 quarter. (Filo Mining PR Aug 21, 2017) _x000D_\n   In August 2017, Filo Mining reported a 61% increase in overall resource tonnes with the resource now divided into four zones based on metallurgical characteristics. Metallurgical test work completed to date indicates that the oxide zones are amenable to heap leach processing and that the silver zone could either be leached or processed by flotation to produce a silver-rich concentrate. To date only 3 km of the approximately 7 km long strike length of the Filo alteration zone has been drill tested and the resource remains open at depth.    (Filo Mining PR Aug 21, 2017) _x000D_\n   In August 2017, Filo Mining reported that the company was currently conducting an extensive program of metallurgical test work to follow up on the encouraging initial results received in October 2016. The company planed to complete column leach tests which would provide information on the optimum fragment size for leaching and more information needed for a preliminary internal conceptual study of development options. This internal study would allow the company to decide whether to initiate a formal PEA of the Filo del Sol project. (Filo Mining PR Aug 17, 2017) _x000D_\n   During the June 2017 quarter, Filo received the remainder assay results from its 8,616-m, 41-hole drill program at Filo del Sol. In addition, the company was expecting for the results of the phase two metallurgical test work which would be the basis of the preliminary internal scoping study and PEA. If PEA was initiated, a technical report was expected to be completed in Q1 2018. (Filo PR Aug 11, 2017)_x000D_\n   In May 2017, Filo announced results of the 14 holes from the recently completed 41 hole drill program at the Filo del Sol project. ( Filo PR May 17, 2017)_x000D_\n   In May 2017, Filo reported that metallurgical test work continued which would be included in an updated resources estimate and internal study which were expected to be completed by 2017 third quarter. Decision to initiate a formal PEA was still pending. (Filo PR May 11, 2017)_x000D_\n   In April 2017, Filo completed its 8,616-m of drilling at Filo. (Filo PR April 10, 2017)_x000D_\n   In mid-February 2017, Filo announced the drill results from its recently completed 3,830 m, 20-hole drill program at Filo del Sol. (Filo PR Feb 15, 2017)_x000D_\n   In January 2017, Filo’s drill program in the Filo del Sol project was underway. A third RC drill rig was expected to be added in late January 2017 and the drilling would continue until the end of March 2017. (Filo PR Jan 20, 2017)_x000D_\n   During the December 2016 quarter, Filo announced that its focus for the first quarter of 2017 would be the completion of a comprehensive field program, designed to collect data for initial engineering studies. Upon receipt of the complete results, the company planned to update the mineral resource estimate for the Filo de Sol project. (Filo PR Mar 28, 2017)_x000D_\n   As of the September 2016 quarter, Filo planned to continue metallurgical test work while advancing through an 8,000-m drill program. Drilling was scheduled to begin in early December 2016 and upon completion of the drill program, the company would update the resource. (Filo PR Nov 28, 2016)_x000D_\n   In November 2016, Filo closed its C$20 million private placement. Part of the proceeds will be used towards ongoing work programs in Chile and Argentina. (Filo PR Nov 16, 2016)_x000D_\n   In October 2016, Filo announced positive results from an initial program of metallurgical test work on oxide mineralization from the Filo del Sol deposit. Also, Bottle-roll tests were completed on RC drill cuttings of three separate types of mineralization. Using sequential leach test, the recoveries were 94% Cu and and 87% Au from CuOx zone. Using cyanide leach , recovery was 93.2% Cu from AuOx zone, Using Leach kinetics, the recovery was excellent about 95% Cu from CuOx zone and Using cyanide leach, the recoveries were 92.7%, 88.6% and 92.4%. (Filo PR October 11, 2016)_x000D_\n   In September 2016, Filo Mining announced that the immediate focus at the Filo del Sol project will be directed towards evaluating the potential to develop the project as a low cost, heap leach operation. A preliminary leach metallurgical program was completed earlier this year on samples of oxidized material with results expected shortly. Heap leaching is a widely used processing method for recovering metals from oxidized mineralization and typically involves lower capital and operating costs than the flotation process that is used for sulfide material. (Filo Mining PR Sept 19, 2016)_x000D_\n   In mid-August 2016, NGEx announced the spin-out of the Filo del Sol property into its wholly-owned subsidiary, Filo Mining, was completed._x000D_\nThe Company applied for a listing of the shares of Filo Mining on the TSX Venture Exchange (\"TSX-V\") and Nasdaq First North Exchange under the trading symbol \"FIL\". (NGEx PR Aug 16, 2016)_x000D_\n   Also in August 2016, NGEx announced that under the plan of arrangement to spin-out Filo del Sol, the company would be transferring C$3 million in cash to Filo Mining which would be used to conduct exploration program at Filo del Sol. Also, the company expected that the arrangement and the listing of shares of Filo Mining was expected to be complete in the third quarter 2016. (NGEx PR Aug 12, 2016)_x000D_\n   On August 11, 2016, NGEx shareholders and option holders approved the proposed spin-out of the Filo del Sol property into its wholly owned subsidiary, Filo Mining Corp. The spin-out transaction is expected to become effective on or about August 16, 2016. (NGEx PR Aug 11, 2016)_x000D_\n   In July 2016, NGEx had filed a Notice of Special Meeting for proposed spin-out of Filo del Sol. Upon completion of the arrangement, Filo Mining will hold a 100% interest in Filo del Sol. (NGEx PR July 13, 2016)_x000D_\n   In June 2016, an update to the December 2015 Technical Report was released readdressed to Filo Mining in connection with the proposed Plan of Arrangement whereby Filo will acquire from NGEx 100% of the Filo del Sol project in exchange for a share distribution to NGEx shareholders. The August 2015 effective mineral resource was not updated in this report as no new drilling has been completed on the project, however, it does incorporate the results of a surface exploration campaign carried out during the 2015/16 field season.    (NGEx TR June 10, 2016)_x000D_\n   Also in June 2016, NGEx announced that it would spin out its Filo del Sol property into a wholly owned subsidiary named, Filo Mining. NGEx would apply for a listing of the shares of Filo Mining on TSX-V. (NGEx PR June 13, 2016)_x000D_\n   In 2015, NGEx announced an updated mineral resource estimate for Filo del Sol copper-gold-silver deposit. The updated mineral resource estimate replaced the initial resource estimate released on December 2, 2014, and incorporates data from 24 additional step-out and infill holes from the 2014/2015 drilling program. The results show a significant increase in the size of the resource. Above a 0.3% CuEq cutoff, contained copper has increased by 42%, contained gold has increased by 39% and contained silver has increased by 71%. (NGEx 12/15 AR Dec 31, 2015)_x000D_   In December 2015, an independent NI 43-101 compliant Technical Report was released in support of the August 2015 resource estimation for the Filo del Sol project. This report updated and replaced the initial November 2014 resource estimate for the project.   (NGEx TR Dec 11, 2015)_x000D_\n   In late November 2015, NGEx reported an updated NI 43-101-compliant resources estimate at Filo del Sol. Inferred resources totaled 381 million mt grading 0.39% Cu, 0.33 g/mt Au, and 12.2 g/mt Ag. (NGEx PR Nov 23, 2015)_x000D_\n   In October 2015, NGEx recently completed a review of the exploration potential on the 60,000 ha land package which included Los Helados (profile #37659), Josemaria (profile #33273) and Filo del Sol. A surface exploration program was developed and scheduled for January to April 2016. In addition, NGEx would complete an updated mineral resource estimate for Filo del Sol by Q4 2015. (NGEx PR Oct 13, 2015)_x000D_\n   In mid-April 2015, NGEx announced results from the final fourteen RC holes of its 23-hole, 7,060-m drill program at Filo. Highlights included 318 m grading 0.28 g/mt Au and 0.28% Cu including 82 m grading 0.38 g/mt Au in hole RCVI-21; 265 m grading 0.33 g/mt Au including 10 m grading 0.65 g/mt Au in hole VRC88; and 109 m grading 0.56 g/mt Au including 40 m grading 1.13 g/mt Au in hole VRC89. (NGEX PR Apr 16, 2015)_x000D_\n   In mid-February 2015, NGEx reported results from ongoing drill program at Filo del Sol. Highlights included 122 m grading 0.47 g/mt Au, 0.03% Cu, and 7 g/mt Ag, including 10 m grading 0.17 g/mt Au, 3.41% Cu, and 2 g/mt Ag in hole VRC85; and 8 m grading 0.93 g/mt Au, 0.42% Cu, and 7 g/mt Ag, including 68 m grading 0.34 g/mt Au, 0.43% Cu, and 338.8 g/mt Ag in hole VRC86. Further drilling continued. (NGEx PR Feb 19, 2015)_x000D_\n   In December 2014, NGEx announced an initial NI 43-101-compliant resources estimate for Filo del Sol. At a cutoff of 0.30% CuEq, total inferred resources were at 280.5 million mt grading 0.38% Cu, 0.32 g/mt Au, 9.7 g/mt Ag and 0.005% Mo. In addition, an induced polarization (IP) survey was under way and would be used to guide the drilling outside the drilling area. (NGEx PR Dec 2, 2014)_x000D_\n   In December 2014, NGEx released the results of a technical report (mineral resources) completed on Filo del Sol, which reported initial NI 43-101 compliant mineral resources estimates. (NGEX TR Dec 19, 2014)_x000D_\n   In October 2014, NGEx entered into definitive agreement to acquire the 40% interest in Filo del Sol held by its partner Pan Pacific Copper for a cash consideration of $7 million, which was payable in two instalments. _x000D_\nAlso, a RC exploration program totaling 6,000 m was planned to start in early 2015. (NGEx PR 10/23/14)_x000D_\n   In the June 2014 quarter, final assay results of the 2013/2014 drill program were received and no field work was carried out at Filo del Sol. (NGEx 6/14 QR 8/7/14)_x000D_\n   Subsequent to the March 2014 quarter, NGEx received all the results for the 2013/2014 drilling program and planned to begin work on an initial resource estimate for Filo del Sol, with expected completion in the December 2014 quarter. (NGEx 3/14 ER 5/5/14)_x000D_\n   On April 30, 2014, NGEx announced results from the final nine holes drilled at Filo del Sol. Better grades included 10 m grading 7.59% Cu and 12 m grading 314.5 g/mt Ag. An initial resource estimate of the project was expected to be completed in the fourth quarter of 2014 (NGEx PR 8/7/14)_x000D_\n   In early April 2014, NGEx announced results of ten additional holes from the 2014 drilling program at Filo del Sol. Highlights included 12 m grading 907 g/mt Ag from hole VRC72, 6 m grading 12.41 g/mt Au and 22 m grading 5.8% Cu from hole VRC70, 12 m grading 663 g/mt Ag from hole VRC63, and 20 m grading 2.11% Cu from hole VRC66. Additional assays were pending. The company intended to start work on an initial resource once complete drill results are received. (NGEx PR 4/10/2014)_x000D_\n   As of December 2013, NGEx completed its 2013/14 exploration program at Filo Del Sol. Additional assays were pending. The company planned to begin an initial resource estimate for the property once results were received. (NGEx 12/13 AR 3/28/14)_x000D_\nIn May 2013, NGEx Resources reported complete results from its 2012-2013 exploration program at the Filo del Sol system at Vicuna. Highlights included 38.1 m grading 1.23% Cu, 0.21 g/mt Au, and 10.9 g/mt Ag in hole FSDH08, 101.8 m grading 0.23% Cu, 0.18 g/mt Au, and 2 g/mt Ag in hole FSDH09A, and 65 m grading 0.03% Cu, 0.77 g/mt Au, and 0.91 g/mt Ag in hole FSDH11. The 2013-2014 drill program was expected to begin in late 2013. (NGEx PR 5/23/13)      \t_x000D_\n\tIn January 2013, NGEx announced a private placement to raise up to $34.6 million (C$34 million), with a portion of the proceeds to be used for ongoing work at Vicuna. (NGEx PR 1/14/13; NGEx PR 1/15/13)_x000D_\n\tIn mid-December 2012, NGEx began drilling at Filo del Sol with one rig. (NGEx PR 12/18/12)_x000D_\n\tIn September 2012, JOGMEC exercised its right under the Vicuna joint exploration agreement with NGEx Resources to transfer its 40% interest in the Vicuna copper-gold-silver JV to Pan Pacific Copper. The Vicuna JV includes the Filo del Sol project in Argentina and the Los Helados project (profile #119532) in Chile. NGEx will remain as the operator of the projects with a 60% interest. Pan Pacific Copper holds a 75% interest in the preproduction-stage Caserones copper-molybdenum project (profile #109115), located about 10 km north of Los Helados, and expected to begin production in 2013. (NGEx Resources PR 9/10/12)_x000D_\n\tIn August 2012, NGEx Resources announced final results from the 2012 exploration program at Filo del Sol. Hole FSDH06 intercepted 384.9 m grading 0.41% Cu and 0.39 g/mt Au from surface, and hole FSDH07 intercepted 42.5 m grading 0.98% Cu and 0.19 g/mt Au from 4 m. The 2012 program consisted of six DD holes for 2,048 m. (NGEx Resources PR 8/7/12)_x000D_\n\tIn June 2012, NGEx reported results from deep drilling on the Filo del Sol deposit at Vicuna, with hole FSDH-05 returning 488.6 m grading 0.34% Cu, 0.25 g/mt Au, and 1.9 g/mt Ag from 12 m and hole FSDH-02 returning 222.5 m grading 0.46% Cu, 0.5 g/mt Au, and 73.7 g/mt Ag from 216 m. (NGEx PR 6/19/12)_x000D_\n\tAs of the September 2008 quarter, further drilling in early 2009 was planned at Los Helados, including deeper drilling to test the system at depth. (Suramina 9/08 QR 11/10/08)_x000D_\n\tIn September 2008, Suramina reported results from the first two holes testing the Los Helados porphyry target.  Hole DDH-LH 01 intercepted 530.45 m grading 0.46% Cu and 0.31 g/mt Au from surface, including 73 m grading 0.52% Cu and 0.6 g/mt Au from 70 m, and hole DDH-LH 02 intercepted 506.45 m grading 0.32% Cu and 0.19 g/mt Au from surface, including 128 m grading 0.48% Cu and 0.21 g/mt Au from 324 m.  Los Helados is the most recent target discovered, and is one of a cluster of 12 porphyry targets identified to date at Vicuna. (Suramina PR 9/30/08)_x000D_\n\tIn April 2008, Suramina Resources reported results from a ten-hole, 2,884-m RC drill program at the Filo Del Sol prospect.  Better results included 36 m grading 0.95% Cu, 0.55 g/mt Au, and 39.3 g/mt Ag from 8 m and 64 m grading 0.24% Cu and 0.39 g/mt Au from 186 m in hole VCR 46;  56 m grading 0.49% Cu, 0.5 g/mt Au, and 100.7 g/mt Ag from 84 m in hole VCR 47; and 40 m grading 0.5% Cu, 0.4 g/mt Au, and 105 g/mt Ag from 200 m in hole VCR 48.  The drilling focused on a zone of outcropping soluble copper-gold oxides flanking a diatreme breccia centre.  Previous drilling and results from the current program indicated a near-surface mineralized zone encompassing at least 0.3 x 0.5 km with a possible extension of 1.5 km to the north-northeast. (Suramina PR 4/1/08)_x000D_\n\tIn July 2007, Lundin Mining and Tenke Mining completed a merger.  As part of the business combination, Tenkes Batidero (profile# 114554) and Vicuna properties would be conveyed to a new company, Suramina Resources Inc. (Lundin Mining PR 7/3/07)_x000D_\n\tAs of December 2006, JOGMEC had a 40% option on the Vicuna project. (BNA 12/12/06)_x000D_\n\tIn January 2006, Argentina and Chile signed accords to facilitate investment in mining exploration on their shared border, benefiting Vicuna in Argentina's San Juan and La Rioja provinces and Chile's north-central third region. (Reuters 1/6/06)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In  November 2017, Filo reported that the following contractors have worked on the project: - Mineralogical Services and HydroProc Consultants on metallurgy;  Merlin Geosciences on geology;  MB Asesoria Ambiental and BGC Engineering on environmental studies; Comprobe Limitada; . (Filo Mining PR Nov 28, 2017; TR Dec 18, 2017)_x000D_\n   During 2005, Nilsson Mine Services Ltd in conjunction with Geosystems International completed an NI 43- 101 resource estimate for Josemaria. (Tenke 12/05 AR 3/29/06)_x000D_\n   In 2001, Novatec S.A. of Santiago, Chile completed a preliminary test program at Filo del Sol, comprising bottle roll and sequential leach tests. (NGEX TR Dec 19, 2014)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of June 2025, Filo Del Sol consisted of eight exploitatio concessions covering area of 9,226.19 ha. (Lundin TR June 16, 2025)_x000D_\n   As of December 2024, Filo del Sol covered an area of 12,370 ha. (Lundin 12/24 AR Feb 19, 2025)_x000D_\n   As of February 2023, Filo reported that the total area of the combined area at the Filo del Sol project was about 13,575 ha. (Filo TR Feb 28, 2023)_x000D_\n   As of January 2018, Filo agreed to sell its 100% interest in the Vicuna 3, Vicuna 4, Nacimiento 1 and Nacimiento 2 mining concessions, and Cateo 182.269-L-91, Cateo 338.723-G-92, Cateo 1124.033-F-17 and Cateo 1124.034-F-17 mining concessions to NGEx Resources Inc. (Filo PR Feb 9, 2018) The sale was completed on February 21, 2018.  (Filo 3/18 MD&A May 10, 2018)_x000D_\n   As of December 2017, Filo reported that the total area of the combined properties is 17,666 ha. (Filo TR Dec 18, 2017)_x000D_\n   As of June 2016, the property covered roughly 16,616 ha, comprising four exploration permits and 12 exploitation permits in Argentina, and 16 exploration concessions, two exploitation mining concessions and one option agreement for 17 mining licenses in Chile. (NGEX TR June 10, 2016)_x000D_\n   As of December 2014, the property covered roughly 16,160 ha, comprising four exploration permits and 12 exploitation permits in Argentina, and 16 exploration concessions and one option agreement for 17 mining licenses in Chile. (NGEX TR Dec 19, 2014)_x000D_\n   In September 2012, NGex fulfilled the last option payment and earned, subject to a 1% NSR, a 100% interest in the La Chola property, comprising the Chola 1, Potro I,II and III claiims. (NGEx 12/14 AIF Mar 17, 2015)_x000D_\n   In September 2003, Tenke acquired a group of concessions known as the Lirio properties, located adjacent to the Batidero (profile#114554) and Vicuna projects. Tenke had a six-year option to obtain a 100% interest in Lirio. Principal terms of the earn-in agreement between Tenke's Argentine wholly owned subsidiary Depromin SA and the current underlying property holders included an up-front payment of $23,000 and staged payments totaling $790,000 between 2003 and 2009. If a mine were put into production, the underlying property holder would also receive a 0.5 % NSR and a further $2 million within six months following the second complete year of mine operations.  (Tenke PR 9/4/03)_x000D_\n\tIn 2000, the Vicuna project comprised the Vicuna, Yamirir, and Lirio concessions (GCNL 1/6/00), and covered 26,400 ha. (Tenke PR 6/27/00)_x000D_\n\tThe Filo del Sol target was approximately 500 m in diameter. The Co Vicuna zone encompassed an area of 1.6 sq km. The North anomaly measured 4 km north-south by 1.5 to 2 km in width. The Marancelas target was approximately 2 sq km. (Tenke PR 2/3/00)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":1991000000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":1991000000,"INF_RESRC_ORE_TONNAGE":7156000000,"TOTAL_RESRC_ORE_TONNAGE":9147000000,"R_AND_R_ORE_TONNAGE":9147000000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Epithermal High Sulphidation, Porphyry Deposit","ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Vicuna","DISTANCE_FROM":"215 km NNW of San José de Jáchal","LOCATION_COMMENTS":"Vicuna straddles the Argentine/Chilean border as the project is located in Argentina's San Juan and La Rioja provinces and Chile's north-central third region. (Reuters 1/6/06)_x000D_\n\tVicuna is located 75 km north of Homestake's Veladero and Barrick's Pascua deposits in a region between the Maricunga and El Indio gold belts. (Tenke PR 11/4/99)","ROYALTY_TYPE":"Net Smelter Return","ROYALTY_PCT":0.5,"GEOLOGY_COMMENTS":"The Josemaria/Vicuna area exhibited potential for porphyry Au-Cu systems with neighbouring potential for sulphidation veins. Mz and Tc sequences with widespread intrusives along NNE fracture corridors have been mapped. WNW lineaments offsett alteration and vertical continuity. (Tenke PR 10/20/03)_x000D_\n\tThe property is characterized by strong silicification, combined with a diatreme geological setting, extensive breccias, and a high-sulfidation alteration assemblage. _x000D_\n\tA series of northwesterly and north-northwesterly trending structures exist in a caldera setting within a Miocene dacite volcanic complex. A large hydrothermal system with a high-sulphidation alteration assemblage has been traced for over 20 km in a north-northeasterly direction. The system is 1 to 2.5 km wide. (NM 11/29/99)","EST_MINE_LIFE_YR":13,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":0,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":0.411,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":8194000,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":0.327,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":23552000,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":0.347,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":31746000,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":0.347,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":31746000,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":0.411,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":8194000,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":0,"CONTAINED_RESV_Ag_oz":0,"GRD_MEAS_IND_Au_gpt":0.35,"GRD_MEAS_IND_Ag_gpt":9.364,"CONTAINED_MEAS_IND_Au_oz":22300000,"CONTAINED_MEAS_IND_Ag_oz":600000000,"GRD_INF_Au_gpt":0.201,"GRD_INF_Ag_gpt":3.388,"CONTAINED_INF_Au_oz":46100000,"CONTAINED_INF_Ag_oz":785000000,"GRD_TOTAL_RESRC_Au_gpt":0.233,"GRD_TOTAL_RESRC_Ag_gpt":4.686,"CONTAINED_TOTAL_RESRC_Au_oz":68400000,"CONTAINED_TOTAL_RESRC_Ag_oz":1385000000,"GRD_R_AND_R_Au_gpt":0.233,"GRD_R_AND_R_Ag_gpt":4.686,"CONTAINED_R_AND_R_Au_oz":68400000,"CONTAINED_R_AND_R_Ag_oz":1385000000},{"PROP_NAME":"Filo Sur","PROP_ID":31971,"PRIMARY_COMMODITY":"Copper","ALSO_KNOWN_AS":"Filo Central, Filo Este, Mogote, North Ridge, South Ridge, Stockwork Hill, Zona Colorida","DEV_STAGE":"Target Outline","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"03/2025","MINE_TYPE1":null,"MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Copper,Gold,Molybdenum","OPERATOR_NAME":"Mogotes Metals Inc.","OPERATOR_COMMON_NAME":"Mogotes Metals Inc.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":334.98451264,"OWNER_LIST":"Golden Arrow Resources Corporation (Optionor) %; Mogotes Metals Inc. (Optionee) 100%","ROYALTY_HOLDER_LIST":"Unnamed Vendor (NSR) 0%Unnamed Owner (NSR) 1%","OWNER_NAME":"Mogotes Metals Inc.","CURRENT_OWNER_COMMON_NAME":"Mogotes Metals Inc.","OWNER_TYPE":"Optionee","OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":334.98451264,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-28.54279,"LONGITUDE":-69.63695,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In June 2021, Golden Arrow has completed 12,000-m of drilling at Mogote project. (Golden Arrow FS June 30, 2021)_x000D_\n   In October 2014, Golden arrow reported that it held a 100% interest in the Mogote property. (Golden Arrow Fact Sheet 10/16/14)_x000D_\nOn July 24, 2013, Golden Arrow announced that Vale provided notice of its decision to terminate the option agreement on the Mogote project. The Company is currently seeking new joint venture partners for the project. (Golden Arrow 9/16 QR Nov 29, 2016)_x000D_\n   On January 14, 2013, Golden Arrow announced that Vale commenced a 10-hole, 7,500 m drill program at Mogote. The drill program targeted both porphyry copper-gold and precious metal epithermal mineralized zones identified during the 2011-12 field program, specifically the 3 holes in Filo Este, 3 holes in Filo Central, 2 holes in Zona Colorida and 2 holes in Stockwork hill. (Golden Arrow 9/16 QR Nov 29, 2016)_x000D_\n   In 2012, Vale completed a 7 hole, 3,695 m drill program at Mogote. Vale's drilling confirmed the existence of a copper porphyry system below the large and prominent steam leached alteration zone at the Zona Colorida. (Golden Arrow 9/16 QR Nov 29, 2016)_x000D_\n   In September 2010, Golden Arrow entered an option agreement with Vale regarding Mogote.  Under the terms of the agreement, Vale could earn an initial 70% interest in the project by spending $6.8 million on exploration and paying $2.3 million in cash to Golden Arrow over three years.  Vale could increase its interest to 85% by funding and delivering a feasibility study within another three years.  (Golden Arrow PR 9/9/10)_x000D_\n\tIn March 2005, a recently completed phase II 2,577 m 9-hole RC drill program at Mogote was completed.  Of the nine holes, four were found to contain Au-Cu mineralization hosted in porphyry or in metamorphosed volcanic sediments at the margin of porphyry. _x000D_\n\tBetter results included 250 m grading 0.083% Cu and 0.22 g/mt Au including 70 m grading 0.158% Cu and 0.158 g/mt Au. (Amera PR 3/29/05)_x000D_\n\tIn January 2005, Amera mobilized an exploration crew to Mogote. The crew will be continuing with detailed geological mapping to refine drill pad locations on the Filo Central and Filo Este target, where four holes drilled in March 2004 intersected  copper-gold mineralization.  Bulldozer trenching was being carried out on the Filo Central target concurrently with road building to construct access into the target area to facilitate drilling.  (Amera PR 1/14/05)_x000D_\n\tIn July 2004, IMA Exploration, a member of the Vancouver-based Grosso Group, completed an asset restructuring in which IMA retained its flagship Navidad Area properties in Chubut Province, Argentina, while all of IMA's other exploration properties in Argentina and Peru were transferred to the newly formed, TSXV-listed Golden Arrow Resources Corp, also of the Grosso Group. (IMA Exploration PR 7/2/04)_x000D_\n\tMogote was among the properties transferred to Golden Arrow. (MA 7/7/04)_x000D_\n\tIn May 2004, Amera completed a 5-hole, 1,475-m DD program at Filo Este.  Better results from the first four holes included 489 m grading.043 g/mt Au, 13.9 g/mt Ag, and 0.24% Cu. (NM 5/17/04)_x000D_\n\tIn April 2004, Amera negotiated to earn an additional 24% interest in the Mogote project for a total interest of 75%. (Amera PR 4/13/04)_x000D_\n\tIn late March 2004, Amera closed a $1 million private placement.  Proceeds would be used for exploration in Argentina and for general working capital. (Amera Resources PR 3/31/04)_x000D_\n\tIn March 2004, Amera Resources began a 2100 m DD program at Mogote. Drilling was to focus on the Filo Este porphyry target where a recent trenching exposed over 500 m of continuous copper-gold mineralization. Regional surface work including mapping, step-out talus sampling and road/trench construction was under way on Filo Central and other targets in preparation for possible drilling. (Amera PR 3/9/04)_x000D_\n\tIn January 2004, Amera completed a detailed surface exploration program at Mogote. Exploration consisted of trenching, geophysical surveys, geological mapping and rock and talus fines sampling. Significant results were returned from trench one, exposing over 500 m of continuous gold-copper mineralization within the Filo Este target, a 2,000 m by 700 m. (Amera PR 1/20/04)_x000D_\n\tAlso in January, Amera closed a private placement of up to $1.53 million.  Proceeds would be used to fund ongoing mineral exploration in Argentina and for general working capital. (Amera PR 1/13/04)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In February 2004, Connors Argentina, S.A. were contracted to carry-out a drill program at the Mogote. (Amera PR 2/25/04)_x000D_\n\tIn December 2003, assay results were completed by ALS Chemex Laboratories, Mendoza, Argentina. (Amera PR 12/4/03)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of September 2017, Mogote covered 8,300 ha. (Golden Arrow Fact Sheet Sept 27, 2017)_x000D_\n   In November 2016, the Mogote project now included about 8,800 ha to which Golden Arrow has an exclusive right. (Golden Arrow 9/16 QR Nov 28, 2016)_x000D_\n   In October 2014, the Mogote property covered 8,300 ha. (Golden Arrow Fact Sheet 10/16/14)_x000D_\n   As at January 2012, subject to a 1% NSR (Royalty updated from Intierra)_x000D_\n   As at December 2002, the vendors retained a 0.5% NSR, up to a maximum of C$500,000. (IMA 12/02 AR May 20, 2003)_x000D_\n   In March 2001, the property comprised 8,000 ha.  (MMLA 3/12/01)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Porphyry Deposit","ORE_MINERALS":"Chalcopyrite, Magnetite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Mogote","DISTANCE_FROM":"190 km NNW of Rodeo","LOCATION_COMMENTS":"The Mogote property is 70 km north of Barrick Gold's Pascua and Homestake Mining's Veladero gold deposits and immediately south of, and contiguous to Tenke and Rio Tinto's Vicuna property. (NM 5/6/01)","ROYALTY_TYPE":"Net Smelter Return","ROYALTY_PCT":1,"GEOLOGY_COMMENTS":"The North Ridge zone is characterized by strong potassic alteration. Mineralization, which is hosted by volcanics and cross-cutting microdiorite and diorite, consists of copper oxides on fractures and multiple-stage quartz+magnetite+chalcopyrite+pyrite veinlets. _x000D_\nThe South Ridge zone shows strong potassic alteration, magnetite veining, and breccia within microdiorite and diorite. High sulfidation epithermal quartz-enargite veins locally contain vuggy silica cores and clay alteration haloes and cross-cut the potassic alteration. _x000D_\nThe International Border zone, lying between the North Ridge and South Ridge zones, shows disseminated copper oxides with minor quartz and quartz-magnetite veining. The zone is underlain by fine-grained microdiorite with strong secondary biotite alteration, characteristic of the potassic alteration zone within a porphyry-style hydrothermal system.  (Amera Resources WS 11/04)","EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":null,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":null,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":null,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":null,"CONTAINED_RESV_Ag_oz":null,"GRD_MEAS_IND_Au_gpt":null,"GRD_MEAS_IND_Ag_gpt":null,"CONTAINED_MEAS_IND_Au_oz":null,"CONTAINED_MEAS_IND_Ag_oz":null,"GRD_INF_Au_gpt":null,"GRD_INF_Ag_gpt":null,"CONTAINED_INF_Au_oz":null,"CONTAINED_INF_Ag_oz":null,"GRD_TOTAL_RESRC_Au_gpt":null,"GRD_TOTAL_RESRC_Ag_gpt":null,"CONTAINED_TOTAL_RESRC_Au_oz":null,"CONTAINED_TOTAL_RESRC_Ag_oz":null,"GRD_R_AND_R_Au_gpt":null,"GRD_R_AND_R_Ag_gpt":null,"CONTAINED_R_AND_R_Au_oz":null,"CONTAINED_R_AND ion (NSR) 0%Mincorp Exploraciones S.A. (NPI) 5%Royal Gold, Inc. (NSR) 0%","OWNER_NAME":"Eris LLC","CURRENT_OWNER_COMMON_NAME":"Eris LLC","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"USA","OWNER_MKT_CAP":null,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-29.72,"LONGITUDE":-68.629,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"During the year ended December 2024, Sandstrom reported a feasibility study and detailed engineering work is underway at DCP which is anticipated to be completed in year 2025. (Sandstorm 12/24 10-K Mar 31, 2025)_x000D_\n   During the March 2023 quarter, Mineros reported an updated mineral resource estimate at Gualcamayo. (Mineros 3/23 MD&A May 8, 2023)_x000D_\n    In year ended December 2022, Mineros has determined to reduce its open pit and underground oxide gold mining operations at the Gualcamayo mine during 2023. It anticipates that the ore processing operations located in leach pads will continue production after the cessation of mining activities, and is expected to be completed. sometime in 2025, despite will continue the production, the Company continues to analyze different mining and processing scenarios for its Deep Carbonates Project and expects to make an announcement in this regard during 2023. The company has also estimated mine life with 3 years that includes the depletion of the reserves and 2 years more of heap leach processes. (Mineros 12/22 AR Feb 20, 2023)_x000D_\n   In 2022, Gualcamayo produced 62,247 oz Au, also company was expecting to update the current DCP mineral estimate as at December 31, 2022, but was not planning additional drilling at DCP for 2023. (Mineros 12/22 MD&A Feb 17, 2023)_x000D_\n   In September 2022, Mineros planned to reduce its workforce at Gualcamayo by up to 30% due to natural depletion of deposit. Production and cost guidance for 2022 was expected to remain unaffected. (Mineros PR Sept 9, 2022)_x000D_\n   Also, in March 2022 quarter, Mineros planned 7,750-m DD program in year 2022 at Deep Carbonates, (Mineros 3/22 QR May 9, 2022)_x000D_\n   In the March 2022 quarter, Mineros planned to complete 17,000-m DD and RC program at Gulcamayo. (Mineros 3/22 QR May 9, 2022)_x000D_\n   As of the year-ended December 2021, Gulcamayo hosted reserves totaling 2.2 million mt grading 1.74 g/mt Au and resources totaling 24.2 million mt grading 1.24 g/mt Au. (Mineros 12/21 AR Mar 31, 2022)_x000D_\n   Also in 2021, Gualcamayo produced 61,487 oz Au. (Mineros PR Feb 16, 2022)_x000D_\n   In 2021, Mineros planned to complete 2,400-m of DD program at DCP, of which 2,348-m of DD in five holes had been completed as at September 30, 2021. Geotechnical and metallurgical test work was ongoing. A preliminary economic assessment based on the updated mineral resource estimate was expected to be completed by the end of the March 2022 quarter. (Mineros 9/21 MD&A Nov 15, 2021)_x000D_\n   During the March 2021 quarter, Mineros reported an updated mineral reserves and resources at Gualcamayo. (Mineros 3/21 QR May 27, 2021)_x000D_\n   In 2019, Gualcamayo produced 97,332 oz AuEq. (Mineros 12/19 AR Mar 25, 2020)_x000D_\n   In the year ended December 2018, Mineros planned to initiate a work plan on exploration in order to extend the life of the current operation and the materialization of the DCP project. (Mineros 12/18 AR Apr 4, 2019)_x000D_\n   In 2018, Gualcamayo produced 92,285 oz Au. (Yamana 12/18 MD&A Feb 15, 2019)_x000D_\nIn December 2018, Yamana reported that Gualcamayo was nearing its end of mine life. (Yamana PR Dec 31, 2018)_x000D_\n  As at December 2017, Gualcamayo hosted reserves totaling 10.24 million mt grading 1.49 g/mt Au and resources totaling 50.653 million mt grading 2.27 g/mt Au. (Yamana 6-K Feb 15, 2018)_x000D_\n   In the year ended December 2017, Gualcamayo produced 154,052 oz Au. (Yamana PR Feb 15, 2018)_x000D_\n   During the June 2017 quarter, new targets at Gualcamayo would be rapidly brought to the drill stage and were expected to be drill tested early in the September 2017 quarter. (Yamana 6/17 QR June 30, 2017)_x000D_\nIn February 2017, Yamana reported that drilling during the course of 2016 included 5,795-m distributed in 28 holes which tested the Potenciales target, 4,359-m distributed in 19 holes testing the Las Vacas target, 3,198-m distributed in 20 holes testing the Cerro Condor target and 4,946 m distributed in 19 holes that tested the Target 9 and AIM targets. Also, the heap leach processing facilities continued in 2016. (Yamana PR Feb 14, 2017)_x000D_\n   During year-end December 2016, Yamana reported updated reserves totaling 18.216 million mt grading 1.29 g/mt Au. Measured and Indicated resources totaled 46.651 million mt grading 1.88 g/mt Au. Inferred resources totaled 26.204 million mt grading 1.97 g/mt Au. _x000D_\nIn 2016, Gualcamayo produced 164,265 oz Au. The company announced that an updated mineral resource and reserve estimate would be completed in the first quarter of 2017. (Yamana PR Feb 16, 2017)_x000D_\n   In October 2016, Yamana provided update on the exploration programs at Gualcamayo. The Company had completed a total of 2,457 metres distributed in 12 holes testing the Potenciales and Las Vacas near surface oxide deposits. (Yamana PR Oct 27, 2016)_x000D_\n   During September quarter 2016, Yamana completed optimization work showing technically and economically study level  of the project. (Yamana 9/16 QR Sept 30, 2016)_x000D_\n   In September 2016, Yamana reported results from the surface exploration at Gualcamayo, infill drilling at Las Vacas, and exploration drilling at the Cerro Condor and Potenciales targets. (Yamana PR Sept 6, 2016)_x000D_\n   During the June 2016 quarter, an optimization work on three throughput scenarios for Deep Carbonates project was completed. A decision to advance to a more detailed phase of study would be made later in 2016. In addition, initial results from Cerro Condor and Sector Potenciales would be continued to be drill tested for consideration in the LOM planning process. (Yamana PR July 28, 2016; MD&A June 30, 2016)_x000D_\n   During the March 2016 quarter, Yamana carried out a medium term exploration work at Las Vacas and near term exploration were planned to focus on Cerro Condor and Targets DK. The company continued its detailed review of a number of mining method alternatives at Deep Carbonates. Two new targets were indentified. Samples were expected and a drill program was planned early in the second quarter.  (Yamana PR Mar 31, 2016)_x000D_\n   In 2015, exploration focused on discovering and extending near surface oxide mineral zones to both the east and west of current QDD Lower West underground operation limits, and on infill and expansion of the carbonate deposits that form the Southwest and parts of the Santiago mineral deposits in the Rodado target area. Yamana completed over 18,000 m of drilling over the course of 2015 and planned about 18,000 m of drilling for 2016. (Yamana 12/15 6-K Feb 26, 2016) The Las Vacas target would be followed up by first half of 2016. (Yamana 12/15 AR Mar 29, 2016)_x000D_\n   In the year 2015, Yamana reviewed the outcome of the initial technical and financial analysis of the Deep Carbonates project. Results would be evaluated during the course of 2016 and a decision would be made as to whether to advance to a detailed phase of study later in the year. _x000D_\n   As of December 2015, Gualcamayo hosted reserves of 25.73 million mt grading 1.17 g/mt Au and resources of 140.82 million grading 1.32 g/mt Au. (Yamana PR Feb 18, 2016; 6-K Feb 19, 2016)_x000D_\nIn 2015, Gualcamayo produced 181,000 oz Au. (Yamana PR Jan 13, 2016)  _x000D_\n   During the September 2015 quarter, Yamana completed the initial technical and financial analysis of the Deep Carbonates project, a potential large scale, bulk tonnage underground operation beneath the current QDD pit limits. The results of this analysis supported a viable project with recoverable gold currently estimated at more than 1.1 million oz. The results to date and the ongoing work were expected to support a decision in 2016 to advance the project to the pre-feasibility stage. In addition, the expansion of the Adsorption and Desorption plant was completed and was expected to further increase production beginning in the fourth quarter of 2015. (Yamana 9/15 QR)_x000D_\n   During the June 2015 quarter, a Preliminary Economic Assessment for the Deep Carbonates project, which describes a potential large scale, bulk tonnage underground operation beneath the current QDD pit limits, was advanced.  An internal review of the project has been completed and the findings are being consolidated for release later in 2015.    (Yamana 6/15 QR July 30, 2015)_x000D_\nExpansion of the Adsorption and Desorption plant remained on track for completion in the third quarter 2015.    (Yamana 6/15 QR)_x000D_\n   During the March 2015 quarter, expansion of the Adsorption and Desorption plant continued with recoveries to begin accelerating in 2016 and 2017. Work continued at Radado Southwest, the potential large scale bulk tonnage underground operation beneath the current QDD pit limits, which Yamana now refers to as the Deep Carbonates Alternative project. A PEA was on track for completion in 2Q of 2015.   (Yamana 3/15 QR Apr 28, 2015)_x000D_\n   For the year ended December 31, 2014, Yamana reported reserves and resources for Gualcamayo totaling 161.3 million mt grading 1.36 g/mt Au. In the December 2014 quarter, Gualcamayo produced 46,009 oz Au, and in 2014, it produced 180,412 oz Au. Also, the mine was expected to produce 175,000 oz Au, 170,000 oz Au, and 170,000 oz Au in 2015, 2016, and 2017 respectively. (Yamana PR Feb 11, 2015)_x000D_\n   In October 2014, Yamana reported that results at Rodado Southwest continue to support the potential for a large scale, bulk tonnage underground operations with several intersections exceeding 100 m. (Yamana PR 10/2/14)_x000D_\n   During the September 2014 quarter, Yamana reported that a prefeasibility study would begin in 2015 at Gualcamayo and would provide an update on the potential mine and processing methods by the end of 2014. (Yamana 9/14 QR 9/30/14)_x000D_\n   During the September 2014 quarter, Yamana produced 43,060 oz Au from Gualcamayo. The new QDD lower west was completed during the quarter and contributed about 30% of the ore for the period. (Yamana 9/14 ER 10/29/14) _x000D_\n   During the June 2014 quarter, Yamana produced 52,863 oz Au at co-product cash cost of $700/oz Au at Gualcamayo. Nineteen holes totaling 7,965 m had been completed by the end of the second quarter and once results were received, metallurgical testing would begin on the samples. _x000D_\nIn addition, the expansion of the Adsorption and Desorption (ADR) plant was planned for the second half of the year to improve recovery rates beginning later in the year on both the north and south leach pads. The company completed infill drilling at Rodado southwest and results were pending. (Yamana 6/14 QR 7/30/14)_x000D_\nDuring the March 2014 quarter, Gualcamayo produced 38,481 oz Au at a co-production cost of $739/oz Au. Yamana continued to progress with studies of the options for processing newly discovered sulphide resources, including Rodado. 11 holes totaling 4,626 m were completed during the quarter. The 2014 exploration program would focus on expanding the Rodado zone and testing new target areas for near surface oxide potential. A drill program was planned to collect core samples of the sulfide zones that can be properly preserved for metallurgical work and used for the sulfide feasibility study of the deep sulfide mineral deposits. (Yamana 3/14 QR 4/29/14)_x000D_\nDuring the 2013 fourth quarter, Yamana completed a 3,878-m drill program at the Rodado southwest at Gualcamayo with positive results. (Yamana 12/13 AR 3/28/14)_x000D_\nAs of mid-February 2014, Gualcamayo hosted proven and probable reserves of 32.2 million mt grading 1.33 g/mt Au. (Yamana PR 2/18/14)_x000D_\n   In 2013, Gualcamayo produced 120,337 oz AuEq. Projected production for 2014 was estimated at 170,000 oz AuEq. (Yamana PR 2/10/14)_x000D_\n\tDuring the September 2013 quarter, Yamana continued to focus its exploration program at the Rodado and QDD Lower West systems. (Yamana 9/13 QR 10/29/13)_x000D_\nIn August 2013, the Gualcamayo’s QDD mine transitioned to the new Phase III, resulting in decline of production. The QDD Lower West underground mine also began to contribute to heap leach stacking. Completion of the underground conveyor for QDDLW was expected in the second quarter and production was expected to ramp up each quarter during 2014. (Yamana 12/13 QR 2/18/14)\t_x000D_\n\tIn addition, Yamana reported that underground development of QDD Lower West continued and was expected to be completed by the September 2013 quarter. A conceptual study on ore processing options was ongoing and was expected to be completed by 2013. (Yamana 6/13 QR 7/31/13)_x000D_\n\tIn late July 2013, Yamana reported results from the 32 holes completed in the first half of 2013. Better results included 133 m grading 1.5 g/mt Au, including 24 m grading 3.2 g/mt Au in hole 13QD-762; and 115.3 m grading 2.3 g/mt Au, including 25.3 m grading 3.5 g/mt Au in hole 13QD-774. (Yamana PR 7/31/13)_x000D_\n\tIn 2012, Gualcamayo produced 147,310 oz Au at cash costs of $536/oz AuEq. (Yamana 12/12 QR 2/20/13)_x000D_\n\tIn December 2012, Premier Gold Mines completed a business combination of the company's royalty subsidiary and Bridgeport Ventures to form a new publicly traded entity, Premier Royalty Inc. (Premier PR 12/5/12)_x000D_\n\tIn November 2012, Premier completed the purchase of a 1% NSR at Gualcamayo from Golden Arrow. (Premier PR 11/12/12)_x000D_\n\tSubsequent to the end of the June 2012 quarter, material was being placed on the heap leach pad in Valle Norte as part of the expansion at Gualcamayo. Production from Valle Norte was slated to begin in August. Underground development at QDD Lower West continued with completion of the project remaining on schedule. Gualcamayo was expected to produce over 200,000 oz/y Au starting in 2014. _x000D_\n\tIn the June 2012 quarter, Yamana completed 7,300 m of drilling over 39 holes at Gualcamayo. Drilling focused on extending the Rodado breccias to the north. (Yamana 6/12 QR 8/8/12) _x000D_\n\tIn May 2012, Premier Gold Mines entered a definitive purchase agreement whereby its subsidiary Premier Royalty would acquire the 1% NSR royalty at Gualcamayo from Golden Arrow Resources. (Golden Arrow PR 5/24/12)_x000D_\n\tIn the March 2012 quarter, Yamana completed 2,700 m of drilling at Gualcamayo, focused on extending Rodado breccias to the north. The company also began development of a new underground access to the southwest extension of both the Rodaddo and QDD-LW breccias. (Yamana 3/12 QR 5/1/12)_x000D_\n\tIn 2011, Gualcamayo produced 158,871 oz Au. Yamana expected the operation to produce 167,500 oz Au in 2012 and 185,000 oz Au in 2013. Full ramp up of the expansions at Gualcamayo was slated for completion by mid-2013, expected to increase production to 200,000 oz/y Au beginning in 2014. (Yamana PR 1/11/12) _x000D_\n\tAs of year end, Yamana was planning an $11-million exploration program at Gualcamayo in 2012, which would focus on the southwest and down-dip extensions of the two large sulfide breccia bodies. The company reported capital costs of $66.6 million at Gualcamayo for the year. (Yamana 12/11 AR 3/30/12)","ENVIRO_COMMENTS":"In 2010, the Gualcamayo mine achieved ISO 14001 certification for its Environmental Management Systems. (Yamana 12/10 AR 2/23/11) _x000D_\n\tIn December 2006, Yamana confirmed the EIS had been submitted to the government of the province of San Juan, Argentina. This EIS is the final submission required to receive the operating permit for mine development. (Yamana PR 12/19/06)_x000D_\n\tIn November 2006, the EIS was complete and the company expected to submit the report before month-end, following final checks. (Viceroy 9/06 QR 11/7/06)","SUBCONTRACTORS":"In August 2007, EDVSA won the bidding process to build a power transmission line for the Gualcamayo project. Construction was to begin immediately and had a seven month timeline. (BNA 8/16/07)_x000D_\n\tIn September 2006, an updated resource estimate was calculated by Geosim Services Inc, under the direction of Ronald G. Simpson, P.Geo._x000D_\n\tWardrop Engineering of Vancouver, BC was contracted to prepare an updated preliminary economic assessment, based on the newly calculated resource estimate. (Viceroy PR 9/6/06)_x000D_\n\tIn January 2005, AMEC Americas completed a preliminary economic assessment on the QDD deposit which recommended advancing towards feasibility. (Viceroy 12/05 AR 3/10/06)_x000D_\n\tAlso during 2005, an unspecified independent consulting firm was retained to oversee and manage the necessary baseline work required for the EIS, which Viceroy expected to submit in the third quarter of 2006. (Viceroy 12/05 AR 3/10/06)                                         _x000D_\n\tIn September 2004, Viceroy selected Major Drilling SA, a wholly owned subsidiary of Major Group Drilling International Inc, New Brunswick Canada to complete the second phase of drilling at Gualcamayo.  (Viceroy PR 9/20/04)_x000D_\n\tIn August 2003, Viceroy had selected AMEC E&C Services, Vancouver to complete the scoping study. (Viceroy PR 8/18/04)_x000D_\n\tIn May 2004, samples were assayed by ALS Chemex, Santiago Chile.  (Viceroy PR 5/26/04)_x000D_\n\tIn January 2000, MRDI of San Mateo was retained to confirm Viceroy's resource estimates and complete due diligence on the project. (Viceroy PR 1/25/00)","START_UP_YR":2008,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":2027,"DESCRIPTION_CLAIM":"As of December 2022, Gulcamayo covering an area of about 39,200 ha. (Mineros 12/22 AR Feb 20, 2023)_x000D_\n   As of November 2021, Gulcamayo consisted of 87 non-contiguous mining concessions covering an area of about 36,100 ha. (Mineros PROS Nov 11, 2021)_x000D_\n   As of October 2018, The acquisition of Gualcamayo provides a large expanse of land of 20,000 ha. (Yamana PR Oct 25, 2018)_x000D_\n   The main Gualcamayo block consists of one Cateo and 57 Minas covering a total of 7,128 hectares. (Yamana 12/13 AR 3/28/14)_x000D_\n   As of May 2006, the property covered 488.7 sq km and was situated at an elevation of between 1,600-2,300 m above sea level, and near power and water sources, and a paved highway. (NM 5/29/06) _x000D_\n   In March 2003, the project comprised 24,916 ha. (Viceroy PR 3/25/03)_x000D_\n   The Salamanca property (profile# 109923) forms a part of Gualcamayo. (PC 11/00). The Salamanca mineralization is 12 km north of Gualcamayo (Viceroy Resources PR 3/25/03)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":19783000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":19783000,"INF_RESRC_ORE_TONNAGE":3453000,"TOTAL_RESRC_ORE_TONNAGE":23236000,"R_AND_R_ORE_TONNAGE":23236000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Porphyry Deposit, Skarn (Metasomatic)","ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Gualcamayo","DISTANCE_FROM":"200 km N of San Juan","LOCATION_COMMENTS":"The nearest local town to the project site is 100 km away. (Mineweb 8/18/06)_x000D_\nThe Quebrada Perdida prospect is about 8 km west of the QDD zone. (Viceroy PR 7/17/06)_x000D_\nGualcamayo was located with the Precordillera area of Argentina in an area of rugged topography.  The climate was semi-arid with hot summer and mild winters.  Exploration could be conducted year-round.  The project was 13 km from the San Juan highway. (Viceroy 12/03 AR 21/8/04)","ROYALTY_TYPE":"Net Profits Interest","ROYALTY_PCT":5,"GEOLOGY_COMMENTS":"The zone hosts limestone and marble breccias, as well as an altered feldspar porphyry.  (NM 11/30/98)_x000D_\nThis zone consists of a massive pyrrhotite mineralization.  (Oro Belle PR 9/10/97)_x000D_\n\tThe Gualcamayo property hosts three areas of known proximal gold-copper skarns.  These deposits are associated with a Tertiary intrusive cutting thrusted early Paleozoic carbonate and clastic sediments.  (Oro Belle PR 5/12/97)","EST_MINE_LIFE_YR":2.5,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":null,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":null,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":null,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":0,"CONTAINED_RESV_Ag_oz":null,"GRD_MEAS_IND_Au_gpt":3.29,"GRD_MEAS_IND_Ag_gpt":null,"CONTAINED_MEAS_IND_Au_oz":2090000,"CONTAINED_MEAS_IND_Ag_oz":null,"GRD_INF_Au_gpt":3.38,"GRD_INF_Ag_gpt":null,"CONTAINED_INF_Au_oz":376000,"CONTAINED_INF_Ag_oz":null,"GRD_TOTAL_RESRC_Au_gpt":3.301,"GRD_TOTAL_RESRC_Ag_gpt":null,"CONTAINED_TOTAL_RESRC_Au_oz":2466000,"CONTAINED_TOTAL_RESRC_Ag_oz":null,"GRD_R_AND_R_Au_gpt":3.301,"GRD_R_AND_R_Ag_gpt":null,"CONTAINED_R_AND_R_Au_oz":2466000,"CONTAINED_R_AND_R_Ag_oz":null},{"PROP_NAME":"Gualilan","PROP_ID":28929,"PRIMARY_COMMODITY":"Gold","ALSO_KNOWN_AS":null,"DEV_STAGE":"Target Outline","ACTV_STATUS":"Inactive","MO_YR_SOURCE_DATE":"07/1998","MINE_TYPE1":null,"MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Gold","OPERATOR_NAME":"TNR Gold Corp.","OPERATOR_COMMON_NAME":"TNR Gold Corp.","OPERATOR_COUNTRY":"Canada","OPERATOR_MKT_CAP":66.6628984,"OWNER_LIST":"TNR Gold Corp.  100%","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"TNR Gold Corp.","CURRENT_OWNER_COMMON_NAME":"TNR Gold Corp.","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":66.6628984,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-30.70802,"LONGITUDE":-68.94961,"COORDINATE_ACCURACY":"Approximate","GENERAL_COMMENTS":"In July 1998, TNR  acquired Solitario's Argentina subsidiary for $500,000 in cash. The subsidiary held 14 properties in Argentina, including Gualilan. TNR is now seeking a joint venture partner for the property. (TNR PR 7/20/98)\t_x000D_\n\tBy November 1996, results from an RC drilling program designed to test the potential for skarn-type and Carlin-type mineralization were unfavorable, and the joint venture was terminated. (Monarch PR 11/12/96)_x000D_\n\tIn 1995, Monarch conducted geologic mapping, geochemical sampling, airborne geophysics, and RC drilling.  Based on the surface and airborne geophysical work, five drill targets were identifed and drilled tested with 12 drill holes totaling 3,600 ft.  No economic mineralization was encountered in any of the drill holes, anomalous gold, silver, lead, zinc, antimony or arsenic were intersected in seven of the holes.  Based on these results, Monarch elected to proceed with their year-two, C$375,000 work commitment.  (Crown 12/95 AR 3/21/96)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"The property covers approximately 10,000 ha., and encompasses the past producing Gualian gold district which has the potential to host Carlin Trend disseminated gold mineralization. (PR 8/4/94)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":null,"DI null,"CURRENT_OWNER_COMMON_NAME":null,"OWNER_TYPE":null,"OWNER_PCT":null,"CURRENT_CONTROLLING_OWN_PCT":null,"OWNER_COUNTRY":null,"OWNER_MKT_CAP":null,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-29.4176,"LONGITUDE":-69.9217,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"There has been no news or updates received for this property within the last two years and it has been presumed relinquished. (S&P May 2017)_x000D_\n   In September 2005, exploration DD and fieldwork resumed in the Frontera district at the Guanaco Zonzo target, where a large geophysical anomaly was situated between two known mineralized areas. A follow-up DD program was planned for Guanaco Zonzo, where previous drilling intersected 26 m grading 6 g/mt Au (Hole GZRC-28) (Barrick WS 11/05). Exploration drilling was also planned for Regalito and two additional, unnamed targets. (Barrick 9/05 QR 10/27/05)_x000D_\n\tBy the December quarter 2004, data compilation and ground surveys had generated more than 30 untested exploration targets in the 3,000 sq km land package under Barrick's ownership. (Barrick WS 11/05)_x000D_\n\tIn mid-2004, Barrick reactivated exploration activity in the Frontera district after a four-year hiatus. The Frontera district (Chile/Argentina) included Barrick's Veladero (profile # 108974 ) and Pascua-Lama (profile # 104382) projects. (Barrick WS 11/05)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"In November 1998, the property consisted of claims and prospects totaling some 65,000 ha ( NM 11/30/98) in a 10-km-wide strip which stretches 45 km along the Argentine-Chilean border. (NM 2/13/95)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":5700000,"R_AND_R_ORE_TONNAGE":5700000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_M ration","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"07/2015","MINE_TYPE1":null,"MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"U3O8","OPERATOR_NAME":"Latin Uranium SRL","OPERATOR_COMMON_NAME":"Latin Uranium SRL","OPERATOR_COUNTRY":"Argentina","OPERATOR_MKT_CAP":null,"OWNER_LIST":"Latin Uranium SRL (Optionee) 100%; Tadeo Srl (Optionor) %; Private Interest (Optionor) %","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"Latin Uranium SRL","CURRENT_OWNER_COMMON_NAME":"Latin Uranium SRL","OWNER_TYPE":"Optionee","OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Argentina","OWNER_MKT_CAP":null,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-30.11006,"LONGITUDE":-68.5548,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In the June 2015 quarter, Cohiba decided not to proceed with its investment in Latin Uranium SRL due to current financial position. (Cohiba 6/15 QR July 27, 2015)_x000D_\n   In January 2015, Cohiba announced results on exploration work commissioned for the Homero project, which included independent laboratory results of soil, float and chip rock samples analysed for uranium mineralisation and which confirmed mineralisation at surface (outcrop) with sample results of up to 13,840 ppm (1.38%) U308. A scout drill program was in planning for the March 2015 quarter at Huaco, with approvals now having been granted. Cohiba anticipated completing it's due diligence of the projects by the June 2015 quarter, and would subsequently decided whether it executes it's option to acquire an initial 40% of Latin Uranium. (Cohiba PR Jan 28, 2015)_x000D_\n  In late October 2014, Cohiba was seeking to raise up to A$350,000 by way of a 1 for 3 nonrenouncaeable rights issue. A portion of the proceeds was intended to be applied towards acquisition costs associated with the Huaca/Homero projects. (Cohiba MISC 10/28/14)_x000D_\n   In mid-October 2014, Cohiba announced the start of exploration programs, budgeted at A$200,000, at Huaca and Homero which were scheduled to run through to the end of 2014. The work would consist of mapping, sampling, and drilling of 600 m surface collars. Results, scheduled for early 2015, would predicate any subsequent drilling to be carried out. (Cohiba PR 10/13/14)_x000D_\n   In October 2014, Cohiba completed and issued a JORC-compliant technical report for the Huaco and Homero projects. It intended to undertake verification drilling and other exploration activities, which were expected to lead up to the acquisition of an initial interest at the project from optionor, Latin Uranium SRL. (Cohiba TR 9/29/14)_x000D_\n      (Jun 30, 2014) Cohiba Minerals has entered into an agreement with Latin Uranium Pty Ltd (through Latin Uranium SRL), under which Cohiba will acquire up to 40% of the shares in Latin by way of a staged investment, for a total cost of up to A$2M. Latin has an option purchase agreement to acquire from M C Licari, S I Matellan and Tadeo SRL up to 100% of 16 tenements for the Homero, Huaco and Chepical projects in San Juan, Argentina covering an area of approximately 56,000 Hectares. The tenements comprise 5 project areas.","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In 2013, geophysical programs at Huaco and Homero were conducted by San Juan-based J. Herrera Consulting. (Cohiba TR 9/29/14)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of October 2014, the Huaca and Homero projects consisted of 16 mineral claims covering 56,097 ha on the Central-Eastern Precordillera. (Cohiba TR 9/29/14)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_MINERALS":"Barite (Barytes)","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Huaco","DISTANCE_FROM":"160 km N of San Juan","LOCATION_COMMENTS":"The Huaco and Homero prope
