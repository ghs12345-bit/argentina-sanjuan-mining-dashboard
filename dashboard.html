<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f6fa;color:#2c3e50;height:100vh;overflow:hidden}
.header{background:linear-gradient(135deg,#2c3e50 0%,#34495e 50%,#2c3e50 100%);color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;z-index:1000;position:relative;min-height:42px}
.header h1{font-size:16px;font-weight:600;letter-spacing:0.5px}
.header .badge-row{display:flex;gap:8px;flex-wrap:wrap}
.header .badge{background:rgba(255,255,255,0.15);padding:3px 10px;border-radius:10px;font-size:11px}
.main{display:flex;height:calc(100vh - 42px)}
.sidebar{width:320px;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #e8ecf1}
.map-container{flex:1;position:relative}
#map{width:100%;height:100%}
.sidebar-section{padding:12px 14px;border-bottom:1px solid #f0f2f5}
.sidebar-section h3{font-size:12px;font-weight:600;margin-bottom:8px;color:#576574;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:0.5px}
.sidebar-section h3::before{content:'';display:inline-block;width:3px;height:12px;background:#3498db;border-radius:2px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-card{background:#f8f9fb;border-radius:6px;padding:8px;text-align:center;border:1px solid #eef0f4}
.stat-card .num{font-size:20px;font-weight:700;color:#2c3e50}
.stat-card .label{font-size:10px;color:#95a5a6;margin-top:2px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.filter-item{display:flex;flex-direction:column}
.filter-item label{font-size:10px;color:#95a5a6;margin-bottom:2px}
.filter-item select{padding:4px 6px;border:1px solid #dcdfe6;border-radius:4px;font-size:11px;background:#fff;color:#2c3e50;cursor:pointer}
.filter-item select:focus{border-color:#3498db;outline:none}
.toggle-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.toggle-btn{padding:4px 10px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;font-size:11px;cursor:pointer;transition:all 0.15s;color:#576574}
.toggle-btn.active{background:#3498db;color:#fff;border-color:#3498db}
.toggle-btn:hover{border-color:#3498db}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chart-box{background:#f8f9fb;border-radius:6px;padding:6px;border:1px solid #eef0f4}
.chart-box canvas{width:100%!important;height:130px!important}
.sidebar-scroll{flex:1;overflow-y:auto;padding-bottom:12px}
.insights{font-size:11px;color:#576574;line-height:1.7}
.insights b{color:#2c3e50}
.legend{background:rgba(255,255,255,0.95);padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.1);font-size:10px;position:absolute;bottom:16px;right:16px;z-index:1000}
.legend h4{font-size:11px;margin-bottom:4px;color:#576574}
.legend-item{display:flex;align-items:center;gap:4px;margin:2px 0;font-size:10px;color:#576574}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup-container{max-width:420px;font-size:11px}
.popup-container h3{font-size:14px;margin-bottom:4px;color:#2c3e50}
.popup-tabs{display:flex;gap:0;margin:8px 0 6px;border-bottom:2px solid #eef0f4}
.popup-tab{padding:4px 10px;font-size:10px;cursor:pointer;border:none;background:none;color:#95a5a6;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
.popup-tab.active{color:#3498db;border-bottom-color:#3498db;font-weight:600}
.popup-content{display:none;max-height:280px;overflow-y:auto}
.popup-content.active{display:block}
.popup-table{width:100%;border-collapse:collapse}
.popup-table td{padding:3px 5px;border-bottom:1px solid #f5f6fa;font-size:10px;vertical-align:top}
.popup-table td:first-child{color:#95a5a6;white-space:nowrap;width:40%}
.commodity-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:600;color:#fff;margin:1px}
.info-row{display:flex;gap:14px;font-size:11px;color:#576574;margin-top:3px}
.info-row span{display:flex;align-items:center;gap:3px}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
@media(max-width:768px){.sidebar{display:none}}
</style>
</head>

<div class="header">
  <div><h1>&#x26CF; 阿根廷 San Juan 省矿项目看板</h1></div>
  <div class="badge-row">

<div class="main">
  <div class="sidebar">
    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <h3>核心指标</h3>

          <div class="stat-card"><div class="num" id="stat-total">80</div><div class="label">项目总数</div></div>

          <div class="stat-card"><div class="num" id="stat-commodities">6</div><div class="label">矿种数量</div></div>
        </div>
      </div>
      <div class="sidebar-section">
        <h3>筛选条件</h3>
        <div class="filter-grid">
          <div class="filter-item">
            <label>矿种</label>
            <select id="filter-commodity"><option value="all">全部</option></select>
          </div>
          <div class="filter-item">
            <label>开发阶段</label>
            <select id="filter-stage"><option value="all">全部</option></select>
          </div>
          <div class="filter-item">
            <label>活跃状态</label>
            <select id="filter-status"><option value="all">全部</option></select>
          </div>
          <div class="filter-item">
            <label>经营国</label>
            <select id="filter-country"><option value="all">全部</option></select>
          </div>
        </div>
        <div class="toggle-row">
          <button class="toggle-btn" id="btn-heatmap" onclick="toggleHeatmap()">&#x1F525; 热力图</button>
          <button class="toggle-btn active" id="btn-cluster" onclick="toggleCluster()">&#x1F4CC; 聚合</button>
          <button class="toggle-btn" onclick="resetFilters()">&#x1F504; 重置</button>
        </div>
      </div>
      <div class="sidebar-section">
        <h3>阶段分布</h3>
        <div class="chart-box"><canvas id="chart-stage"></canvas></div>
      </div>
      <div class="sidebar-section">
        <h3>经营方国家分布</h3>
        <div class="chart-box"><canvas id="chart-country"></canvas></div>
      </div>
      <div class="sidebar-section">
        <h3>关键发现</h3>
        <div class="insights" id="insights-text"></div>
      </div>
    </div>
  </div>
  <div class="map-container">
    <div id="map"></div>
    <div class="legend">
      <h4>开发阶段图例</h4>
      <div class="legend-item"><div class="legend-dot" style="background:#27ae60"></div>在产/试生产</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8e44ad"></div>可研/建设</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e67e22"></div>预可研/储量开发</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f39c12"></div>勘探阶段</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div>草根/靶区</div>
      <div class="legend-item"><div class="legend-dot" style="background:#95a5a6"></div>关闭/其他</div>
    </div>
  </div>
</div>

NTRY":"Canada","OPERATOR_MKT_CAP":563.48781536,"OWNER_LIST":"Aldebaran Resources Inc. (Optionee) 80%; Sibanye Stillwater Limited (Optionor) 20%","ROYALTY_HOLDER_LIST":"Private Interest (NSR) 0%OR Royalties Inc. (NSR) 1%","OWNER_NAME":"Aldebaran Resources Inc.","CURRENT_OWNER_COMMON_NAME":"Aldebaran Resources Inc.","OWNER_TYPE":"Optionee","OWNER_PCT":80,"CURRENT_CONTROLLING_OWN_PCT":80,"OWNER_COUNTRY":"Canada","OWNER_MKT_CAP":563.48781536,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-31.4813,"LONGITUDE":-70.48096,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In May 2026, Aldebaran completed seven-hole infill drilling program at Altar. (Aldebaran PR May 21, 2026)_x000D_\n   In April 2026, Aldebaran expected to complete updated mineral resource estimate in September 2026 quarter and pre-feasibility study in June 2027 quarter or September 2027 quarter at Altar. (Aldebaran PR Apr 9, 2026)_x000D_\n   In October 2025, Aldebaran reported the PEA study at Altar. (Aldebaran PR Oct 30, 2025)_x000D_\n   In September 2025, Aldebaran reported PEA has been delayed until Q4-2025. (Aldebaran PR Sept 5, 2025)_x000D_\n   In August 2025, Aldebaran reported results from infill DD program at Altar. (Aldebaran PR Aug 7, 2025)_x000D_\n   In June 2025 Aldebaran reported the completion of the 25,186.70m Drill program at Altar Project. (Aldebaran PR June 17, 2025)_x000D_\n   In May 2025, Osisko officially changed their name to OR Royalties Inc. (OR PR May 8, 2025)_x000D_\n   In April 2025, Aldebaran reported to delay the release of the Pre-Feasibility Study to Q3-2025. (Aldebaran PR April 15,2025)_x000D_\n   As of April 2025, Aldebaran completed 18,267.5 m drill program at Altar. (Aldebaran PR Apr 15, 2025)_x000D_\n   In November 2024, Aldebaran planned to complete Pre-Feasibility Study in second half of 2026 at Altar. (Aldebaran PR Nov 21, 2024)_x000D_\n   In July 2024, Aldebaran planned to complete an updated mineral resource estimate in the December 2024 half at Altar. (Aldebaran PR July 22, 2024)   _x000D_\n   In June 2024, Aldebaran completed a 20-hole, totaling 20,024.40-m DD program at Altar.  (Aldebaran PR June 17, 2024)_x000D_\n   In March 2024, Aldebaran reported that first PEA was expected to be completed in first half of 2025 at Altar. (Aldebaran IP Mar 1, 2024)_x000D_\n   In February 2024, Sibanye reported updated mineral resources at Altar. (Sibanye Stillwater PR Feb 26, 2024)_x000D_\n   In February 2024, Aldebaran planned to update mineral resource in December 2024 for Altar. (Aldebaran PR Feb 6, 2024)_x000D_\n   In November 2023, Aldebaran has started 2023-2024 filed season drill program with four active drill rigs and was targeting 15,000-20,000 m drilling at Altar. (Aldebaran PR Nov 2, 2023)_x000D_\n   In July 2023, Osisko reported that Alderan restarted drilling on 228-holes and four rigs are actively drilling with assays pending at Altar. (Osisko PR July 6, 2023)_x000D_\n   In February 2023, Sibanye reported resources remained the same for 2022 at Altar. (Sibanye PR Feb 17, 2023)_x000D_\n   In November 2022, Aldebaran started a drill program at Altar. (Aldebaran PR Nov 15, 2022)_x000D_\n   In June 2022, Aldebaran planned to start 2022/2023 field program in September/October 2022 at Altar. The 3D IP/Resistivity and MT geophysical survey was also completed at Altar. (Aldebaran PR June 13, 2022)_x000D_\n   In May 2022, Aldebaran reported results from ongoing drill program at Altar. (Aldebaran PR May 11, 2022)_x000D_\n   During the year-ended December 2021, Sibanye announced that a five-hole, 4,880-m DD program was conducted at Altar. (Sibanye PR Dec 31, 2021)_x000D_\n   In early November 2021, Aldebaran has started drill program at Altar. (Aldebaran PR Nov 4, 2021)_x000D_\n   In September 2021, Aldebaran started 2021-2022 exploration activities at Altar and it will also be expanding its talus fines geochemical survey which was completed during the 2020-2021 field season. (Aldebaran PR Sept 30, 2021)_x000D_\n   In June 2021, Aldebaran completed the field season at Altar. (Aldebaran PR June 15, 2021)_x000D_\n   In March 2021, Aldebaran reported an updated mineral resource estimate at Altar totaling 1.4 billion mt grading 0.42% Cu, 0.09 g/mt Au and 1 g/mt Ag. (Aldebaran PR Mar 22, 2021)_x000D_\n   In February 2021, Aldebaran started a drill program at Altar. (Aldebaran PR Feb 2, 2020)_x000D_\n   In January 2021, Aldebaran reported that a resource estimate for Altar was expected to be delivered by the end of the March 2021 quarter. (Aldebaran PR Jan 19, 2021)_x000D_\nAs of December 2020, mineral resources at Altar remained unchanged. (Sibanye PR Feb 15, 2021)_x000D_\n   In August 2020, Aldebaran reported that an exploration program at Alter was planned to start in November 2020. (Aldebaran PR Aug 28, 2020)_x000D_\n   In March 2020, Aldebaran reported that it has been immediately arranged for the field-camp to be closed due to COVID-19 Pandemic. (Aldebaran PR March 26, 2020)_x000D_\n   In October 2019, Aldebaran reported drill results from the completed 5,400-m, four-hole drill program at Altar. (Aldebaran PR Oct 3, 2019)_x000D_\n   In March 2019, Aldebaran announced the start of a 4-5 hole, 5,000-m DD program at Altar. A re-logging program of all previous holes (about 115,000-m) was also being completed. (Aldebaran PR Mar 6, 2019)_x000D_\n   In August 2018, a NI 43-101 Technical Report was released in support of a resource update for the Altar and Quebrada de La Mina deposits (located 3 km west of Altar Central). Resources totaled a Meas+Ind 2,057 million mt at 0.33% TCu, 0.079 g/mt Au and 0.95 g/mt Ag plus an Inferred 556.6 million mt at 0.283% TCu, 0.061 g/mt Au and 0.88 g/mt Ag. The mineral resource was based on the assumption that Altar concentrates will be processed on site using POX+SX-EW+Cn Leach.   (Regulus TR Aug 23, 2018)_x000D_\n   In June 2018, Aldebaran engaged Independent Mining Consultants, Inc. of Tucson, Arizona, to prepare a current NI 43-101 resource estimate for Altar, which is expected to be completed in August, 2018. (Regulus PR June 29, 2018)_x000D_\n   As at December 2017, Altar hosted resources totaling 2.6 billion mt grading 0.1 g/mt Au and 0.311% Cu. (Sibanye PR Feb 19, 2018)_x000D_\n   At year-end December 2016, Stillwater reported that $3.9 million was spent at the Altar property on exploration in 2016. The Company expected to undertake a limited exploration program at Altar in 2017. (Stillwater 12/16 10-K Feb 16, 2017)_x000D_\n   In December 2016, Levi & Korsinsky announced an investigation into whether the sale of Stillwater mining company to Sibanye Gold Limited is fair to shareholders. (Stillwater PR Dec 15, 2016)_x000D_\n   In the June 2016 quarter, exploration expenses of $0.9 million were incurred at Altar. (Stillwater 06/16 QR July 29, 2016)_x000D_\nIn December 2015, Stillwater planned to undertake a limited exploration and would maintain environmental monitoring activities at Altar. (Stillwater 12/15 AR Feb 22, 2016)_x000D_\nAs of February 2015, Stillwater was continuing to review alternatives for optimizing its investments in Altar. (Stillwater 12/14 10K Feb 20, 2015)_x000D_\n   During the June 2014 quarter, Stillwater scaled back activities at Altar, while maintaining a minimum level of activity that permits it to retain its interest in the concessions, as well as limit spending to essential services. (Stillwater PR 7/31/14)_x000D_\n   In the March 2014 quarter, Stillwater reached an agreement with IPEEM to renew its exploration concessions through August 2015. (Stillwater 3/14 QR 5/1/14)_x000D_\n   In March 2014, Stillwater announced that Altar was a poor strategic fit for the company and it would no undertake any new exploration or drilling at the project in 2014. (Stillwater 12/13 QR 3/31/14)_x000D_\n  In January 2014, a technical report prepared by Independent Mining Consultants estimated M&I resources of 61.06 million oz Au for Altar and 1.725 million oz Au for Quebrada de la Mina. The resource estimation assumed Altar concentrates would be processed on site using POX+SXEW+Cn Leach and that QDM ores would be sent to the Altar plant on a campaign basis. (Stillwater TR Mar 31, 2014)_x000D_\n   As of April 2013, Stillwater had completed its 2013 drill program at Altar, which consisted of 20 holes totaling 11,100 m. (Stillwater 3/13 QR 4/29/13)_x000D_\n \tIn January 2013, it was reported that Stillwater would reduce spending at Altar due to the worsening political situation in Argentina. (BNA 1/25/13) _x000D_\n\tAs of October 2012, Stillwater expected political developments in Argentina to reduce exploration spending at Altar in 2013. (Stillwater PR 10/3/12)_x000D_\n\tIn August 2012, Stillwater reported results from its 27,280-m drill program. Results included 905 m grading 0.52% Cu, and 0.29 g/mt Au, and 549 m grading 0.61% Cu, and 0.04 g/mt Au. (Stillwater PR 8/8/12) \t_x000D_\n\tAs of April 2012, Stillwater had completed its 27,000-m drill program. A resources update was expected in late 2012. (Stillwater 3/12 QR 4/26/12)_x000D_\n\tAs of February 2012, Stillwater planned to continue with delineation drilling _x000D_\n\tat Altar (Stillwater PFR 2/21/12)_x000D_\n\tIn 2012, Stillwater had budgeted $25 million ($25 million) for exploration at Altar. The company intended to allocate $25 million/y (C$25 million/y) for three drilling seasons in order to complete a resource assessment. (Stillwater 12/11 AR 2/28/12)_x000D_\n\tIn October 2011, Stillwater completed the purchase of Peregrine Metals and its Altar project. (Stillwater PR 10/4/11)_x000D_\n\tIn late September 2011, Stillwater announced that the offering of senior notes had been withdrawn due to unfavorable market conditions. (Stillwater PR 9/26/11) Also, Peregrine shareholders approved the transaction with Stillwater. (Stillwater PR 9/27/11)_x000D_\n\tIn September 2011, Stillwater announced an offering of senior notes to raise $300 million. The proceeds, along with cash on hand, would be used in the acquisition of Peregrine Metals. (Stillwater PR 9/19/11)_x000D_\n\tIn July 2011, Stillwater Mining and Peregrine entered into a definitive agreement under which Stillwater would acquire Peregrine and its Altar project for $487.1 million in cash and shares. The purchase would be completed by September 30. Stillwater planned to invest $75 million over the next three years to fully delineate the Altar resources. (Stillwater PR 7/11/11)_x000D_\n\tIn early May 2011, Peregrine reported final drill results from the last two core holes completed at the Quebrada de la Mina gold porphyry target. Drilling indicated near-surface mineralization up to 700 m south of the first two core holes, with better results including 80 m grading 0.14 g/mt Au, 0.119% Cu, and 1 g/mt Ag in hole QDM-03, and 119.8 m grading 0.239 g/mt Au, 0.068% Cu, and 0.7 g/mt Ag in hole QDM-04. _x000D_\n\tPeregrine recently completed a geophysical survey at Quebrada which identified a target measuring 900 sq m with mineralization open to the north, south, and east, as well as an exploration sampling program of 1,005 samples over an area of 3 sq km with assay results grading up to 17.8 g/mt Au. (Peregrine PR 5/9/11) _x000D_\n\tAs of late March 2011, Peregrine sent eight 15-m-long intervals of drill core to G&T Metallurgical Services of Kamloops for flotation optimization, SAG, comminution, grinding, and abrasion tests. An RC drill program was under way to test for water resources and potential flow rates. Mining scenarious being considered in the economic assessment included 80,000 mt/d, 120,000 mt/d, and 160,000 mt/d. A deep drill program was planned for late in the year to follow up on hole ALD-43 which returned 322 m (starting at 602 m depth) grading 0.9% Cu. (Peregrine PR 3/31/11)_x000D_\n\tIn March 2011, Peregrine announced drill results from hole ALD-148 which was completed in February at Altar. The hole returned 432 m grading 0.312% Cu and 0.135 g/mt Au including 16 m grading 0.728% Cu and 0.224 g/mt Au. Peregrine believed this was a new near surface mineralized zone, extending known mineralization at Altar 300 m to the southeast. (Peregrine PR 3/3/11)_x000D_\n\tIn February 2011, Peregrine reported initial drill results from the Quebrada de la Mina target at the Altar project. The company had completed 1,005 m of drilling in four holes at the target to date with better drill results including an interval of 164 m grading 1.15 g/mt Au, 0.074% Cu, and 3.8 g/mt Ag in hole QDM-02, and an interval of 141 m grading 0.699 g/mt Au, 0.015% Cu, and 1.2 g/mt Ag in hole QDM-01. Additional results were pending and expected to be received during the March 2011 quarter. (Peregrine PR 2/23/11)_x000D_\n\tIn December 2010, Peregrine began the 2010/2011 field program at Altar. The program would include 2,000 m of metallurgical drilling to provide samples for flotation test work and an exploration drill program. The first target in the exploration program was the Quebrada de la Mina prospect 2 km northwest of Altar where rock chip sampling returned values averaging 0.7 g/mt Au._x000D_\n\tWork continued on the preliminary assessment including leach tests by McClelland Laboratories of Nevada. (Peregrine PR 12/15/10)","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":"In August 2012, Acme Analytical Laboratories, and ALS Minerals completed assaying samples from Stillwater's 2012 drill program. (Stillwater PR 8/8/12)\t_x000D_\n\tAs of late March 2011, Peregrine sent eight 15-m long intervals of drill core to G&T Metallurgical Services of Kamloops for flotation optimization, SAG, comminution, grinding, and abrasion tests.  (Peregrine PR 3/31/11)_x000D_\n\tIn February 2011, Acme Analytical Laboratories was contracted for sample preparation and analysis. (Peregrine PR 2/23/11)_x000D_\n\tIn October 2010, Peregrine announced updated measured, indicated, and inferred resources at Altar prepared by Nilsson Mine Services and GeoSim Services. (Peregrine PR 10/4/10)_x000D_\n\tAs of June 2010, Peregrine contracted McClelland Laboratories of Sparks and Philips Enterprises LLC of Golden to conduct metallurgical testing on drill core samples. (Peregrine PR 6/24/10)_x000D_\n\tAs of May 2010, the technical team working on the economic assessment included KD Engineering, Hydrometal, GeoSim Services, Nilsson Mine Services, BGC Engineering, Bethsabe Manzanares, and KJ Kuchling Consulting. A 627 kg sample of drill core was sent to McCelland Laboratories of Sparks, Nevada, for an initial phase of column leach test work. (Peregrine PR 5/11/10)","START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of January 2025, Altar cover an area of about 8,443.7 ha. (Aldebaran TR Jan 9, 2025)_x000D_\n   As of May 2024, Altar covered an area of 8,444 ha. (Osisko RPT May 14, 2024)_x000D_\n   As at December 2018, the Altar project consisted of nine mining concessions, one exploration permit and nine mining rights of way. (Sibanye RPT Dec 31, 2018)_x000D_\nAs of August 2018, the Altar project consisted of eight mining concessions, two exploration permits and nine mining rights of way (servidumbres). It also included an option on the 5 adjacent Rio Cenicero concessions. The Altar concessions collectively covered an area of about 8,443.7 ha and the Rio Cenicero concessions covered an additional 3,716.6 ha. (Regulus TR Aug 23, 2018)_x000D_\n   As of December 2016, Stillwater reported the project comprised 8 wholly-owned mining concessions and 5 optioned mining concessions. (Stillwater 12/16 10-K Feb 16, 2017)_x000D_\n   As of December 2015, Altar comprised of six mining concessions acquired from Rio Tinto by Perigrine, five mining concessions known as the Rio Cenicero concessions held under option since 2008. The conditions of the Rio Cenicero option agreement include an initial five-year term for conducting exploration after which the Company has the option to convert its rights on the Rio Cenicero concessions from exploration to exploitation status.  At commencement of commercial production monthly option payments cease and a net smelter return royalty of 1% becomes payable for all mineral products produced from the Rio Cenicero concessions. (Stillwater 12/15 AR Feb 22, 2016)_x000D_\n   The Altar property consists of eight wholly-owned mining concessions and five optioned mining concessions. Vaaldiam Mining held a 1% NSR from the first six mining concessions at Altar. The original concession owners held a 1% NSR (Robledo royalty) on four of the first six concessions, of which the company may purchase anytime for $1 million. (Stillwater 12/14 10K Feb 20, 2015)_x000D_\n   As of January 2014, Stillwater reported that Rio Tinto would retain the 1% NSR on all mineral products. (Stillwater TR Jan 31, 2014)","RESV_ORE_TONNAGE":0,"MEAS_IND_ORE_TONNAGE":2417313000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":2417313000,"INF_RESRC_ORE_TONNAGE":1216944000,"TOTAL_RESRC_ORE_TONNAGE":3634257000,"R_AND_R_ORE_TONNAGE":3634257000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Epithermal High Sulphidation, Porphyry Deposit","ORE_MINERALS":"Bornite, Chalcocite, Chalcopyrite, Covellite, Molybdenite","AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Altar","DISTANCE_FROM":"185 km W of San Juan","LOCATION_COMMENTS":"Altar is located in the Andes Mountains of Argentina, about 10 km from the Argentina-Chile border and about 180 km west of San Juan city. (Stillwater 12/14 10K Feb 20, 2015)  _x000D_\nThe Quebrada de la Mina (QDM) deposit is located some 3 km west of the Altar porphyry.   (Stillwater TR Jan 31, 2014)","ROYALTY_TYPE":"Net Smelter Return","ROYALTY_PCT":1,"GEOLOGY_COMMENTS":"The Altar project is primarily a copper-gold porphyry deposit with potential for discrete peripheral gold system targets. (Stillwater 12/14 10K Feb 20, 2015)  _x000D_\nThe copper mineralization at Altar includes both supergene chalcocite and hypogene chalcocite-covellite-bornite replacing earlier chalcopyrite within the upper 300 metres of the deposit. In several holes mineralization begins at surface. The vertical limits of the deposit are currently unknown and the mineralization extends below the depth of the deepest drill hole, DDH-ALD-43, which was drilled to 928.9 m of depth. (Peregrine PR 8/13/08)","EST_MINE_LIFE_YR":48,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":0,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":0.413,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":9995807,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":0.367,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":4460171,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":0.398,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":14455977,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":0.398,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":14455977,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":0.413,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":9995807,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":null,"GRD_RESV_Ag_gpt":null,"CONTAINED_RESV_Au_oz":0,"CONTAINED_RESV_Ag_oz":0,"GRD_MEAS_IND_Au_gpt":0.072,"GRD_MEAS_IND_Ag_gpt":1.24,"CONTAINED_MEAS_IND_Au_oz":5580000,"CONTAINED_MEAS_IND_Ag_oz":96090000,"GRD_INF_Au_gpt":0.045,"GRD_INF_Ag_gpt":1.254,"CONTAINED_INF_Au_oz":1730000,"CONTAINED_INF_Ag_oz":49250000,"GRD_TOTAL_RESRC_Au_gpt":0.062,"GRD_TOTAL_RESRC_Ag_gpt":1.235,"CONTAINED_TOTAL_RESRC_Au_oz":7310000,"CONTAINED_TOTAL_RESRC_Ag_oz":145340000,"GRD_R_AND_R_Au_gpt":0.062,"GRD_R_AND_R_Ag_gpt":1.235,"CONTAINED_R_AND_R_Au_oz":7310000,"CONTAINED_R_AND_R_Ag_oz":145340000},{"PROP_NAME":"Amiches","PROP_ID":56651,"PRIMARY_COMMODITY":"Gold","ALSO_KNOWN_AS":"Amiche Copper/Gold Project, Amphitheatre","DEV_STAGE":"Grassroots","ACTV_STATUS":"Active","MO_YR_SOURCE_DATE":"09/2019","MINE_TYPE1":null,"MINE_TYPE2":null,"MINE_TYPE3":null,"COMMODITIES_LIST":"Gold,Silver,Copper","OPERATOR_NAME":"Entropy Resources S.A.","OPERATOR_COMMON_NAME":"Entropy Resources S.A.","OPERATOR_COUNTRY":"Argentina","OPERATOR_MKT_CAP":null,"OWNER_LIST":"Entropy Resources S.A.  100%","ROYALTY_HOLDER_LIST":null,"OWNER_NAME":"Entropy Resources S.A.","CURRENT_OWNER_COMMON_NAME":"Entropy Resources S.A.","OWNER_TYPE":null,"OWNER_PCT":100,"CURRENT_CONTROLLING_OWN_PCT":100,"OWNER_COUNTRY":"Argentina","OWNER_MKT_CAP":null,"STATE_PROVINCE":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-30.22748,"LONGITUDE":-69.76248,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In August 2018, Antler Hill entered into a definitive agreement with Entropy SA to acquire the Cerro Blanco (profile 38836) and Amiches projects.  Antler Hill was planning to complete a 1,000-m drill program in the first year and a 3,000-m drill program in the second year.  (Antler Hill PR Sept 4, 2018)_x000D_\n   Tanga did not report on this project for two years. This property was presumed to have been relinquished. (S&P 6/16)_x000D_\n(Jun 3, 2014) Oro Verde advised that, after completing due diligence, it will not be proceeding to acquire the project from Argentina Mining Limited.\n(Apr 16, 2014) In accordance with the terms of the HoA with Argentina Mining, Oro Verde had until to 13 May 2014 to complete due diligence. The period has been extended to 3 June 2014.\n(Apr 11, 2014) March Quarter 2014 (Oro Verde): Surface sampling undertaken in February 2013 returned a number of highly encouraging results including 1m at 18.9 g/t Au + 389.5 g/t Ag, 2m at 12.4g/t Au + 200 g/t Ag, 2m at 3.9 g/t Au + 95 g/t Ag.\n(Apr 1, 2014) Oro Verde has executed a binding HoA with Argentina Mining Limited to acquire a suite of copper, gold and silver projects in the Andean Cordillera of San Juan Province, Argentina, including the Amiches project. Upon satisfactory due diligence (to be completed by 13 May 2014) $100,000 is due to be paid, with a further $100,000 on 8 July 2014.\n(Mar 19, 2014) Argentina Mining has entered into a non binding MOU whereby Oro Verde Limited will acquire Entropy Resources SA, the Argentine subsidiary which holds options to acquire the Cerro Blanco, San Francisco and Amiches projects. A binding HOA is to be executed by 31 March 2014 and Oro Verde will have up to 13 May 2014 to complete due diligence. The consideration for the transaction will be finalised in the HOA.","ENVIRO_COMMENTS":null,"SUBCONTRACTORS":null,"START_UP_YR":null,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":null,"DESCRIPTION_CLAIM":"As of September 2018, the Amiches property was comprised of three exploitation concessions covering an aggregate area of 1,015 ha. (Antler Hill PR Sept 4, 2018)","RESV_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE":null,"MEAS_IND_ORE_TONNAGE_INCL_RESV":null,"INF_RESRC_ORE_TONNAGE":null,"TOTAL_RESRC_ORE_TONNAGE":null,"R_AND_R_ORE_TONNAGE":null,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":null,"ORE_MINERALS":null,"AVG_DEPTH_GEOLOGIC_DEP":null,"ZONE_NAME":"Amiches","DISTANCE_FROM":"55 km WNW of Las Flores","LOCATION_COMMENTS":null,"ROYALTY_TYPE":null,"ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"(Oct 25, 2010)  The project area is located in the Frontal Cordilleramountain range. The Amiches Project area encloses porphyritic andesite and quartz andesites. In the NE sector, in the Quebrada Guanaco (a creek joining the Quebrada Amphitheatre), a breccia zone crosses the Quebrada. This zone is controlled by a vein-like hydrothermal breccia. This breccia exhibits moderate silicification over quartz sericite alteration. Disseminated and veined pyrite and undifferentiated copper sulphides are noted. The porphyritic andesites in this area have been subjected to pervasive propylitic alteration. In the far northeast of the area where monzogranitic intrusives outcrop, potassic feldsparstyle alteration gives the primary rock a pink colouration. There is widespread mildintensity pyritisation in the Quebrada Guanaco hydrothermal breccia zone and in the upper area of the Quebrada Amphitheatre.","EST_MINE_LIFE_YR":null,"GRD_RESV_Cu_p E":"San Juan","COUNTRY_NAME":"Argentina","LATITUDE":-31.1512,"LONGITUDE":-69.64051,"COORDINATE_ACCURACY":"Exact","GENERAL_COMMENTS":"In june 2026,Austral completed a two-month toll-processing campaign,processing 39,342 tonnes at greater than 85% GEO recovery. (Austral 6/26 QR July 30, 2026)_x000D_\n   In May 2026, Austral started an 8,500-m drilling program at Casposo-Manantiales consisting of 4,400-m infill drilling, 1,100-m brownfield drilling, and 3,000-m greenfield exploration drilling scheduled from the June 2026 quarter to December 2026 quarter. (Austral PR May 19, 2026)_x000D_\n  During the March 2026 quarter, Austral planned to start a drill program in May 2026 at Casposo and Manantiales. (Austral 3/26 QR Apr 30, 2026)_x000D_\n   In February 2026, Challenger commenced ore haulage from Hualilan to the Casposo Plant under its Toll Milling strategy. (Challenger PR Feb 27, 2026)_x000D_\n   December 2025, Austral announced that its subsidiary, Casposo Argentina Mining Ltd., signed two significant mining service agreements with local contractors to support planned mining development activities at the Julieta and Mercado open pits at the Casposo. (Austral PR Dec 24, 2025)_x000D_\n   In October 2025, Challenger Gold engaged Austral Gold's Casposo Toll Milling Plant to process a minimum of 450,000 tonnes of near-surface Hualilán mineralized material over three years. (Challenger RPT Oct 21, 2025)_x000D_\n   In October 2025, Austral reported resumption of commercial production in Casposo after completion of plant refurbishment. (Austral PR Oct 14, 2025)_x000D_\n   In September 2025, Austral reported completion of major refurbishment at Casposo, including SAG mill relining, new hydrocyclones, and filter band upgrades, with commissioning in progress. (Austral PR Sept 1, 2025)_x000D_\n   In June 2025 quarter, Austral reported its plans to resume the operations at Casposo. (Austral 6/25 AR Aug 28, 2025)_x000D_\n   In June 2025, a Preliminary Feasibility Study (PFS) was conducted for an open pit mining operation at Hualilan (Profile#29269) with a projected mine life of 34 months, utilizing the Hualilan Toll Milling Agreement with Austral Gold's Casposo mill. The open pit mining phase is expected to last for 24 months, with a total of 3.27 million tonnes of ore planned to be mined. Ore haulage is scheduled from October 2025 to September 2028, with processing at the mill planned from the December quarter of 2025 to the June quarter of 2028. A processing rate of 150,000 wmt/y is estimated at Casposo mill. (Challenger TR June 4, 2025)_x000D_\n   In April 2025, Austral reported that it plans to prepare a technical report assessing the feasibility of processing Casposo's mineralized material before completing the refurbishment of the Casposo Plant. Additionally, commercial operations are planned for second half of 2025. (Austral PR Apr 30, 2025)_x000D_\n    In December 2024, Austral entered into a Binding Memorandum of Understanding with Challenger to process Challenger’s Hualilan project at Casposo’s Plant. Under the terms of Toll Treatment Agreement, the Casposo Plant will be operated by Casposo Argentina Ltd. Sucursal Argentina, the guaranteed toll treatment of 150,000 tons available to Challenger per year, with a guaranteed toll treatment capacity available to Challenger of 450,000 tons over a three (3) year period, and Challenger agreed to pay US$3 million fixed payment (US$2 million payable within 15 days of signing the Binding MOU, US$1 million due in two years), a US$110,000 monthly fee, and an incentive fee linked to recovery margins. The operations were expected to start in the second half of 2025. (Austral PR Dec 5, 2024)_x000D_\n   During the September 2024 quarter, Austral reported that there was no production in September 2024 quarter at Casposo. (Austral 9/24 QR Oct 31, 2024)_x000D_\n   In July 2024, Austral updated mineral resource estimates at Casposo. (Austral PR July 16, 2024)_x000D_\n   During the March 2023 quarter, Austral reported that there was no production in March 2023 quarter at Casposo. (Austral 3/23 QR Apr 28, 2023)_x000D_\n   In the year ended 2022, Austral completed 6,585-m in 27-holes at Casposo. (Austral 12/22 AR Mar 30, 2023)_x000D_\n   In January 2023,, Austral completed a 15 hole, 4,265-m DD program at Casposo. (Austral PR Jan 30, 2023)_x000D_\n   In September 2022, Austral started 16-DD hole, 4,000-m drill program at Casposo-Manantiales. As of date 2,313-m in 12-DD hole were drilled along with a new drill program expected to include three to four drill holes at Cerro Amarillo. (Austral PR Sept 19, 2022)_x000D_\n   In July 2022, Austral reported that it planned to resume its drilling program and revisit remaining mineral resources at Casposo in September 2022. (Austral PR July 27, 2022)_x000D_\n   In the June 2022 quarter, Austral completed a drill program totaling 1,234 m at Manantiales and La Puerta Oeste. The company also completed first phase of drill testing in La Puerta, Awada, and Fabiola targets. (Austral 6/22 QR July 29, 2022) _x000D_\n   In April 2022, Austral announced that it completed a 14-hole, 2,800-m phase one drill program at Casposo in 2021. The company also reported that a phase two drill program commenced at Casposo this year. (Austral RPT Apr 28, 2022)_x000D_\n   During the year ended December 2021, The Casposo Mine continues to be on care and maintenance with a new drill phase planned to start in March 2022 quarter. (Austral 12/21 AR Mar 31, 2022) _x000D_\n   During the December 2021 quarter, There was no production reported in the period. The Casposo Mine continues to be on care and maintenance, although exploration activities commenced during the December 2019 quarter with the goal of recommencing processing_x000D_\noperations. (Austral 12/21 QR Jan 31, 2022)_x000D_\n   During the December 2020 quarter, Austral planned a drill program in the March 2021 quarter at Valentina followed by Manantiales and Cerro Amarillo. (Austral 12/20 QR Jan 29, 2021)_x000D_\n   During the September 2020 quarter, Austral reported no production at Casposo. (Austral 9/20 QR Oct 30, 2020)_x000D_\n   In April 2020, Austral had temporarily halted the exploration activities until 12 April, 2020 due to the mandatory isolation measures undertaken in response to COVID-19. (Austral PR Apr 9, 2020)_x000D_\n   As of December 2019, Casposo hosted 1.9 million mt of resources inclusive of reserves grading 4 g/mt Au and 157 g/mt Ag. (Austral 12/19 AR Mar 6, 2020)_x000D_\n   During the half year ended December 2019, Austral started 2,294-m DD program at Inca 3, followed by a drill program at Julieta planned in January 2020. (Austral 12/19 QR Dec 31, 2019)_x000D_\n   During the September 2019 quarter, Austral substantially completed care and maintenance work and scaling of the Casposo mine is expected in October 2019. (Austral 9/19 QR Oct 22, 2019)_x000D_\n   During the June 2019 quarter, Austral completed a comprehensive review of operations at Casposo and had decided to temporarily place the mine on care and maintenance. The company will retain a core team of employees to oversee the site, meet environmental monitoring_x000D_\nand legal obligations. In addition, an exploration drill program was planned during the second half of 2019. (Austral 6/19 QR July 31, 2019)_x000D_\nIn early April 2019, Austral had placed Casposo on care and maintenance. (Troy PR Apr 4, 2019)_x000D_\nIn 2018, Austral announced updated mineral reserves inclusive of resource estimate totaling 2.04 million mt grading 4.01 g/mt of Au and 165.9 g/mt of Ag at Casposo. The Company designed a brownfield exploration program for March 2019 quarter to further define mineralization at targets defined. (Austral 12/18 AR Mar 15, 2019)_x000D_\n   In 2018, Casposo produced 11,564 oz Au and 1.23 million oz Ag. (Austral 12/18 QR Jan 31, 2019)_x000D_\n   In January 2018, total production for 2018 was 26,836 Au Eq oz. (Austral PR Jan 22, 2019)_x000D_\n    As of March 2018, Austral started Julieta drill program for 13 holes and 1525-m and would continue during June 2018 quarter at its Casposo project. (Austral 3/18 QR Mar 31, 2018) _x000D_\n  During the December 2017 quarter, Austral forecasted to produce 24,000 oz of Au and 1.4 million oz of Ag in calendar year 2018 at Casposo. It began an underground drill program at Kamila. More drilling was expected to be undertaken in March 2018 quarter. (Austral 12/17 QR Jan 31, 2018)_x000D_\n   During the year ended June 2017, Austral began follow up at Julieta deposit in reference of the historical results of Casposo mine. The company planned initial trenching and mining work at Cerro Norte. Caposo resources totaled 2.41 million mt grading 3.5 g/mt Au and 185.2 g/mt Ag; and reserves totaled 819,000 mt grading 2.6 g/mt Au and 230.1 g/mt Ag. Reserves were inclusive in resources. (Austral 6/17 AR Sept 29, 2017)_x000D_\n   In March 2017, Austral acquired a further 19% interest, totaling 70% interest, in Casposo project by paying $1 million. (Austral PR Mar 6, 2017)_x000D_\n   During the December 2016 quarter, exploration activities around Casposo had started with a detailed ground mag survey at Julieta. (Troy 12/16 QR Jan 31, 2017)_x000D_\n   In late September 2016 Austral restarted full operations at Casposo following receipt of the results of an updated mineral resource and reserve estimate. A Technical Report confirmed that the optimisation of the plant and move to small scale mining will support a robust and economically viable underground gold and silver mine. The mine is anticipated to produce 21,000 oz gold and 1.7 million oz silver per year over the four-year mine life at an AISC of $1,038 Au Eq. LOM capital costs are $41.7 million, pre-tax NPV (5%) $53 million and after-tax NPV (5%) $37 million.   (Austral PR Sept 27, 2016; TR Sept 7, 2016)_x000D_\n   During the year ended June 2016, Troy conducted a labour restructuring program at Casposo. The plant completed processing activities and was also placed on care and maintenance in February._x000D_\nProduction during the period to 4 March 2016 at Casposo was at 17,214 oz Au and 1.67 million oz Ag. (Troy 6/16 AR Aug 29, 2016)_x000D_\n   As of the June 2016 quarter, technical studies and a new mine operational model were ongoing to prepare for the restart of commercial operations at Casposo. (Troy 6/16 QR June July 29, 2016)_x000D_\n   In March 2016, Troy entered into an agreement with Austral for the sale of its interest at Casposo. Under the agreement, Austral would acquire 51% interest in the property for $3 million payable in three staged payments for not later than 12 months; Austral would also be entitled to a further 19% interest by paying $1 million within 12 months; Troy granted Austral an option to acquire the remaining 30% over a three year period starting in December 2018 for a total of $7 million; Austral would provide up to $10 million pursuant to an initial capital investment plan to develop Casposo; and the company's interest in relation to the capital investment plan would be free carried. (Troy PR Mar 7, 2016)_x000D_\n   As of half year ended December 2015, the Casposo plant was transitioning to care and maintenance and all mining activities had been suspended. (Troy  PR Feb 26, 2016)_x000D_\nAs at June 2015, JORC-compliant resources inclusive of reserves for Casposo totaled 1.99 million mt grading 3.49 g/mt Au and 200.6 g/mt Ag. (Troy PR Aug 31, 2015)_x000D_\nFor fiscal year 2015, Casposo produced 55,859 oz Au and 3.1 million oz Ag. (Troy 6/15 QR July 31, 2015)_x000D_\nIn 2015, Casposo was estimated to produce 60,000 oz Au and 3.76 million oz Ag. (Troy PRES Feb 20, 2015)_x000D_\n   During the December 2014 quarter, the mine produced 16,463 oz Au and 694,754 oz Ag. (Troy 12/14 QR Jan 29, 2015)_x000D_\n   During the September 2014 quarter, mining from both the Kamila and Mercado open pits were completed and all production would now come from Casposo’s underground operations. Also, the offshoot ramp to the Inca 2 deposit and the first vent raise was completed. The Inca 2 ramp and the continuation of the Inca 1 ramp to levels 14 and 15 would be initiated during the December 2014 quarter._x000D_\n   In addition, field work focused on the Met Station target where a detailed outcrop and structural mapping was completed. Also, a ground follow-up targeting work would focus on the Kamila offset area east of the mine. (Troy 9/14 QR 10/30/14)_x000D_\n   In fiscal year 2014, Casposo produced 62,742 oz Au and 2.5 million oz Ag at cash costs of $390/oz Au, net of silver credits._x000D_\nDuring the June 2014 quarter, underground drilling began at Casposo. Highlights included 0.75 m grading 31.51 g/mt AuEq, 1.35 m grading 15.76 g.mt AuEq, and 1.9 m grading 10.13 g/mt AuEq. To date, a total of 15 holes in 2,000 m were completed. Drilling continued._x000D_\n   In addition, field work focused at the Polvorin and the Met Station targets to define the next generation of targets. Detailed followup work continued. (Troy 6/14 QR 7/29/14)_x000D_\nIn June 2014, Troy reported updates at its Casposo project. The company reported that a series of rockfalls occurred in one of the stopes within the INCA 1 zone. The area impacted was above level 9 and 10. A mine plan review was underway. In addition, an inspection of mill liners resulted in a six-day maintenance in July. Troy reported that June quarter production was expected to be lower than the planned 27,000 oz AuEq. (Troy PR 6/11/14)_x000D_\nDuring the March 2014 quarter, fieldwork focused at the Polvorin, Victoria East, Lenador, Victoria, Daniela-Panzon Trend, Julieta East and Julieta South. New drill targets would be defined from magnetics and IP data coupled with results of ongoing multi-element geochemical sampling and alteration mapping. (Troy 3/14 QR 4/28/14)_x000D_\nIn February 2014, Troy announced a capital raising through a A$28 million private placement and A$10 million share purchase plan. A portion of the proceeds would be used to begin brownfields exploration at Casposo. (Troy PRES 2/26/14)_x000D_\nIn early February 2014, Troy reported channel sampling results at Casposo. Better results included 4.3 m grading 41.61 g/mt Au and 2,430.04 g/mt Ag from 2285SE Drive, and 2.7 m grading 22.21 g/mt Au and 1,592.14 g/mt Ag from 2300SE Drive. (Troy PR 2/3/14)_x000D_\nAs of November 2013, Troy expected to install a second mill at Casposo before the end of the fiscal 2014. (Troy PR 11/27/13)_x000D_\n\tDuring year ended June 2013, Troy reported that Casposo completed its second year of production and transitioned from open pit to underground with first stope production forecast by the March 2014 quarter. (Troy 6/13 AR 9/26/13)_x000D_\n\tAs at June 2013, Casposo hosted probable reserves of 1.63 million mt grading 4.5 g/mt Au and 284 g/mt Ag, included within the measured resources totaling 171,000 mt grading 5 g/mt Au and 725 g/mt Ag and indicated resources totaling 2.04 million mt grading 4.1 g/mt Au and 206 g/mt Ag. Inferred resources totaled 801,000 mt grading 3.6 g/mt Au and 129 g/mt Ag. _x000D_\n\tIn addition, an exploration program at Casposo was expected to restart by 2014 June quarter. (Troy PRES 9/16/13)   _x000D_\n\tDuring the fiscal year 2013, Troy installed a ball mill at Casposo in series with its previously installed SAG mill. The project was shifted from an open pit mining to underground mining, with first stope production expected by the first quarter of 2014 fiscal year. (Troy 6/13 PFR 8/29/13)_x000D_\n\tIn the June 2013 quarter, Casposo produced 13,728 oz Au and 413,396 oz Ag. In addition, Troy reported results of its completed stepout drill program at Inca. Highlights included 2.75 m grading 27.77 g/mt Au and 300 g/mt Ag, including 0.5 m grading 139.54 g/mt Au and 1,587 g/mt Ag in hole CA-13-553; and 1.35 m grading 59.87 g/mt Au and 729 g/mt Ag in hole CA-13-561. Further drilling was planned. _x000D_\n\tStill during the June 2013 quarter, a DD program was completed at the Julieta target and a geophysical survey was completed in the northwestern area between the Daniela and Julieta target. (Troy 6/13 QR 7/29/13)_x000D_\n\tIn late June 2013, Troy reported changes in its exploration strategy at Casposo. The changes would result to costs reduction in the company's exploration expenditure in fiscal year 2014._x000D_\n\tIn addition, the company completed its 600-m infill and stepout drill program at the Inca target. Further drill program at the Main Kamila was planned when underground development reached the area by the 2015. Troy also completed its geophysics program at the northwest part of Julieta. Surface mapping, geochemical sampling, and followup ground geophysics programs were planned at the northwest part by the June 2014 quarter. (Troy PR 6/26/13)_x000D_\n\tIn late March 2013, Troy announced additional drill results for the \"Inca Gap\" at Casposo. The best drill result was CA-13-543 and included 1.1 m grading 198.01 g/mt Au and 18,670 g/mt Ag  from 278 m. (Troy PR 3/24/13)_x000D_\n\tAs of January 2013, Troy expected Casposo to produce 95,000 oz  to 105,000 oz AuEq in fiscal 2013. (Troy 12/12 QR 1/30/13)_x000D_\n\tIn the September 2012 quarter, the arrival of a development drill at Casposo was delayed to early October, which put the project behind three months on its underground development. Troy approved the addition of a ball mill in open circuit with the current SAG mill, which was expected to cost $3.1 million (A$3 million). Due to the large stockpile on site, the company expected to increase throughput by 15%. Exploration drilling continued at the property. (Troy 9/12 QR 10/22/12)_x000D_\n\tIn July 2012, a report on the Casposo project recommended compilation of all data, studies related to structure and clay mineralogy zonation, channel sampling, and drill testing. At Castano Nuevo, recommendations included testing of the San Agustin vein. (Troy RPT 7/12/12) _x000D_\n\tIn the fiscal year ended June 2012, Casposo produced 70,989 oz Au and 937,208 oz Ag with cash costs of $404/oz Au on a byproduct basis. During the year, Troy spent $7.9 million on exploration, primarily related to increasing reserves at Casposo. Development of underground mine access was under way. (Troy 6/12 PFR 8/24/12)  _x000D_\n\tIn May 2012, Troy updated reserves and resources at Casposo. Probable reserves contained 316,000 oz Au and 15.54 million oz Ag, included within measured and indicated resources of 2.34 million mt grading 4.25 g/mt Au and 259 g/mt Ag. _x000D_\n\tThe new reserves estimate and associated mine plan would see underground development accelerating and was projected to support a 40% increase in gold equivalent production from fiscal 2012 to fiscal 2013. High grade Inca 2 ore would begin to be processed in 2013. Open pit ore was expected to be depleted in 2015 and processing of ore was expected to continue through 2017. _x000D_\n\tDevelopment of the portal for the underground mine was under way and decline development was scheduled to begin in July. First ore from the underground mine was expected to enter the mill blend early in calendar 2013. _x000D_\n\tTroy had budgeted $25 million in exploration over the next two years, and planned to continue testing outcropping vein and geophysical targets at the property and two nearby JV properties. Drilling was under way at the SEXT/B Vein target. (Troy PR 5/30/12)_x000D_\n\tIn the March 2012 quarter, stepout drilling southwest of Dyke 3 at Casposo returned better results including an intercept of 2.95 m grading 7.93 g/mt Au and 15 g/mt Ag. Troy spent 1.47 million (A$1.4 million) on exploration and $840,000 (A$800,000) on capital projects during the quarter. _x000D_\n\tThe portal site for the underground mine had been prepared with waste development scheduled to begin early in the December 2012 quarter. Troy expected to access the first high grade underground ore in early calendar 2013. (Troy 3/12 QR 4/17/12)","ENVIRO_COMMENTS":"As of August 2011, a preliminary closure and reclamation plan for Casposo had estimated costs of $1.3 million. (Troy RPT 10/11/11)_x000D_\n   In April 2007, Intrepid submitted an Environmental Impact Assessment (EIA) for the Casposo project, which identified no material issues with the proposed development project. (Intrepid 12/08 AR 4/1/09)_x000D_\n   In 2006, environmental baseline studies including two faunal surveys were completed at Casposo by Knight Piesold. (Troy RPT 10/11/11)","SUBCONTRACTORS":"In December 2025, Austral contracted ADL S.R.L. for drilling and blasting services at Casposo. (Austral PR Dec 24, 2025)_x000D_\n   In July 2012, Hedenquist Consulting completed a report on the Casposo project for Troy Resources. (Troy RPT 7/12/12) _x000D_\n   As of June 2012, development of underground mine access was under way with Redpath and BTZ as the contractors. (Troy 6/12 PFR 8/24/12) _x000D_\n   As of March 2012, Troy continued negotiations with international mining contractor Redpath, and Argentinean mining contractor BTZ regarding development of the underground mine at Casposo. (Troy 3/12 QR 4/17/12)_x000D_\n   As of the end of the December 2011 quarter, Troy was in negotiations with its preferred mining contractor, Redpath (Chile) regarding mining at Casposo. (Troy 12/11 QR 1/31/12)_x000D_\n   In August 2011, Auralia Mining Consultants completed a resource estimate at Casposo. (Troy PR 10/12/11) Mineral Engineering Technical Services (METS) of Perth, Western Australia developed a processing flowsheet for the project. _x000D_\nIn 2011, drilling was completed by Energold Argentina, and Eco-Minera Mining Services Argentina. Drill samples were prepared and assayed by Alex Stewart (Assayers) Argentina Laboratory in Mendoza Argentina. (Troy RPT 10/11/11)_x000D_\n   In September 2010, Troy contracted Quantec Geoscience Argentina SA to complete a geophysics program at Casposo. (Troy 9/10 QR 10/27/10)_x000D_\n   Between 2009 and 2010, drilling at Casposo was completed by Boart-Longyear Argentina.  (Troy RPT 10/11/11)_x000D_\n   In early August 2008, Intrepid Mines announced that it contracted Argentine engineering firm, Ingenieria PENTA Sur, to design and procure a 1,000 mt/day conventional Au-Ag whole leach recovery plant, and associated facilities for Casposo. (Intrepid PR 8/6/08) _x000D_\n   In July 2008, Intrepid engaged AMEC to review the Casposo feasibility study. (Intrepid PR 7/17/08)_x000D_\n   In 2005, Intrepid commissioned AMEC Peru to undertake the feasibility study of initial metallurgy, geotechnical investigations, mining method selection, facilities siting, and financial modelling._x000D_\n   Environmental and social baseline and impact studies were subcontracted to Knight Piesold. (Intrepid 6/06 AR 10/31/06)_x000D_\n   In December 2004, chemical analysis was completed by ALS Chemex Chile.  (Intrepid PR 12/2/04)_x000D_\n   In 2003, sample testing of the composites was conducted by the IIM-Instituto de Investigaciones Mineras, an organization within the Universidad Nacional de San Juan.  Previous test results were verified by Kappes Cassiday and Associates, of Reno Nevada. (Intrepid PR 8/19/03)","START_UP_YR":2010,"PROJ_START_UP_YR":null,"ACTUAL_CLOSURE_YR":null,"PROJ_CLOSURE_YR":2031,"DESCRIPTION_CLAIM":"As of October 2025, Casposo-Manantiales claim block is comprised of 25 mining claims which cover an area of 52,055 ha. (Austral TR Oct 14, 2025)_x000D_\n   As of July 2024, The Casposo-Manantiales claim block is comprised of 25 mining claims which cover an area of 48,611 ha. Casposo Mine mining rights comprise one contiguous block of exploitation or mining concessions that covers an area of 28,510 ha. (Austral TR July 19, 2024)_x000D_\n   As of the September 2018 quarter, Casposo covered an area of 44,869 ha. (Austral 9/18 QR Oct 31, 2018)_x000D_\n   As of July 2018, Casposo covers an area of 100.21 sq km. (Austral 6/18 QR July 31, 2018)_x000D_\nAs of the September 2017 quarter, Casposo covered an area of 40,050 ha. (Austral 9/17 QR Oct 31, 2017)_x000D_\n   As of September 2016, the Mine comprised three mining leases, eight Manifestaciones de Descubrimiento (Discovery Concessions), eight exploration Cateos (Exploration Concessions), and three Canteras (Quarry Permits), for a total area of 39.35 sq km. (Austral TR Sept 7, 2016)_x000D_\n   As of May 2012, development of an underground portal was under way at Casposo in the B Vein pit, to the southeast of the main Kamila Pit. (Troy PR 5/30/12) _x000D_\n   In mid-December 2011, the Casposo operation was connected to the State Power Grid. The Natalia vein system is located to the east of the Cerro Norte fault. (Troy 12/11 QR 1/31/12)_x000D_\n   As of August 2011, the Casposo project covered an area of 100.21 sq km, comprising two mining leases, four exploration concessions, and one application stage mining lease. (Troy RPT 10/11/11) In June 2011, Troy entered an earn-in option agreement to earn a 100% interest in the Don David property located adjacent to the Castano Nuevo property at Casposo. Consideration comprised a series of staged cash payments and exploration expenditures of $1.15 million over a four-year period. (Troy 6/11 QR 7/26/11)_x000D_\n   Casposo Norte is located 4 km north of the mill. (Troy PR 7/16/10)_x000D_\n   During the fiscal year 2010, Troy entered into an earn-in option agreement to earn a 100% interest. The option would be earned through in-ground expenditures and a four-year staged payment plan totaling $1.1 million. (Troy 6/10 AR 1/26/10)_x000D_\n   As of April 2009, the Casposo project totaled 35 sq km. (Intrepid 12/08 AR 4/1/09)_x000D_\n   As of 2006, the Kamila mining lease was subject to a production royalty of $5/oz AuEq in favor of the vendors upon production, net any advanced royalties. The vendor royalty agreement was also subject to a five-kilometer \"area of influence\" surrounding the Kamila Mine, providing that any new land would be subject to the same original terms. (Troy RPT 10/11/11) _x000D_\n   As of September 2006, Julieta was considered by Intrepid as a satellite deposit to the Kamila Mine, currently under feasibility study. The Julieta discovery was a 1-km-long vein structure located four km northwest of Kamila. (Intrepid PR 9/11/06) _x000D_\n   As of July 2006, the Cerro Norte zone was located about 700 m NE of the proposed Kamila open pit. (Intrepid PR 7/27/06)_x000D_\n   As of August 2004, Casposo contained 30 sq km of epithermal vein systems. (BNA 8/25/04)_x000D_\n   In June 2004, Intrepid optioned Exeter Resource's adjacent Rosarita property in an effort to expand its Kamila zone at Casposo. (BNA 6/10/04)_x000D_\n   The Mercado and Panzon prospects are located NW of the Kamila zone and within the Rocio de Oro zone. (Intrepid PR 10/17/03)_x000D_\n   The Mercado Zone is 500 m long and represented the NW continuation of Kamila. (Intrepid PR 8/19/03)","RESV_ORE_TONNAGE":2149000,"MEAS_IND_ORE_TONNAGE":109000,"MEAS_IND_ORE_TONNAGE_INCL_RESV":2258000,"INF_RESRC_ORE_TONNAGE":173000,"TOTAL_RESRC_ORE_TONNAGE":282000,"R_AND_R_ORE_TONNAGE":2431000,"CURRENT_COPPER_EVALUATION_PRICE_PER_LB":5.18,"GEOLOGIC_ORE_BODY_TYPE":"Epithermal Low Sulphidation","ORE_MINERALS":"Argentite, Chalcopyrite, Electrum, Native, Pyrite","AVG_DEPTH_GEOLOGIC_DEP":70,"ZONE_NAME":"Julieta","DISTANCE_FROM":"30 km NW of Calingasta","LOCATION_COMMENTS":"Castano Nuevo was located 22 km from Casposo. (BNA 12/22/09)_x000D_\n   The Casposo project is at an average elevation of 2,500 m in rugged, rocky terrain, 150 km NW of San Juan. The nearest town is Calingasta, a small village about 30 km to the SE. The property is road-accessible, with a paved road within 5 km of the property boundary. A hydro-generated power line passes within 10 km of the site. (NM 5/12/03)","ROYALTY_TYPE":"Net Smelter Return","ROYALTY_PCT":null,"GEOLOGY_COMMENTS":"The Julieta prospect comprises a series of structurally related composite vein sets with north and northwest trends. These vein systems occur within a vitreous rhyolite - dacite volcanic unit which has been altered and exhibits quartz-carbonate stockwork throughout the areas occupied by the veins. The veins are generally composed of banded quartz and lattice textured calcite and often contain both brecciated wallrock and secondary quartz-carbonate breccia material. At least one structure hosting vein material is also occupied by an altered felsic dyke. (Intrepid PR 3/3/06)_x000D_\n   Mineralization and veining is contained within a complex structure which is also shared by a later rhyolite dyke intrusion. The dyke can displace or truncate the Julieta vein locally. Drill holes JU-06-19, to -23, -25 and -26 intersected the Julieta vein structure and encountered minor amounts of vein but no significant values. _x000D_\nGold is contained in banded veins and quartz-carbonate stockwork breccias which locally exhibit strong fluidization features. Gold is accompanied by low values of silver. (Intrepid PR 9/11/06)","EST_MINE_LIFE_YR":6.2,"GRD_RESV_Cu_pct":null,"GRD_RESV_Li_pct":null,"CONTAINED_RESV_Cu_t":null,"CONTAINED_RESV_Li_t":null,"GRD_MEAS_IND_Cu_pct":null,"GRD_MEAS_IND_Li_pct":null,"CONTAINED_MEAS_IND_Cu_t":null,"CONTAINED_MEAS_IND_Li_t":null,"GRD_INF_Cu_pct":null,"GRD_INF_Li_pct":null,"CONTAINED_INF_Cu_t":null,"CONTAINED_INF_Li_t":null,"GRD_TOTAL_RESRC_Cu_pct":null,"GRD_TOTAL_RESRC_Li_pct":null,"CONTAINED_TOTAL_RESRC_Cu_t":null,"CONTAINED_TOTAL_RESRC_Li_t":null,"GRD_R_AND_R_Cu_pct":null,"GRD_R_AND_R_Li_pct":null,"CONTAINED_R_AND_R_Cu_t":null,"CONTAINED_R_AND_R_Li_t":null,"GRD_MEAS_IND_INCL_RESV_Cu_pct":null,"GRD_MEAS_IND_INCL_RESV_Li_pct":null,"CONTAINED_MEAS_IND_INCL_RESV_Cu_t":null,"CONTAINED_MEAS_IND_INCL_RESV_Li_t":null,"GRD_RESV_Au_gpt":1.16,"GRD_RESV_Ag_gpt":47.42,"CONTAINED_RESV_Au_oz":80000,"CONTAINED_RESV_Ag_oz":3276000,"GRD_MEAS_IND_Au_gpt":7.71,"GRD_MEAS_IND_Ag_gpt":306.18,"CONTAINED_MEAS_IND_Au_oz":27000,"CONTAINED_MEAS_IND_Ag_oz":1073000,"GRD_INF_Au_gpt":7.52,"GRD_INF_Ag_gpt":68.54,"CONTAINED_INF_Au_oz":42000,"CONTAINED_INF_Ag_oz":381000
